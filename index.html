        ${ tab==='out'&&q.status!=='answered'?`<div class="muted center" style="margin-top:8px">Đang chờ ${esc(partner()||'người ấy')} học…</div>`:'' }
      </div>`;}).join('') : `<div class="empty">${ic('inbox','lg')}<div>${tab==='in'?'Chưa có bài nào gửi cho bạn.':'Bạn chưa gửi chủ đề nào.<br>Vào Học → chọn chủ đề → Gửi.'}</div></div>` }`; }

/* ---------- STUDY (thẻ lật + trắc nghiệm) ---------- */
function viewStudy(){ return S.play.mode==='flash' ? flashView(S.play) : S.play.mode==='grammar' ? grammarPracticeView(S.play) : quizView(S.play); }

/* ---------- LUYỆN NGỮ PHÁP (chia động từ + trắc nghiệm) ---------- */
function grammarPracticeView(p){ const total=p.questions.length;
  if(p.done){ const pct=total?Math.round(p.score/total*100):0, msg=pct>=80?'Giỏi quá đi':pct>=50?'Cố thêm chút nha':'Ôn lại rồi thử lại nhé';
    return `<div class="screen center">
      <div class="brand-mark" style="margin:18px auto 0">${ic(pct>=80?'trophy':'heart')}</div>
      <h1 style="margin:14px 0 4px">${p.score}/${total} đúng</h1><p style="font-weight:700">${msg}</p>
      ${p.streakUp?`<div class="card" style="background:linear-gradient(150deg,var(--p1),var(--p2));color:#fff;margin-top:12px">
        <b style="font-size:19px">Chuỗi ${S.space.streak} ngày</b><div style="opacity:.9">Giữ được chuỗi hôm nay rồi</div></div>`:''}
      <div class="row" style="gap:10px;margin-top:16px">
        <button class="btn ghost block" data-act="restudy">Làm lại</button>
        <button class="btn block" data-act="finish-play">Xong</button></div></div>`; }
  const q=p.questions[p.idx], fb=(p.phase==='feedback');
  return `<div class="screen">
    <div class="row" style="margin-bottom:8px"><button class="iconbtn" data-act="quit-play">${ic('x','sm')}</button>
      <div class="grow center" style="font-weight:800">Câu ${p.idx+1}/${total}</div><div style="width:38px"></div></div>
    ${progressBar(p.idx/total*100)}
    ${ q.type==='mc' ? grMcBody(q,p,fb) : grConjBody(q,p,fb) }`; }

function grConjBody(q,p,fb){
  return `<div class="card" style="padding:22px 16px">
      <div class="muted" style="font-weight:700;margin-bottom:8px">Chia động từ / điền vào chỗ trống</div>
      <div style="font-family:'Fraunces';font-size:19px;line-height:1.5">${esc(q.q)}</div></div>
    <input id="gr_input" placeholder="Điền đáp án..." autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" ${fb?'disabled':''} value="${esc(p.answerGiven||'')}" style="text-align:center;font-size:18px"/>
    ${ fb ? grFeedback(p,q) : `<button class="btn block" style="margin-top:12px" data-act="check-grammar">Kiểm tra</button>` }`; }

function grMcBody(q,p,fb){
  return `<div class="card" style="padding:22px 16px">
      <div style="font-family:'Fraunces';font-size:18px;line-height:1.5">${esc(q.q)}</div></div>
    ${q.options.map((opt,i)=>{ let cls='btn ghost block', style='justify-content:flex-start;text-align:left;margin-bottom:10px';
        if(fb){ if(i===q.answer){ cls='btn block'; style+=';background:linear-gradient(135deg,var(--ok),#8fc4ac);border:none;color:#fff'; }
                else if(i===p.chosen){ cls='btn block'; style+=';background:#f1c7ce;border:none;color:var(--no)'; }
                else style+=';opacity:.45'; }
        return `<button class="${cls}" style="${style}" ${fb?'disabled':''} data-act="grammar-mc" data-v="${i}">${esc(opt)}</button>`;
      }).join('')}
    ${ fb?grFeedback(p,q):'' }`; }

function grFeedback(p,q){ const ok=p.lastCorrect;
  const ans = q.type==='mc' ? q.options[q.answer] : q.answer;
  return `<div class="card" style="background:${ok?'var(--chip)':'#fdeef0'};margin-top:12px">
      <b style="color:${ok?'var(--ok)':'var(--no)'}">${ok?'Chính xác! 🎉':'Chưa đúng'}</b>
      ${ !ok?`<div style="margin-top:4px">Đáp án: <b>${esc(ans)}</b></div>`:'' }
      ${ q.explain?`<div class="muted" style="margin-top:6px">💡 ${esc(q.explain)}</div>`:'' }</div>
    <button class="btn block" data-act="next-q">${p.idx+1<p.questions.length?'Câu tiếp':'Xem kết quả'}</button>`; }

function flashView(p){ const total=p.cards.length;
  if(p.done){
    return `<div class="screen center">
      <div class="brand-mark" style="margin:18px auto 0">${ic('spark')}</div>
      <h1 style="margin:14px 0 4px">Đã xem hết ${total} thẻ</h1><p style="font-weight:700">Giỏi lắm! Giờ thử kiểm tra nha.</p>
      ${p.streakUp?`<div class="card" style="background:linear-gradient(150deg,var(--p1),var(--p2));color:#fff;margin-top:12px">
        <b style="font-size:19px">Chuỗi ${S.space.streak} ngày</b><div style="opacity:.9">Giữ được chuỗi hôm nay rồi</div></div>`:''}
      <div class="row" style="gap:10px;margin-top:16px">
        <button class="btn ghost block" data-act="restudy">Xem lại</button>
        <button class="btn block" data-act="to-quiz">${ic('spark','sm')} Làm trắc nghiệm</button></div>
      <button class="btn soft block" style="margin-top:10px" data-act="finish-play">Xong</button></div>`; }
  const c=p.cards[p.idx]; const canPrev=p.idx>0;
  return `<div class="screen">
    <div class="row" style="margin-bottom:8px"><button class="iconbtn" data-act="quit-play">${ic('x','sm')}</button>
      <div class="grow center" style="font-weight:800">Thẻ ${p.idx+1}/${total}</div><div style="width:38px"></div></div>
    ${progressBar(p.idx/total*100)}
    <div class="flash-wrap" style="margin-top:6px">
      <div class="flash ${p.flip?'flip':''}" data-act="flip"><div class="inner">
        <div class="face front"><span class="sticker">${flashSticker(p.idx)}</span><span class="sticker r">✨</span>
          <div class="term" style="font-size:${fitPx(c.en)}px">${esc(c.en)}</div><div class="hint">chạm giữa để lật · rìa để qua thẻ</div></div>
        <div class="face back"><span class="sticker">💡</span><span class="sticker r">💕</span>
          <div class="term" style="font-size:${Math.min(24,fitPx(c.vi))}px">${esc(c.vi)}</div><div class="hint">chạm để lật lại</div></div>
      </div></div>
      <div class="edge-nav left ${canPrev?'':'off'}" ${canPrev?'data-act="prev-card"':''} title="Thẻ trước"><span class="chev">‹</span></div>
      <div class="edge-nav right" data-act="next-card" title="${p.idx+1<total?'Thẻ tiếp':'Xong'}"><span class="chev">›</span></div>
    </div>
    ${coupleDoodle()}
    <button class="btn soft block" style="margin-top:4px" data-act="speak-word">🔊 Đọc từ vựng</button>

/* doodle cặp đôi vẽ tay dễ thương dưới thẻ */
function coupleDoodle(){ return `<svg class="couple-doodle" width="128" height="54" viewBox="0 0 128 54" fill="none" aria-hidden="true">
    <g stroke="var(--edge)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="40" cy="22" r="9" fill="var(--p2)"/>
      <path d="M31 46c0-9 4-14 9-14s9 5 9 14" fill="var(--card)"/>
      <circle cx="88" cy="22" r="9" fill="var(--p1)"/>
      <path d="M79 46c0-9 4-14 9-14s9 5 9 14" fill="var(--card)"/>
      <path d="M49 40c5 3 9 3 14 0M65 40c5 3 9 3 14 0"/>
    </g>
    <path d="M64 6c-2.4-3-7.6-2.6-7.6 1.6 0 3.2 4.4 6 7.6 8.4 3.2-2.4 7.6-5.2 7.6-8.4 0-4.2-5.2-4.6-7.6-1.6Z" fill="var(--p1)" stroke="var(--edge)" stroke-width="2"/>
  </svg>`; }
const FLASH_STICKERS=['🌱','⭐','🍀','🌸','📚','🔤','🧠','☕','🐣','🎈'];
function flashSticker(i){ return FLASH_STICKERS[i%FLASH_STICKERS.length]; }
/* Khối ví dụ AI dưới thẻ lật — cache theo từ trong S.play.exCache */
function flashExample(c){ const ex=(S.play.exCache||{})[c.en];
  if(ex==='loading') return `<div class="card center" style="margin-top:12px"><div class="muted">${ic('spark','sm')} Đang nghĩ ví dụ…</div></div>`;
  if(ex&&ex.error) return `<button class="btn ghost block" style="margin-top:12px" data-act="ai-example">${ic('spark','sm')} Thử lại xin ví dụ</button>`;
  if(ex) return `<div class="card" style="margin-top:12px;border:1px solid var(--p2)">
      <div class="label" style="margin-top:0">${ic('spark','sm')} Ví dụ (AI)</div>
      ${ex.meaning_note?`<p style="margin:0 0 8px;font-size:13px;font-weight:700;color:var(--no)">⚠️ ${esc(ex.meaning_note)}</p>`:''}
      <p style="margin:0 0 6px;font-weight:700">${esc(ex.example||'')}</p>
      ${ex.example_vi?`<p class="muted" style="margin:0 0 8px">${esc(ex.example_vi)}</p>`:''}
      ${ex.usage?`<p style="margin:0;font-size:14px"><b>Cách dùng:</b> ${esc(ex.usage)}</p>`:''}</div>`;
  return `<button class="btn ghost block" style="margin-top:12px" data-act="ai-example">${ic('spark','sm')} Xin ví dụ (AI)</button>`; }

function quizView(p){ const total=p.questions.length;
  if(p.done){ const pct=total?Math.round(p.score/total*100):0, msg=pct>=80?'Giỏi quá đi':pct>=50?'Cố thêm chút nha':'Không sao, học lại lần nữa nhé';
    return `<div class="screen center">
      <div class="brand-mark" style="margin:18px auto 0">${ic(pct>=80?'trophy':'heart')}</div>
      <h1 style="margin:14px 0 4px">${p.score}/${total} đúng</h1><p style="font-weight:700">${msg}</p>
      ${p.streakUp?`<div class="card" style="background:linear-gradient(150deg,var(--p1),var(--p2));color:#fff;margin-top:12px">
        <b style="font-size:19px">Chuỗi ${S.space.streak} ngày</b><div style="opacity:.9">Giữ được chuỗi hôm nay rồi</div></div>`:''}
      <div class="row" style="gap:10px;margin-top:16px">
        <button class="btn ghost block" data-act="restudy">Học lại</button>
        <button class="btn block" data-act="finish-play">Xong</button></div></div>`; }
  const q=p.questions[p.idx], fb=(p.phase==='feedback');
  return `<div class="screen">
    <div class="row" style="margin-bottom:8px"><button class="iconbtn" data-act="quit-play">${ic('x','sm')}</button>
      <div class="grow center" style="font-weight:800">Câu ${p.idx+1}/${total}</div><div style="width:38px"></div></div>
    ${progressBar(p.idx/total*100)}
    ${ q.kind==='mc' ? mcBody(q,p,fb) : scrambleBody(q,p,fb) }`; }

function mcBody(q,p,fb){
  return `<div class="card center" style="padding:24px 16px">
      <div class="muted" style="font-weight:700">Nghĩa của ${q.en.includes(' ')?'cụm':'từ'} này là gì?</div>
      <div style="font-family:'Fraunces';font-size:${fitPx(q.en)}px;margin-top:6px">${esc(q.en)}</div></div>
    ${q.options.map((opt,i)=>{ let cls='btn ghost block', style='justify-content:flex-start;text-align:left;margin-bottom:10px';
        if(fb){ if(opt===q.vi){ cls='btn block'; style+=';background:linear-gradient(135deg,var(--ok),#8fc4ac);border:none;color:#fff'; }
                else if(i===p.chosen){ cls='btn block'; style+=';background:#f1c7ce;border:none;color:var(--no)'; }
                else style+=';opacity:.45'; }
        return `<button class="${cls}" style="${style}" ${fb?'disabled':''} data-act="answer-mc" data-v="${i}">${esc(opt)}</button>`;
      }).join('')}
    ${ fb?feedbackBar(p,null):'' }`; }

function scrambleBody(q,p,fb){
  const letters=q.scrambled.toUpperCase().split('').join(' ');
  return `<div class="card center" style="padding:22px 16px">
      <div class="muted" style="font-weight:700">Sắp xếp chữ cái thành từ tiếng Anh</div>
      <div style="margin:8px 0 6px;font-weight:800;color:var(--p1)">${esc(q.vi)}</div>
      <div style="font-family:'Fraunces';font-size:26px;letter-spacing:4px">${esc(letters)}</div></div>
    <input id="sc_input" placeholder="Gõ từ..." autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" ${fb?'disabled':''} value="${esc(p.answerGiven||'')}" style="text-align:center;font-size:18px"/>
    ${ fb ? feedbackBar(p,q) : `<button class="btn block" style="margin-top:12px" data-act="check-scramble">Kiểm tra</button>` }`; }

function feedbackBar(p,q){ const ok=p.lastCorrect;
  return `<div class="card center" style="background:${ok?'var(--chip)':'#fdeef0'};margin-top:12px">
      <b style="color:${ok?'var(--ok)':'var(--no)'}">${ok?'Chính xác!':'Chưa đúng'}</b>
      ${ (!ok&&q)?`<div class="muted" style="margin-top:4px">Đáp án: <b>${esc(q.en)}</b></div>`:'' }</div>
    <button class="btn block" data-act="next-q">${p.idx+1<p.questions.length?'Câu tiếp':'Xem kết quả'}</button>`; }

/* ---------- NOTES ---------- */
function noteDue(n){ return n.remind_at && !n.done && daysDiff(n.remind_at)>=0; }
function dueList(){ return S.notes.filter(noteDue).sort((a,b)=> a.remind_at<b.remind_at?-1:1); }
function dueCount(){ return S.notes.filter(noteDue).length; }
function reminderLabel(r,t){ const d=daysDiff(r); const time=t?` · ${t}`:'';
  return (d===0?'Hôm nay':(d>0?('Quá '+d+' ngày'):('Còn '+(-d)+' ngày')))+time; }
function noteCard(n){ const d=n.remind_at!=null?daysDiff(n.remind_at):null; const overdue=d!=null&&!n.done&&d>0, today=d===0&&!n.done;
  return `<div class="note" style="background:${n.color||'var(--card)'};${n.done?'opacity:.55':''}">
    <span class="del" data-act="note-del" data-id="${n.id}">${ic('x','sm')}</span>
    <div class="meta">${ic('heart','sm')} ${esc(n.author_name||nameOf(n.author))} · ${(n.created_at||'').slice(5,10).replace('-','/')}
      ${ n.remind_at?`<span class="badge" style="margin-left:6px;${overdue?'background:#fbe1e4;color:var(--no)':today?'background:#f7e6c8;color:#b07d1e':''}">${reminderLabel(n.remind_at,n.remind_time)}</span>`:'' }</div>
    <div class="body" style="${n.done?'text-decoration:line-through':''}">${esc(n.text)}</div>
    <button class="btn ${n.done?'soft':'ghost'} sm" style="margin-top:10px" data-act="toggle-done" data-id="${n.id}">${n.done?'↺ Bỏ đánh dấu':ic('check','sm')+' Đã xong'}</button>
  </div>`; }
function viewNotes(){
  const notes=S.notes;
  const dated=notes.filter(n=>n.remind_at && !n.done);
  const overdue=dated.filter(n=>daysDiff(n.remind_at)>0).sort((a,b)=>a.remind_at<b.remind_at?-1:1);
  const today=dated.filter(n=>daysDiff(n.remind_at)===0);
  const upcoming=dated.filter(n=>daysDiff(n.remind_at)<0).sort((a,b)=>a.remind_at<b.remind_at?-1:1);
  const plain=notes.filter(n=>!n.remind_at && !n.done);
  const done=notes.filter(n=>n.done);
  const sec=(t,arr)=> arr.length?`<div class="label">${t}</div>`+arr.map(noteCard).join(''):'';
  const notifOn=('Notification' in window) && Notification.permission==='granted';
  return `<div class="row" style="margin-bottom:4px"><h2 class="title grow" style="margin:0">Nhắc &amp; ghi chú</h2>
      <button class="btn sm" data-act="note-new">${ic('plus','sm')} Viết</button></div>
    <p class="sub-h">Đặt ngày để nhắc — cả hai đứa đều thấy lời nhắc.</p>
    ${ ('Notification' in window)?`<button class="btn ${notifOn?'soft':'ghost'} block sm" data-act="enable-notif">${ic('bell','sm')} ${notifOn?'Đã bật thông báo ✓':'Bật thông báo đẩy'}</button>
    <p class="muted" style="margin:6px 0 14px;font-size:12px">Nhận được cả khi tắt app. Trên iPhone: cài app vào màn hình chính (⚙️ → Cài app) rồi mới bật được nha.</p>`:'' }
    ${ notes.length? sec('⚠️ Quá hạn',overdue)+sec('Hôm nay',today)+sec('Sắp tới',upcoming)+sec('Ghi chú (không hẹn ngày)',plain)+sec('Đã xong',done)
       : `<div class="empty">${ic('note','lg')}<div>Chưa có gì.<br>Viết lời nhắc hoặc ghi chú đầu tiên nhé!</div></div>` }`; }

/* ---------- AVATAR (ảnh đại diện, lưu data URL trong space.avatar_a/b) ---------- */
const avatarUrl=(person)=> (S.space && S.space['avatar_'+person]) || '';
function avatarEl(person, size, ring){ const url=avatarUrl(person), nm=(nameOf(person)||'?').trim()[0]||'?';
  const sz = size?`width:${size}px;height:${size}px;font-size:${Math.round(size*0.42)}px;`:'';
  const cls = 'ava'+(ring?' ring':'');
  if(url) return `<div class="${cls}" style="${sz}"><img src="${esc(url)}" alt=""></div>`;
  return `<div class="${cls}" style="${sz}">${esc(nm)}</div>`;
}

/* ---------- DAILY ---------- */
/* Cảm xúc hay dùng: gần đây (lưu máy) + mặc định, để react 1 chạm không cần cuộn */
const REACT_DEFAULTS=['❤️','😍','🥰','😂','😮','😢','👏','🔥','👍','🎉'];
function emojiRecent(){ try{ return JSON.parse(localStorage.getItem('loveapp_emoji_recent')||'[]'); }catch(e){ return []; } }
function emojiPushRecent(em){ let a=emojiRecent().filter(x=>x!==em); a.unshift(em); a=a.slice(0,16);
  try{ localStorage.setItem('loveapp_emoji_recent', JSON.stringify(a)); }catch(e){} }
function emojiQuickList(){ const seen=new Set(); const out=[];
  for(const em of [...emojiRecent(), ...REACT_DEFAULTS]){ if(!seen.has(em)){ seen.add(em); out.push(em); } if(out.length>=12) break; }
  return out; }
/* Bộ chọn cảm xúc đầy đủ (emoji.js): mở dạng bottom-sheet kiểu Messenger */
function openEmojiPicker(who){ if(!window.EMOJI_GROUPS){ toast('Bộ cảm xúc đang tải…'); return; }
  S.tmp.emojiFor=who; S.tmp.dReactOpen=null; S.tmp.dReplyOpen=null;
  const cur=(S.dailyToday||{})['reaction_'+who]||'';
  const groups=window.EMOJI_GROUPS;
  const tabs=groups.map((g,i)=>`<button data-act="emoji-cat" data-v="${g.k}" class="${i===0?'on':''}" title="${esc(g.label)}">${g.icon}</button>`).join('');
  const quick=emojiQuickList().map(em=>`<button class="${em===cur?'on':''}" data-act="emoji-pick" data-v="${em}">${em}</button>`).join('');
  const sheet=`<div class="sheet emoji-sheet" data-act="stop">
    <div class="grab"></div>
    <div class="emoji-head"><b>Thả cảm xúc</b><div class="grow"></div>
      <button class="iconbtn" data-act="close-modal">${ic('x','sm')}</button></div>
    <div class="emoji-search">${ic('search')}<input id="emoji_q" autocomplete="off" placeholder="Tìm cảm xúc (vd: tim, cười, hoa…)"/></div>
    <div class="emoji-quick">${quick}</div>
    <div class="emoji-tabs" id="emoji_tabs">${tabs}</div>
    <div class="emoji-scroll" id="emoji_scroll">${emojiSectionsHTML(cur)}</div>
  </div>`;
  const ov=document.createElement('div'); ov.className='overlay'; ov.dataset.act='close-modal';
  ov.innerHTML=sheet; document.body.appendChild(ov);
  setTimeout(()=>$('#emoji_q')?.focus(),60);
}
/* Toàn bộ emoji chia theo nhóm (khi không tìm kiếm) */
function emojiSectionsHTML(cur){ return window.EMOJI_GROUPS.map(g=>
  `<div class="emoji-sec" data-cat="${g.k}"><div class="emoji-sec-title">${esc(g.label)}</div>
    <div class="emoji-grid">${g.list.map(it=>`<button class="${it[0]===cur?'on':''}" data-act="emoji-pick" data-v="${it[0]}">${it[0]}</button>`).join('')}</div></div>`).join(''); }
/* Kết quả tìm kiếm (gõ tiếng Anh hoặc tiếng Việt không dấu) */
function emojiSearchHTML(q, cur){ q=noDiacritics(q.trim().toLowerCase()); if(!q) return emojiSectionsHTML(cur);
  const vi=window.EMOJI_VI||{}; const hits=[]; const seen=new Set();
  for(const g of window.EMOJI_GROUPS) for(const it of g.list){ const em=it[0]; if(seen.has(em)) continue;
    const hay=(it[1]+' '+(vi[em]||'')); if(hay.indexOf(q)>=0){ seen.add(em); hits.push(em); if(hits.length>=120) break; } }
  if(!hits.length) return `<div class="emoji-empty">Không tìm thấy cảm xúc nào 🥲<br>Thử từ khác nha</div>`;
  return `<div class="emoji-grid" style="margin-top:8px">${hits.map(em=>`<button class="${em===cur?'on':''}" data-act="emoji-pick" data-v="${em}">${em}</button>`).join('')}</div>`; }
function dReactBadge(who){ const r=(S.dailyToday||{})['reaction_'+who]; return r?`<span class="react-badge">${r}</span>`:''; }
/* bong bóng lời nhắn kiểu comment (ai nhắn = other(who)) */
function dReplyBubble(who){ const r=(S.dailyToday||{})['reply_'+who]; if(!r) return '';
  const author = other(who)===S.me ? 'Bạn' : (partner()||'Người ấy');
  return `<div class="reply-quote">${avatarEl(other(who))}
    <div class="bub"><b>${esc(author)}</b>${esc(r)}</div></div>`; }
/* thẻ 1 câu trả lời — mine=true là của mình (không react được), false là của người ấy (react/nhắn) */
function dAnswerCard(who, text, mine){
  const reactOpen = S.tmp.dReactOpen===who, replyOpen = S.tmp.dReplyOpen===who;
  const myReact = (S.dailyToday||{})['reaction_'+who];
  // thanh nhanh: 6 emoji hay dùng + nút ＋ mở bảng đầy đủ
  const bar = reactOpen ? `<div class="react-bar">${emojiQuickList().slice(0,6).map(em=>
      `<button class="${myReact===em?'on':''}" data-act="daily-react" data-v="${who}|${em}">${em}</button>`).join('')}
      <button class="react-more" data-act="d-react-open" data-v="${who}" title="Xem tất cả cảm xúc">＋</button></div>` : '';
  const actions = mine
    ? `<div class="cmt-actions"><button data-act="edit-daily">${ic('edit','sm')} Sửa câu trả lời</button></div>`
    : `<div class="cmt-actions">
        <button class="${myReact?'hot':''}" data-act="d-react-toggle" data-v="${who}">${myReact||'🙂'} Cảm xúc</button>
        <button data-act="d-reply-toggle" data-v="${who}">💬 Trả lời</button></div>`;
  const replyBox = replyOpen ? `<div class="reply-box">${avatarEl(S.me)}
      <div class="reply-pill"><input id="d_reply_input" autocomplete="off" placeholder="Viết trả lời cho ${esc(partner()||'người ấy')}…" value="${esc((S.dailyToday||{})['reply_'+who]||'')}"/>
        <button class="reply-send" data-act="d-reply-send" data-v="${who}">${ic('send')}</button></div></div>` : '';
  return `<div class="card answer-card${mine?'':' longpressable'}" ${mine?'':`data-longpress="daily-react" data-who="${who}"`}>
    ${bar}
    <div class="row" style="border:none;padding:0">
      <div class="grow muted" style="font-weight:800;color:${mine?'var(--p1)':'var(--accent)'}">${esc(nameOf(who))} trả lời</div>
      ${dReactBadge(who)}</div>
    <p style="margin:6px 0 0">${esc(text)}</p>
    ${dReplyBubble(who)}
    ${actions}
    ${replyBox}</div>`;
}
/* nhật ký — 1 câu trả lời của người `who` trong ngày cũ */
function journalAnswer(dd, who){ const ans=who==='a'?dd.answer_a:dd.answer_b; if(!ans) return '';
  const react=dd['reaction_'+who], reply=dd['reply_'+who];
  const replier = other(who)===S.me?'Bạn':(nameOf(other(who))||'Người ấy');
  return `<div class="jans">${avatarEl(who,28)}
    <div class="grow"><div class="muted" style="font-weight:800;font-size:11.5px">${esc(nameOf(who))}</div>
      <div style="font-size:14.5px;line-height:1.4">${esc(ans)}</div>
      ${reply?`<div class="muted" style="font-style:italic;font-size:12.5px;margin-top:3px">💬 ${esc(replier)}: “${esc(reply)}”</div>`:''}</div>
    ${react?`<span class="react-badge" style="align-self:flex-start">${react}</span>`:''}</div>`; }
/* nhật ký — 1 ngày cũ (bỏ ngày trống, không hiện) */
function dayJournalCard(dd){ if(!(dd.answer_a||dd.answer_b)) return '';
  const [y,m,day]=dd.day.split('-');
  return `<div class="card" style="padding:14px">
    <div class="muted" style="font-weight:800;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:5px">${ic('cal','sm')} ${day}/${m}/${y}</div>

function dailyJournal(){
  if(S.dailyHistory===null) return `<div class="label">Nhật ký</div><p class="muted center" style="padding:10px">Đang tải…</p>`;
  const hist=(S.dailyHistory||[]).filter(x=>x.day!==todayStr() && (x.answer_a||x.answer_b));
  if(!hist.length) return `<div class="label">📖 Nhật ký</div><p class="muted center" style="padding:10px">Chưa có ngày nào trước đây. Cứ trả lời mỗi ngày, kỷ niệm sẽ dồn lại ở đây 💕</p>`;
  return `<div class="label">📖 Những ngày trước (${hist.length})</div>${hist.map(dayJournalCard).join('')}`;
}

  const q=(e.target.value||'').trim().toLowerCase();

/* Lọc chủ đề tab Học — bỏ dấu để gõ không cần dấu vẫn tìm thấy (vd "hop dong") */
function applyLibFilter(){
  const q=noDiacritics((S.tmp.libQuery||'').trim()).toLowerCase();
  const lf=S.tmp.learnFilter||'all';
  let anyGlobal=false;
  document.querySelectorAll('.lib-sec').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('[data-flt="lib"]').forEach(row=>{
      let show=!q||row.dataset.name.includes(q);
      if(show && lf!=='all'){ const lk=row.dataset.lkey;
        if(!lk) show=false; // dòng không đánh dấu được (ngữ pháp) ẩn khi lọc theo tiến độ
        else { const learned=row.dataset.learned==='1'; show = lf==='learned'?learned:!learned; } }
      row.style.display=show?'':'none'; if(show) any=true; });
    sec.style.display=any?'':'none'; if(any) anyGlobal=true; });
  const empty=$('#lib-empty'); if(empty) empty.style.display=(!anyGlobal && (q||lf!=='all'))?'':'none';
}

document.addEventListener('keydown',(e)=>{ if(e.key!=='Enter') return;
  if(e.target.id==='sc_input'){ e.preventDefault(); handle('check-scramble'); }
  else if(e.target.id==='gr_input'){ e.preventDefault(); handle('check-grammar'); }
  else if(e.target.id==='dsc_input'){ e.preventDefault(); handle('d-check-scramble'); }
  else if(e.target.id==='dcw_input'){ e.preventDefault(); handle('d-check-crossword'); }
  else if(e.target.id==='dchain_input'){ e.preventDefault(); handle('d-chain-send'); }
  else if(e.target.id==='d_reply_input'){ e.preventDefault(); handle('d-reply-send',S.tmp.dReplyOpen); }
  else if(e.target.id==='qa_front'){ e.preventDefault(); $('#qa_back')?.focus(); }
  else if(e.target.id==='qa_back'){ e.preventDefault(); handle('quick-add',null,e.target.dataset.deck); }
  else if(e.target.id==='a_pin'){ e.preventDefault(); handle(S.authTab==='register'?'do-register':'do-login'); } });

async function handle(act,v,id,t,e){
  switch(act){
    case 'go': saveScrollNow(); S.view=v; S.sub=null; S.tmp.dReactOpen=null; S.tmp.dReplyOpen=null; if(v!=='compose')S.compose=null; render(); restoreScrollSoon();
      if(v==='daily') loadDailyHistory(); break;
    case 'atab': S.authTab=v; render(); break;
    case 'do-register': await doRegister(); break;
    case 'do-login': await doLogin(); break;
    case 'logout': localStorage.removeItem('loveapp_user'); location.reload(); break;

    case 'pair-create': await pairCreate(); break;
    case 'pair-join': await pairJoin($('#p_code')?.value); break;
    case 'accept-invite': await acceptInvite(id); break;
    case 'decline-invite': await Store.updateInvite(id,{status:'declined'}); S.invites=S.invites.filter(x=>x.id!==id); render(); break;
    case 'send-invite': await sendInvite(); break;

    case 'close-modal': closeModal(); break;
    case 'stop': break;

    case 'lib-filter': S.tmp.libFilter=v; render(); break;
    case 'lib-learnfilter': S.tmp.learnFilter=v; render(); break;
    case 'open-topic': saveScrollNow(); S.sub=id; S.view='library'; render(); scrollTo(0,0); break;
    case 'open-grammar': saveScrollNow(); S.sub='g:'+id; S.view='library'; render(); scrollTo(0,0); break;
    case 'grammar-practice': startGrammarPractice(id); break;
    case 'send-grammar': await sendGrammar(id); break;
    case 'check-grammar': await checkGrammar(); break;
    case 'grammar-mc': grammarMc(parseInt(v,10)); break;
    case 'study-topic': { const tt=topicByNo(id); if(tt) startStudy(tt.words,{mode:t.dataset.mode||'quiz',src:'lib',title:tt.name,back:'library',learnKey:'t:'+id}); } break;
    case 'send-topic': await sendTopic(id); break;

    /* bộ từ của mình */
    case 'open-deck': saveScrollNow(); S.sub=id; S.view='library'; render(); scrollTo(0,0); break;
    case 'new-deck': openDeckModal(); break;
    case 'save-deck-modal': await saveDeckModal(); break;
    case 'del-deck': if(confirm('Xoá bộ từ này và toàn bộ từ bên trong?')){ await Store.deleteDeck(S.space.id,id); await loadAll(); S.sub=null; render(); toast('Đã xoá bộ'); } break;
    case 'quick-add': await quickAdd(id); break;
    case 'bulk-open': openBulkModal(id); break;
    case 'bulk-save': await bulkSave(id); break;
    case 'edit-card': { const c=S.cards.find(x=>x.id===id); if(c) openCardModal(c.deck_id,c); } break;
    case 'save-card': await saveCard(t.dataset.deck,t.dataset.id); break;
    case 'del-card': await Store.deleteCard(S.space.id,id); await loadAll(); render(); break;
    case 'study-deck': { const dd=S.decks.find(x=>x.id===id); if(dd){ const ws=S.cards.filter(c=>c.deck_id===id).map(c=>({en:c.front,vi:c.back}));
        startStudy(ws,{mode:t.dataset.mode||'quiz',src:'lib',title:dd.name,back:'library',learnKey:'d:'+id}); } } break;
    case 'send-deck': await sendDeck(id); break;

    /* đấu trường */
    case 'duel-from': S.tmp.duelSrc=v; S.view='arena'; S.sub=null; render(); scrollTo(0,0); break;
    case 'duel-game': S.tmp.duelGame=v; render(); break;
    case 'duel-create': await createDuel(); break;
    case 'duel-join': await joinDuel(id); break;
    case 'duel-decline': if(confirm('Từ chối lời rủ đấu này?')){ await Store.updateDuel(id,S.space.id,{status:'cancelled'}); S.duel=null; render(); } break;
    case 'duel-cancel': if(confirm('Huỷ trận này?')){ await Store.updateDuel(S.duel.id,S.space.id,{status:'cancelled'}); S.duel=null; S.duelPlay=null; render(); } break;
    case 'duel-cancel-active': if(confirm('Huỷ trận đang diễn ra? (cả hai sẽ mất kết quả)')){ await Store.updateDuel(S.duel.id,S.space.id,{status:'cancelled'}); S.duel=null; S.duelPlay=null; render(); } break;
    case 'd-answer-mc': dAnswerMc(parseInt(v,10)); break;
    case 'd-check-scramble': dCheckScramble(); break;
    case 'd-guess-letter': guessLetter(v); break;
    case 'd-check-crossword': dCheckCrossword(); break;
    case 'd-chain-send': await sendChainWord(); break;
    case 'd-next': await dNext(); break;
    case 'duel-seen': markDuelSeen(id); S.duel=null; S.duelPlay=null; render(); break;
    case 'study-lesson': { const q=S.quizzes.find(x=>x.id===id); if(q){
        if(q.status==='pending' && q.to_person===S.me){ q.status='picked'; q.picked_at=new Date().toISOString(); await Store.saveQuiz(q); }
        if(isGrammarQuiz(q)) startGrammarPractice(null,{quiz:q});
        else startStudy(q.items,{mode:t.dataset.mode||'quiz',src:'lesson',quiz:q,title:q.title,back:'inbox'}); } } break;

    case 'inbox-tab': S.inboxTab=v; render(); break;
    case 'flip': if(S.play){ S.play.flip=!S.play.flip; const fl=$('.flash'); if(fl) fl.classList.toggle('flip',S.play.flip); else render(); } break;
    case 'next-card': await nextCard(); break;
    case 'prev-card': await prevCard(); break;
    case 'ai-example': await aiExampleForCurrent(); break;
    case 'speak-word': { const p=S.play; if(p&&p.cards){ const c=p.cards[p.idx]; if(c) speakWord(c.en); } } break;
    case 'answer-mc': await answerMc(parseInt(v,10)); break;
    case 'check-scramble': await checkScramble(); break;
    case 'next-q': await nextQ(); break;
    case 'to-quiz': { const p=S.play; startStudy(p.words,{mode:'quiz',src:p.src,quiz:p.quiz,title:p.title,back:p.back}); } break;
    case 'restudy': { const p=S.play; if(p.mode==='grammar') startGrammarPractice(p.grammarId, p.quiz?{quiz:p.quiz}:undefined); else startStudy(p.words,{mode:p.mode,src:p.src,quiz:p.quiz,title:p.title,back:p.back}); } break;
    case 'quit-play': { const back=(S.play&&S.play.back)||'home'; S.play=null; S.view=back; render(); } break;
    case 'finish-play': S.play=null; S.view='home'; await loadAll(); render(); break;

    case 'note-new': openNoteModal(); break;
    case 'pick-tint': S.tmp.noteTint=v; document.querySelectorAll('#m_tint .swatch').forEach(s=>s.classList.remove('on')); t.classList.add('on'); break;
    case 'note-save': await noteSave(); break;
    case 'toggle-done': { const n=S.notes.find(x=>x.id===id); if(n){ n.done=!n.done; await Store.saveNote(n); await loadAll(); render(); } } break;
    case 'enable-notif': await enableNotif(); break;
    case 'install-app': await installApp(); break;
    case 'hide-install': localStorage.setItem('loveapp_hide_install','1'); render(); break;
    case 'note-del': if(confirm('Xoá ghi chú này?')){ await Store.deleteNote(S.space.id,id); await loadAll(); render(); } break;

    case 'save-daily': await saveDaily(); break;
    case 'edit-daily': { const d=S.dailyToday; S.tmp.dAns=(S.me==='a'?d.answer_a:d.answer_b)||''; if(S.me==='a')d.answer_a=null; else d.answer_b=null; render(); } break;
    case 'd-react-toggle': S.tmp.dReactOpen = S.tmp.dReactOpen===v?null:v; S.tmp.dReplyOpen=null; render(); break;
    case 'daily-react': { const i=v.indexOf('|'); await dailyReact(v.slice(0,i), v.slice(i+1)); } break;
    case 'd-react-open': openEmojiPicker(v); render(); break;
    case 'emoji-pick': { const who=S.tmp.emojiFor; closeModal(); await dailyReact(who, v); } break;
    case 'emoji-cat': { const sec=document.querySelector(`.emoji-sec[data-cat="${v}"]`); if(sec) sec.scrollIntoView({behavior:'smooth',block:'start'});
      document.querySelectorAll('#emoji_tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); const q=$('#emoji_q'); if(q&&q.value){ q.value=''; const sc=$('#emoji_scroll'); if(sc){ sc.innerHTML=emojiSectionsHTML((S.dailyToday||{})['reaction_'+S.tmp.emojiFor]||''); const s2=document.querySelector(`.emoji-sec[data-cat="${v}"]`); if(s2) s2.scrollIntoView({block:'start'}); } } } break;
    case 'd-reply-toggle': S.tmp.dReplyOpen = S.tmp.dReplyOpen===v?null:v; S.tmp.dReactOpen=null; render(); setTimeout(()=>$('#d_reply_input')?.focus(),40); break;
    case 'd-reply-send': await dailyReplySave(v); break;
    case 'avatar-pick': chooseAvatar(); break;
    case 'avatar-remove': await removeAvatar(); break;
    case 'heart-photo-pick': chooseHeartPhoto(); break;
    case 'heart-photo-remove': await removeHeartPhoto(parseInt(id,10)); break;

    case 'copy-code': navigator.clipboard?.writeText(S.space.id).then(()=>toast('Đã chép mã'),()=>toast(S.space.id)); break;
    case 'save-start': { const sd=$('#s_start').value; await Store.updateSpace(S.space.id,{start_date:sd}); S.space.start_date=sd; render(); toast('Đã lưu ngày'); } break;
    case 'save-names': { const a=$('#s_a').value.trim(),b=$('#s_b').value.trim(); await Store.updateSpace(S.space.id,{person_a:a,person_b:b}); S.space.person_a=a; S.space.person_b=b; render(); toast('Đã lưu'); } break;
    case 'set-theme': await Store.updateSpace(S.space.id,{theme:v}); S.space.theme=v; applyTheme(); render(); break;
    case 'leave': if(confirm('Rời khỏi phòng này?')){ await Store.updateUser(S.user.username,{space_id:null,person:null}); S.user.space_id=null; S.space=null; S.invites=await Store.listInvites(S.user.username); S.view='pair'; render(); } break;
  }
}

/* ----- impl ----- */
async function doRegister(){
  const display=($('#a_disp')?.value||'').trim(), username=($('#a_user')?.value||'').trim().toLowerCase(), pin=($('#a_pin')?.value||'');
  if(!display||!username||pin.length<4){ toast('Điền đủ tên, tên đăng nhập và PIN (≥4) nha'); return; }
  if(await Store.getUser(username)){ toast('Tên đăng nhập này đã có người dùng'); return; }
  const u={ username, display, passcode:hashPass(pin), space_id:null, person:null, created_at:new Date().toISOString() };
  await Store.createUser(u); S.user=u; localStorage.setItem('loveapp_user',username);
  S.invites=await Store.listInvites(username); S.view='pair'; render(); toast('Tạo tài khoản thành công');
}
async function doLogin(){
  const username=($('#a_user')?.value||'').trim().toLowerCase(), pin=($('#a_pin')?.value||'');
  if(!username||!pin){ toast('Nhập tên đăng nhập và PIN'); return; }
  const u=await Store.getUser(username);
  if(!u||u.passcode!==hashPass(pin)){ toast('Sai tên đăng nhập hoặc PIN'); return; }
  S.user=u; localStorage.setItem('loveapp_user',username);
  if(u.space_id){ const sp=await Store.getSpace(u.space_id); if(sp){ S.space=sp; S.me=u.person; applyTheme(); await loadAll(); S.view='home'; render(); startPolling(); return; } }
  S.invites=await Store.listInvites(username); S.view='pair'; render();
}
async function pairCreate(){
  const name=($('#p_name')?.value||'').trim()||'Tụi mình', start=$('#p_start')?.value||null;
  const space={ id:newCode(), name, person_a:S.user.display, person_b:'', person_a_username:S.user.username, person_b_username:'',
    theme:'blush', start_date:start, streak:0, longest:0, last_active:null, created_at:new Date().toISOString() };
  await Store.createSpace(space); await Store.updateUser(S.user.username,{space_id:space.id,person:'a'});
  S.user.space_id=space.id; S.user.person='a'; S.space=space; S.me='a'; applyTheme(); await loadAll();
  S.view='home'; render(); startPolling(); toast('Đã tạo phòng! Mời người ấy nha');
}
async function pairJoin(codeRaw){
  const code=(codeRaw||'').trim().toLowerCase(); if(!code){ toast('Nhập mã đã nha'); return; }
  const sp=await Store.getSpace(code); if(!sp){ toast('Không tìm thấy mã này'); return; }
  if(sp.person_b_username && sp.person_b_username!==S.user.username && sp.person_a_username!==S.user.username){ toast('Phòng đã đủ hai người'); return; }
  let me='b';
  if(sp.person_a_username===S.user.username) me='a';
  else if(sp.person_b_username===S.user.username) me='b';
  else { await Store.updateSpace(sp.id,{person_b:S.user.display, person_b_username:S.user.username}); sp.person_b=S.user.display; sp.person_b_username=S.user.username; }
  await Store.updateUser(S.user.username,{space_id:sp.id,person:me});
  S.user.space_id=sp.id; S.user.person=me; S.space=sp; S.me=me; applyTheme(); await loadAll();
  S.view='home'; render(); startPolling(); toast('Vào phòng thành công');
}
async function acceptInvite(invId){ const inv=S.invites.find(x=>x.id===invId); if(!inv) return;
  await Store.updateInvite(invId,{status:'accepted'}); await pairJoin(inv.space_id); }
async function sendInvite(){ const to=($('#s_invite')?.value||'').trim().toLowerCase();
  if(!to){ toast('Nhập tên đăng nhập của người ấy'); return; }
  if(to===S.user.username){ toast('Đó là chính bạn mà 🙂'); return; }
  await Store.createInvite({ id:uid(), space_id:S.space.id, from_display:S.user.display, from_username:S.user.username, to_username:to, status:'pending', created_at:new Date().toISOString() });
  $('#s_invite').value=''; toast('Đã gửi lời mời tới @'+to);
}
async function saveDeckModal(){ const name=($('#m_name')?.value||'').trim(); if(!name){ toast('Đặt tên bộ đã nha'); return; }
  const deck={ id:uid(), space_id:S.space.id, name, lang:($('#m_lang')?.value||'').trim(), color:DECK_TINT[S.decks.length%DECK_TINT.length], created_at:new Date().toISOString() };
  await Store.saveDeck(deck); closeModal(); await loadAll(); S.view='library'; S.sub=deck.id; render(); toast('Đã tạo bộ từ 💗'); }
async function quickAdd(deckId){ const f=($('#qa_front')?.value||'').trim(), b=($('#qa_back')?.value||'').trim(), ex=($('#qa_ex')?.value||'').trim();
  if(!f||!b){ toast('Điền cả từ và nghĩa nha'); return; }
  await Store.saveCard({ id:uid(), space_id:S.space.id, deck_id:deckId, front:f, back:b, example:ex, created_by:S.me, created_at:new Date().toISOString() });
  await loadAll(); render(); setTimeout(()=>$('#qa_front')?.focus(),30); }
async function bulkSave(deckId){ const raw=($('#m_bulk')?.value||''); const lines=raw.split('\n');
  const arr=[]; let i=0;
  for(const line of lines){ const s=line.trim(); if(!s) continue;
    const parts=s.split(/\s*(?:\t|=|,|;|:|—|–|\| )\s*/); if(parts.length<2) continue;
    const front=parts[0].trim(), back=parts.slice(1).join(' ').trim(); if(!front||!back) continue;
    arr.push({ id:uid(), space_id:S.space.id, deck_id:deckId, front, back, example:'', created_by:S.me, created_at:new Date(Date.now()+ (i++)).toISOString() }); }
  if(!arr.length){ toast('Chưa nhận ra thẻ nào — kiểm tra dấu ngăn cách nha'); return; }
  await Store.saveCards(arr); closeModal(); await loadAll(); render(); toast(`Đã thêm ${arr.length} thẻ`); }
async function saveCard(deckId,cardId){ const f=($('#m_front')?.value||'').trim(), b=($('#m_back')?.value||'').trim();
  if(!f||!b){ toast('Điền cả hai mặt nha'); return; } const ex=($('#m_ex')?.value||'').trim();
  const existing=cardId?S.cards.find(c=>c.id===cardId):null;
  await Store.saveCard({ id:cardId||uid(), space_id:S.space.id, deck_id:deckId, front:f, back:b, example:ex, created_by:S.me, created_at:existing?.created_at||new Date().toISOString() });
  closeModal(); await loadAll(); render(); toast(cardId?'Đã lưu':'Đã thêm thẻ'); }
async function sendTopic(topicNo){ const t=topicByNo(topicNo); if(!t) return;
  const items=t.words.map(w=>({en:w.en, vi:w.vi}));
  await Store.saveQuiz({ id:uid(), space_id:S.space.id, from_person:S.me, to_person:other(S.me), title:t.name, message:'',
    status:'pending', items, score:0, total:items.length, created_at:new Date().toISOString(), picked_at:null, answered_at:null });
  await loadAll(); S.view='inbox'; S.inboxTab='out'; render(); toast('Đã gửi cho '+(partner()||'người ấy')); }
async function sendGrammar(id){ const g=grammarById(id); if(!g) return;
  const items=(g.practice||[]).map(p=>Object.assign({},p));  // gửi kèm câu luyện (có .type để nhận diện là ngữ pháp)
  if(!items.length){ toast('Chủ điểm này chưa có câu luyện'); return; }
  await Store.saveQuiz({ id:uid(), space_id:S.space.id, from_person:S.me, to_person:other(S.me), title:'📖 '+g.name, message:'',
    status:'pending', items, score:0, total:items.length, created_at:new Date().toISOString(), picked_at:null, answered_at:null });
  await loadAll(); S.view='inbox'; S.inboxTab='out'; render(); toast('Đã gửi ngữ pháp cho '+(partner()||'người ấy')); }
async function sendDeck(deckId){ const d=S.decks.find(x=>x.id===deckId); if(!d) return;
  const items=S.cards.filter(c=>c.deck_id===deckId).map(c=>({en:c.front, vi:c.back}));
  if(!items.length){ toast('Bộ này chưa có từ nào'); return; }
  await Store.saveQuiz({ id:uid(), space_id:S.space.id, from_person:S.me, to_person:other(S.me), title:d.name, message:'',
    status:'pending', items, score:0, total:items.length, created_at:new Date().toISOString(), picked_at:null, answered_at:null });
  await loadAll(); S.view='inbox'; S.inboxTab='out'; render(); toast('Đã gửi cho '+(partner()||'người ấy')); }
function studyTopic(topicNo){ const t=topicByNo(topicNo); if(!t) return; startStudy(t.words,{src:'lib',title:t.name,back:'library'}); }
async function pickup(qid){ const q=S.quizzes.find(x=>x.id===qid); if(!q) return;
  if(q.status==='pending' && q.to_person===S.me){ q.status='picked'; q.picked_at=new Date().toISOString(); await Store.saveQuiz(q); }
  startStudy(q.items,{src:'lesson',quiz:q,title:q.title,back:'inbox'}); }
/* Lưu bài dò kèm progress — chịu được DB cũ chưa chạy SQL thêm cột progress */
async function saveQuizSafe(q){ try{ await Store.saveQuiz(q); }
  catch(e){ const {progress,...rest}=q;
    try{ await Store.saveQuiz(rest); toast('Đã lưu tạm — nhờ chạy SQL cột progress để lưu tiến độ lâu dài nha'); }catch(e2){} } }
/* Lưu tiến độ đang làm dở của bài dò (được gửi), để thoát ra vào lại không mất */
async function saveLessonProgress(idx,score){ const p=S.play; if(!p||!p.quiz||p.src!=='lesson') return;
  p.quiz.progress = p.mode==='quiz' ? {mode:'quiz',idx,score,questions:p.questions} : {mode:'flash',idx,cards:p.cards};
  await saveQuizSafe(p.quiz); }
function startStudy(words,opts){ opts=opts||{}; const mode=opts.mode||'quiz';
  const norm=(words||[]).map(w=>({ en:(w.en||w.front||'').trim(), vi:(w.vi||w.back||'').trim() })).filter(w=>w.en&&w.vi);
  if(!norm.length){ toast('Chủ đề này chưa có từ để học'); return; }
  const prog = opts.quiz && opts.quiz.progress && opts.quiz.progress.mode===mode ? opts.quiz.progress : null;
  const cards = mode==='flash'? (prog && prog.cards && prog.cards.length===norm.length ? prog.cards : shuffle(norm)) : [];
  const questions = mode==='quiz'? (prog && prog.questions && prog.questions.length ? prog.questions : buildQuestions(norm)) : [];
  const idx = prog ? Math.max(0, prog.idx||0) : 0;
  const alreadyDone = mode==='quiz' && prog && idx>=questions.length;
  S.play={ mode, src:opts.src||'lib', quiz:opts.quiz||null, title:opts.title||'Học', back:opts.back||'library', learnKey:opts.learnKey||null,
    words:norm, idx: alreadyDone?Math.max(0,questions.length-1):(mode==='flash'?Math.min(idx,cards.length-1):idx),
    score:(prog&&prog.score)||0, done:alreadyDone, streakUp:false, flip:false,
    cards, questions,
    phase:'ask', chosen:null, answerGiven:'', lastCorrect:null };
  render(); scrollTo(0,0);
  if(alreadyDone) finishStudy(); }
/* ----- luyện ngữ pháp (dùng cho cả tự luyện lẫn "bài dò" gửi qua Hộp thư) ----- */
const isGrammarQuiz = (q)=> !!(q && q.items && q.items[0] && q.items[0].type);
function startGrammarPractice(id, opts){ opts=opts||{};
  let questions, title, back, quiz=null, src='grammar', grammarId=id;
  if(opts.quiz){ quiz=opts.quiz; questions=(quiz.items||[]); title=quiz.title; back='inbox'; src='lesson'; grammarId=null; }
  else { const g=grammarById(id); if(!g||!g.practice||!g.practice.length){ toast('Chủ điểm này chưa có bài luyện'); return; } questions=g.practice.slice(); title=g.name; back='library'; }
  if(!questions.length){ toast('Bài này chưa có câu luyện'); return; }
  S.play={ mode:'grammar', grammarId, src, quiz, title, back,
    questions:shuffle(questions.slice()), idx:0, score:0, done:false, streakUp:false,
    phase:'ask', chosen:null, answerGiven:'', lastCorrect:null };
  render(); scrollTo(0,0); }
const CONTRACTIONS=[["do not","don't"],["does not","doesn't"],["did not","didn't"],["is not","isn't"],["are not","aren't"],["was not","wasn't"],["were not","weren't"],["has not","hasn't"],["have not","haven't"],["had not","hadn't"],["will not","won't"],["would not","wouldn't"],["should not","shouldn't"],["i will","i'll"],["will have","'ll have"],["will be","'ll be"],["would have","'d have"]];
function normAns(s){ let x=(s||'').toLowerCase().trim().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'');
  CONTRACTIONS.forEach(([full,con])=>{ x=x.split(con).join(full); });  // đưa mọi contraction về dạng đầy đủ
  return x.replace(/\s+/g,' ').trim(); }
function matchAnswer(val,q){ const v=normAns(val);
  const cands=[q.answer].concat(q.alts||[]);
  return cands.some(c=>normAns(c)===v); }
async function checkGrammar(){ const p=S.play; if(!p||p.phase!=='ask') return; const q=p.questions[p.idx];
  const val=($('#gr_input')?.value||'').trim(); if(!val){ toast('Điền đáp án đã nha'); return; }
  p.answerGiven=val; p.lastCorrect=matchAnswer(val,q); if(p.lastCorrect)p.score++; p.phase='feedback'; render(); }
function grammarMc(i){ const p=S.play; if(!p||p.phase!=='ask') return; const q=p.questions[p.idx];
  p.chosen=i; p.lastCorrect=(i===q.answer); if(p.lastCorrect)p.score++; p.phase='feedback'; render(); }
async function answerMc(i){ const p=S.play; if(!p||p.phase!=='ask') return; const q=p.questions[p.idx];
  p.chosen=i; p.lastCorrect=(q.options[i]===q.vi); if(p.lastCorrect)p.score++; p.phase='feedback'; render();
  await saveLessonProgress(p.idx+1,p.score); }
async function checkScramble(){ const p=S.play; if(!p||p.phase!=='ask') return; const q=p.questions[p.idx];
  const val=($('#sc_input')?.value||'').trim(); if(!val){ toast('Gõ từ đã nha'); return; }
  p.answerGiven=val; p.lastCorrect=(val.toLowerCase()===q.en.toLowerCase()); if(p.lastCorrect)p.score++; p.phase='feedback'; render();
  await saveLessonProgress(p.idx+1,p.score); }
async function nextQ(){ const p=S.play; if(!p) return;
  if(p.idx+1<p.questions.length){ p.idx++; p.phase='ask'; p.chosen=null; p.answerGiven=''; render(); }
  else await finishStudy(); }
async function nextCard(){ const p=S.play; if(!p) return;
  if(p.idx+1>=p.cards.length){ await finishStudy(); return; }
  p.idx++; p.flip=false; render();          // đổi thẻ ngay, không animation lật trang
  await saveLessonProgress(p.idx,null);
}
async function prevCard(){ const p=S.play; if(!p||p.idx<=0) return;
  p.idx--; p.flip=false; render();
  await saveLessonProgress(p.idx,null);
}
/* Xin AI ví dụ + cách dùng cho thẻ đang xem (cache theo từ để khỏi gọi lại) */
async function aiExampleForCurrent(){ const p=S.play; if(!p||!p.cards) return; const c=p.cards[p.idx]; if(!c) return;
  p.exCache=p.exCache||{}; const cur=p.exCache[c.en]; if(cur==='loading'||(cur&&!cur.error)) return;
  p.exCache[c.en]='loading'; render();
  // 1) Thử lấy từ DB trước — nếu đã có ai đó xin ví dụ cho từ này thì dùng lại, KHỎI tốn token
  try{ const cached=await Store.getWordExample(c.en);
    if(cached && (cached.example||cached.usage)){
      p.exCache[c.en]={ example:cached.example||'', example_vi:cached.example_vi||'', usage:cached.usage||'', meaning_note:cached.meaning_note||'' };
      render(); return; }
  }catch(e){ /* bảng chưa tạo hoặc lỗi mạng -> bỏ qua, gọi AI */ }
  // 2) Chưa có -> gọi AI rồi LƯU vào DB cho lần sau
  try{ const j=await apiPost('/api/word-example',{en:c.en,vi:c.vi},25000); // AI hay chậm 5-8s, iPhone mạng di động cần nhiều thời gian hơn
    const data={ example:j.example||'', example_vi:j.example_vi||'', usage:j.usage||'', meaning_note:j.meaning_note||'' };
    p.exCache[c.en]=data;
    try{ await Store.saveWordExample({ word:c.en, vi:c.vi||'', example:data.example, example_vi:data.example_vi, usage:data.usage, meaning_note:data.meaning_note, created_at:new Date().toISOString() }); }
    catch(e){ /* bảng word_examples chưa chạy SQL -> vẫn dùng được, chỉ là lần sau gọi lại */ }
  }catch(e){ p.exCache[c.en]={error:true};
    toast(e.name==='AbortError' ? 'Mạng hơi chậm, bấm thử lại nha 🐢' : 'Chưa lấy được ví dụ, thử lại sau nha'); }
  render(); }
/* Đọc từ vựng đang xem bằng giọng đọc có sẵn của trình duyệt (Web Speech API — không cần mạng/AI) */
let _voicesWarm=false;
function pickEnVoice(){ try{ const vs=speechSynthesis.getVoices(); return vs.find(v=>/^en[-_]/i.test(v.lang)&&/US|United States/i.test(v.name))||vs.find(v=>/^en[-_]/i.test(v.lang))||null; }catch(e){ return null; } }
function speakWord(text){ text=(text||'').trim(); if(!text) return;
  if(!('speechSynthesis' in window)){ toast('Máy này không hỗ trợ đọc'); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.9; u.pitch=1;
    const v=pickEnVoice(); if(v) u.voice=v;
    speechSynthesis.speak(u);
    // iOS/Chrome: danh sách giọng nạp bất đồng bộ → nếu lần đầu chưa có, đợi rồi đọc lại
    if(!v && !_voicesWarm){ _voicesWarm=true; speechSynthesis.onvoiceschanged=()=>{ const v2=pickEnVoice(); if(v2){ speechSynthesis.cancel(); const u2=new SpeechSynthesisUtterance(text); u2.lang='en-US'; u2.rate=.9; u2.voice=v2; speechSynthesis.speak(u2); } }; }
  }catch(e){ toast('Không đọc được từ này'); }
}
async function finishStudy(){ const p=S.play; p.done=true;
  p.streakUp=await bumpStreak();
  if(p.learnKey) markLearned(p.learnKey); // học xong bộ nào → tự đánh dấu "đã học" cho mình
  if(p.quiz && p.src==='lesson'){
    const q=p.quiz; let changed=false;
    if((p.mode==='quiz'||p.mode==='grammar') && q.to_person===S.me && q.status!=='answered'){
      q.status='answered'; q.score=p.score; q.total=p.questions.length; q.answered_at=new Date().toISOString(); changed=true; }
    if(q.progress){ q.progress=null; changed=true; }
    if(changed) await saveQuizSafe(q);
    const lk=learnKeyForTitle(q.title); if(lk) markLearned(lk); // làm xong bài người ấy gửi -> tự đánh dấu chủ đề/bộ tương ứng
  }
  render(); celebrate(); }
async function noteSave(){ const text=($('#m_note')?.value||'').trim(); if(!text){ toast('Viết gì đó đã nha'); return; }
  const remind_at=($('#m_remind')?.value||'')||null;
  const remind_time=remind_at?(($('#m_remind_time')?.value||'')||null):null;
  await Store.saveNote({ id:uid(), space_id:S.space.id, author:S.me, author_name:meName(), text, color:S.tmp.noteTint||NOTE_TINT[0], remind_at, remind_time, notified_at:null, done:false, created_at:new Date().toISOString() });
  closeModal(); await loadAll(); render(); toast(remind_at?'Đã đặt lời nhắc 🔔':'Đã lưu ghi chú'); }
function urlBase64ToUint8Array(base64){ const raw=atob(base64.replace(/-/g,'+').replace(/_/g,'/'));
  const arr=new Uint8Array(raw.length); for(let i=0;i<raw.length;i++) arr[i]=raw.charCodeAt(i); return arr; }
async function enableNotif(){ if(!('Notification' in window)){ toast('Máy này không hỗ trợ thông báo'); return; }
  try{
    const p=await Notification.requestPermission();
    if(p!=='granted'){ toast('Bạn chưa cho phép thông báo'); render(); return; }
    let pushed=false;
    if('serviceWorker' in navigator && 'PushManager' in window && VAPID_PUBLIC_KEY){
      try{ const reg=await navigator.serviceWorker.ready;
        const want=urlBase64ToUint8Array(VAPID_PUBLIC_KEY);
        let sub=await reg.pushManager.getSubscription();
        // Nếu đã có sub nhưng đăng ký bằng khoá VAPID KHÁC (đã đổi key) -> huỷ để đăng ký lại bằng khoá mới
        if(sub){ const have=new Uint8Array(sub.options&&sub.options.applicationServerKey||[]);
          const same=have.length===want.length && have.every((b,i)=>b===want[i]);
          if(!same){ try{ await sub.unsubscribe(); }catch(e){} sub=null; } }
        if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:want });
        const j=sub.toJSON();
        try{ await Store.deletePushSubsFor(S.space.id,S.me); }catch(e){} // dọn sub cũ của mình (khoá cũ) khỏi DB
        await Store.savePushSub({ id:uid(), space_id:S.space.id, person:S.me, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, created_at:new Date().toISOString() });
        pushed=true;
      }catch(e){}
    }
    toast(pushed?'Đã bật thông báo đẩy 🔔 — nhận được cả khi tắt app':'Đã bật nhắc 🔔 (chỉ khi đang mở app)');
    try{ new Notification('cùng nhau 💕',{body:'Mình sẽ nhắc các việc tới hạn.'}); }catch(e){}
    render();
  }catch(e){ toast('Không bật được thông báo'); } }
function maybeNotify(){ if(!('Notification' in window) || Notification.permission!=='granted') return;
  const due=dueList(); if(!due.length) return;
  const key='loveapp_notified_'+todayStr(); if(localStorage.getItem(key)) return; localStorage.setItem(key,'1');
  const body=due.slice(0,3).map(n=>'• '+n.text).join('\n')+(due.length>3?`\n… và ${due.length-3} việc nữa`:'');
  try{ new Notification('🔔 '+due.length+' lời nhắc hôm nay', { body }); }catch(e){} }
async function saveDaily(){ const ans=($('#d_ans')?.value||'').trim(); if(!ans){ toast('Viết gì đó đã nha'); return; }
  const d=S.dailyToday; if(S.me==='a')d.answer_a=ans; else d.answer_b=ans;
  await Store.saveDaily({ id:d.id, space_id:d.space_id, day:d.day, question:d.question, answer_a:d.answer_a, answer_b:d.answer_b });
  S.tmp.dAns=''; await bumpStreak(); S.dailyToday=await Store.getDaily(S.space.id,todayStr())||d; render(); celebrate(); toast('Đã gửi câu trả lời'); }
/* Lưu reaction/reply — chịu được DB cũ chưa chạy SQL thêm cột (fallback bỏ field mới, báo cho biết) */
async function saveDailySafe(patch){ const d=S.dailyToday; if(!d) return;
  Object.assign(d,patch);
  const full={ id:d.id, space_id:d.space_id, day:d.day, question:d.question, answer_a:d.answer_a, answer_b:d.answer_b,
    reaction_a:d.reaction_a||null, reaction_b:d.reaction_b||null, reply_a:d.reply_a||null, reply_b:d.reply_b||null };
  try{ await Store.saveDaily(full); }
  catch(e){ try{ await Store.saveDaily({ id:d.id, space_id:d.space_id, day:d.day, question:d.question, answer_a:d.answer_a, answer_b:d.answer_b });
      toast('Đã lưu tạm — nhờ chạy SQL cột reaction/reply để lưu lâu dài nha'); }catch(e2){} } }
async function dailyReact(who,emoji){ const d=S.dailyToday; if(!d) return; const key='reaction_'+who;
  const val=(d[key]===emoji)?null:emoji; S.tmp.dReactOpen=null;
  if(val) emojiPushRecent(val); await saveDailySafe({[key]:val}); render(); }
async function dailyReplySave(who){ const d=S.dailyToday; if(!d) return;
  const val=($('#d_reply_input')?.value||'').trim(); S.tmp.dReplyOpen=null;
  await saveDailySafe({['reply_'+who]:val||null}); render(); toast(val?'Đã gửi 💬':'Đã xoá lời nhắn'); }

/* ---------- AVATAR: chọn ảnh từ máy -> nén 128x128 JPEG -> lưu vào phòng ---------- */
function chooseAvatar(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) compressAndSaveAvatar(f); };
  inp.click(); }
function compressAndSaveAvatar(file){
  if(file.size>12*1024*1024){ toast('Ảnh hơi lớn, chọn ảnh nhỏ hơn nha'); return; }
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=async ()=>{ try{
      const SZ=128, cv=document.createElement('canvas'); cv.width=SZ; cv.height=SZ; const ctx=cv.getContext('2d');
      const scale=Math.max(SZ/img.width, SZ/img.height), w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(SZ-w)/2,(SZ-h)/2,w,h);
      const url=cv.toDataURL('image/jpeg',0.72);
      await Store.updateSpace(S.space.id,{['avatar_'+S.me]:url});
      S.space['avatar_'+S.me]=url; render(); toast('Đã đổi ảnh đại diện 💕');
    }catch(e){ console.error(e); toast('Chưa lưu được ảnh — nhớ chạy SQL cột avatar trong Supabase nha'); } };
    img.onerror=()=>toast('Không đọc được ảnh này');
    img.src=rd.result; };
  rd.onerror=()=>toast('Không đọc được ảnh này');
  rd.readAsDataURL(file);
}
async function removeAvatar(){ try{ await Store.updateSpace(S.space.id,{['avatar_'+S.me]:null});
  S.space['avatar_'+S.me]=null; render(); toast('Đã bỏ ảnh đại diện'); }catch(e){ toast('Chưa bỏ được ảnh'); } }
/* ---- Ảnh riêng cho ly tim (mảng data URL trong spaces.heart_photos) ---- */
const HEART_PHOTO_MAX=55; // khớp số lượng tim trong ly (HeartTank.seed)
function heartPhotos(){ return (S.space&&Array.isArray(S.space.heart_photos))?S.space.heart_photos:[]; }
function chooseHeartPhoto(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=()=>{ const fs=inp.files?[...inp.files]:[]; if(fs.length) addHeartPhotos(fs); }; inp.click(); }
/* Nén 1 ảnh -> data URL (Promise). Trả null nếu ảnh lỗi/quá lớn.
   Ảnh chỉ hiện trong tim rất nhỏ nên nén nhẹ (150px) — với 55 ảnh vẫn giữ dung lượng đồng bộ hợp lý. */
function compressPhoto(file){ return new Promise((resolve)=>{
  if(!file || file.size>12*1024*1024){ resolve(null); return; }
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=()=>{ try{ const SZ=150, cv=document.createElement('canvas'); cv.width=SZ; cv.height=SZ; const ctx=cv.getContext('2d');
      const scale=Math.max(SZ/img.width, SZ/img.height), w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(SZ-w)/2,(SZ-h)/2,w,h); resolve(cv.toDataURL('image/jpeg',0.62)); }catch(e){ resolve(null); } };
    img.onerror=()=>resolve(null); img.src=rd.result; };
  rd.onerror=()=>resolve(null); rd.readAsDataURL(file);
}); }
/* Thêm NHIỀU ảnh cùng lúc cho ly tim */
async function addHeartPhotos(files){
  const room=HEART_PHOTO_MAX-heartPhotos().length;
  if(room<=0){ toast('Đủ '+HEART_PHOTO_MAX+' ảnh cho trái tim rồi nha'); return; }
  const pick=files.slice(0,room), skipped=files.length-pick.length;
  toast('Đang thêm '+pick.length+' ảnh…');
  const urls=[]; for(const f of pick){ const u=await compressPhoto(f); if(u) urls.push(u); }
  if(!urls.length){ toast('Không đọc được ảnh nào'); return; }
  const arr=heartPhotos().concat(urls);
  try{ await Store.updateSpace(S.space.id,{heart_photos:arr}); S.space.heart_photos=arr; HeartTank._imgKey=null; render();
    toast('Đã thêm '+urls.length+' ảnh 💕'+(skipped>0?' (bỏ '+skipped+' ảnh vượt mức '+HEART_PHOTO_MAX+')':'')); }
  catch(e){ console.error(e); toast('Chưa lưu được — nhớ chạy SQL cột heart_photos nha'); }
}
async function removeHeartPhoto(idx){ const cur=heartPhotos().slice(); if(idx<0||idx>=cur.length) return; cur.splice(idx,1);
  try{ await Store.updateSpace(S.space.id,{heart_photos:cur}); S.space.heart_photos=cur; HeartTank._imgKey=null; render(); toast('Đã bỏ ảnh'); }
  catch(e){ toast('Chưa bỏ được ảnh'); } }
