<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>cùng nhau · học mỗi ngày</title>
<meta name="theme-color" content="#d97a92" />

<!-- Cài như app (PWA) -->
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iPhone/iPad: mở toàn màn hình khi thêm vào Màn hình chính, không thanh Safari -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="cùng nhau" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
<style>
  :root{
    --p1:#d97a92; --p2:#e7a3b4; --accent:#c79a72; --ok:#6cab8e; --no:#e08a93;
    --bg1:#fcf7f4; --bg2:#f6ebe9; --card:#fffdfc; --ink:#473a40; --soft:#9c8a90;
    --line:#efe1de; --chip:#f6ece9;
    --shadow:0 14px 34px rgba(160,110,120,.14); --shadow-sm:0 6px 16px rgba(160,110,120,.10);
    --blob1:#f3d2d8; --blob2:#e7dcc8;
  }
  [data-theme="sage"]{ --p1:#7fa68c; --p2:#a6c4af; --accent:#c0996f; --bg1:#f6faf6; --bg2:#e9f1ea; --card:#fffefb; --ink:#384239; --soft:#86978a; --line:#dde9df; --chip:#e9f1ea; --blob1:#cfe3d3; --blob2:#e7dcc8; }
  [data-theme="dusk"]{ --p1:#9384c0; --p2:#b3a6dc; --accent:#cf9aa8; --bg1:#f8f6fc; --bg2:#ece7f5; --card:#fffdff; --ink:#403a52; --soft:#928aa3; --line:#e4ddf0; --chip:#ece7f5; --blob1:#dcd2ef; --blob2:#efd6dd; }
  [data-theme="sky"]{ --p1:#6f9dc4; --p2:#a3c2dc; --accent:#cf9d8a; --bg1:#f5f9fc; --bg2:#e6eff5; --card:#fdfeff; --ink:#34434f; --soft:#809199; --line:#dbe8f0; --chip:#e6eff5; --blob1:#cfe0ee; --blob2:#efdcd2; }
  [data-theme="sand"]{ --p1:#c89a6f; --p2:#ddbd97; --accent:#b58a8a; --bg1:#fbf7f1; --bg2:#f2e9dc; --card:#fffdf9; --ink:#4a4035; --soft:#9c8d79; --line:#ece0cf; --chip:#f2e9dc; --blob1:#ecdcc2; --blob2:#e6d3d0; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:'Nunito',sans-serif; color:var(--ink); background:var(--bg1); min-height:100vh; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em; }

  .bg{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .bg::before,.bg::after{ content:""; position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
  .bg::before{ width:320px; height:320px; background:var(--blob1); top:-80px; right:-60px; }
  .bg::after{ width:300px; height:300px; background:var(--blob2); bottom:-90px; left:-70px; }

  #app{ position:relative; z-index:1; max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:92px; }
  @media(min-width:520px){
    #app{ margin:20px auto; min-height:calc(100vh - 40px); border-radius:30px; overflow:hidden;
      box-shadow:0 30px 80px rgba(120,80,90,.18); background:var(--bg1); border:1px solid #fff; }
  }

  /* icons */
  .ic{ width:22px; height:22px; display:inline-block; vertical-align:middle; flex:none; }
  .ic.sm{ width:18px; height:18px; }
  .ic.lg{ width:28px; height:28px; }

  /* header */
  .topbar{ position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg1) 80%, transparent);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line); padding:calc(13px + env(safe-area-inset-top)) 16px 13px; display:flex; align-items:center; gap:11px; }
  .mono{ width:38px; height:38px; border-radius:12px; flex:none; display:grid; place-items:center; color:#fff;
    background:linear-gradient(135deg,var(--p1),var(--p2)); box-shadow:var(--shadow-sm); }
  .who{ flex:1; line-height:1.15; min-width:0; }
  .who .names{ font-weight:800; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .sub{ font-size:11.5px; color:var(--soft); }
  .pill{ display:flex; align-items:center; gap:5px; background:var(--card); border:1px solid var(--line);
    padding:6px 11px; border-radius:999px; font-weight:800; color:var(--p1); box-shadow:var(--shadow-sm); font-size:14px; }
  .pill .ic{ color:var(--accent); }
  .iconbtn{ background:var(--card); border:1px solid var(--line); width:38px; height:38px; border-radius:12px;
    display:grid; place-items:center; cursor:pointer; color:var(--soft); box-shadow:var(--shadow-sm); }
  .iconbtn:active{ transform:scale(.92); }

  .screen{ padding:16px; animation:fade .3s ease; }
  .screen.sl{ animation:slideL .32s cubic-bezier(.22,.9,.36,1); }
  .screen.sr{ animation:slideR .32s cubic-bezier(.22,.9,.36,1); }
  .screen.still{ animation:none; }
  @keyframes fade{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  @keyframes slideL{ from{opacity:0; transform:translateX(36px);} to{opacity:1; transform:none;} }
  @keyframes slideR{ from{opacity:0; transform:translateX(-36px);} to{opacity:1; transform:none;} }
  h2.title{ margin:2px 0 14px; font-size:23px; }
  .sub-h{ color:var(--soft); font-size:13.5px; margin:-8px 0 14px; }
  .label{ font-size:12px; font-weight:800; color:var(--soft); text-transform:uppercase; letter-spacing:.05em; margin:18px 4px 8px; }

  .card{ background:var(--card); border-radius:20px; padding:16px; box-shadow:var(--shadow); border:1px solid var(--line); margin-bottom:13px; }
  .row{ display:flex; align-items:center; gap:12px; }
  .grow{ flex:1; min-width:0; }
  .muted{ color:var(--soft); font-size:13.5px; }
  .center{ text-align:center; }

  .btn{ border:none; border-radius:14px; padding:13px 18px; font-size:15px; font-weight:800; cursor:pointer;
    font-family:'Nunito'; background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; box-shadow:var(--shadow-sm);
    transition:transform .12s; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn:active{ transform:translateY(1px) scale(.99); }
  .btn .ic{ width:19px; height:19px; }
  .btn.block{ width:100%; }
  .btn.ghost{ background:var(--card); color:var(--p1); border:1px solid var(--line); }
  .btn.soft{ background:var(--chip); color:var(--ink); box-shadow:none; }
  .btn.sm{ padding:9px 13px; font-size:13px; border-radius:11px; }
  .btn.danger{ background:var(--card); color:var(--no); border:1px solid var(--line); }
  .btn:disabled{ opacity:.45; }

  label.fld{ display:block; margin:12px 0; }
  label.fld .lab{ font-size:12.5px; font-weight:700; color:var(--soft); margin:0 4px 6px; display:block; }
  input,textarea,select{ width:100%; font-family:inherit; font-size:15px; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:13px; padding:12px 13px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus,textarea:focus,select:focus{ border-color:var(--p2); box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 28%, transparent); }
  textarea{ resize:vertical; min-height:60px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:8px 13px; border-radius:11px; border:1px solid var(--line); background:var(--card); font-weight:700;
    font-size:13px; cursor:pointer; transition:all .15s; display:inline-flex; gap:6px; align-items:center; color:var(--ink); }
  .chip.on{ background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; border-color:transparent; }
  .swatch{ width:34px; height:34px; border-radius:10px; border:2px solid var(--line); cursor:pointer; }
  .swatch.on{ border-color:var(--ink); transform:scale(1.05); }

  .seg{ display:flex; background:var(--chip); border-radius:13px; padding:4px; gap:4px; margin-bottom:15px; }
  .seg button{ flex:1; border:none; background:none; padding:9px; border-radius:10px; font-weight:800; color:var(--soft);
    cursor:pointer; font-family:inherit; font-size:14px; }
  .seg button.on{ background:var(--card); color:var(--p1); box-shadow:var(--shadow-sm); }

  /* hero couple */
  .couple{ background:linear-gradient(150deg, color-mix(in srgb,var(--p1) 14%, var(--card)), var(--card));
    text-align:center; padding:22px 16px; position:relative; overflow:hidden; }
  #heart-tank{ position:absolute; top:0; left:0; width:100%; height:100%; display:block; z-index:0; pointer-events:none; }
  .couple-body{ position:relative; z-index:1; }
  .couple .days{ font-family:'Fraunces'; font-size:46px; line-height:1; color:var(--p1);
    text-shadow:0 2px 14px color-mix(in srgb,var(--card) 78%, transparent); }
  .couple .cap{ color:var(--soft); font-weight:700; margin-top:2px; }
  .couple .nm{ font-weight:800; margin-top:8px; }

  .stat{ display:flex; gap:10px; }
  .stat .card{ flex:1; text-align:center; margin:0; padding:14px 8px; }
  .stat .big{ font-family:'Fraunces'; font-size:30px; color:var(--p1); line-height:1; }
  .stat .ttl{ font-size:11.5px; color:var(--soft); font-weight:700; margin-top:3px; }
  .stat .ic{ color:var(--accent); }

  .task{ display:flex; align-items:center; gap:11px; padding:9px 2px; }
  .task .box{ width:26px; height:26px; border-radius:8px; border:1.5px solid var(--line); display:grid; place-items:center; flex:none; color:var(--card); }
  .task.done .box{ background:var(--ok); border-color:transparent; }
  .task .box .ic{ width:15px; height:15px; opacity:0; }
  .task.done .box .ic{ opacity:1; }
  .task .tx{ font-weight:600; }
  .task.done .tx{ color:var(--soft); }

  .listitem{ display:flex; align-items:center; gap:13px; cursor:pointer; }
  .thumb{ width:46px; height:46px; border-radius:13px; display:grid; place-items:center; flex:none; color:var(--ink); }
  .badge{ background:var(--chip); color:var(--p1); font-weight:800; font-size:11.5px; padding:3px 9px; border-radius:999px; }
  .status{ font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; }
  .status.pending{ background:#f6ecdb; color:#b78327; }
  .status.picked{ background:#e4eef6; color:#3a76a3; }
  .status.answered{ background:#e4f1ea; color:#3f9170; }

  .cardrow{ display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); }
  .cardrow:last-child{ border-bottom:none; }
  .check{ width:24px; height:24px; border-radius:7px; border:1.5px solid var(--line); display:grid; place-items:center; flex:none; color:#fff; }
  .check.on{ background:var(--p1); border-color:transparent; }
  .check .ic{ width:15px; height:15px; opacity:0; } .check.on .ic{ opacity:1; }

  /* flashcard */
  .flash-wrap{ perspective:1600px; }
  .flash{ perspective:1200px; }
  .flash .inner{ position:relative; min-height:220px; transition:transform .55s; transform-style:preserve-3d; }
  .flash.flip .inner{ transform:rotateY(180deg); }
  /* lật trang sách khi qua thẻ mới: trang cũ lật về trái, trang mới rơi vào */
  .flash.turn{ animation:pageOut .42s ease-in forwards; transform-origin:left center; }
  .flash.turn-in{ animation:pageIn .46s cubic-bezier(.2,.72,.3,1); transform-origin:left center; }
  @keyframes pageOut{ from{ transform:rotateY(0); opacity:1; } to{ transform:rotateY(-152deg); opacity:.12; } }
  @keyframes pageIn{ 0%{ transform:rotateY(108deg); opacity:.12; } 100%{ transform:rotateY(0); opacity:1; } }
  @media(prefers-reduced-motion:reduce){ .flash.turn,.flash.turn-in{ animation:none; } }
  .flash .face{ position:absolute; inset:0; backface-visibility:hidden; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:26px; border-radius:22px; text-align:center; }
  .flash .front{ background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); }
  .flash .back{ background:linear-gradient(150deg,var(--p1),var(--p2)); color:#fff; transform:rotateY(180deg); box-shadow:var(--shadow); }
  .flash .term{ font-family:'Fraunces'; font-size:30px; }
  .flash .hint{ font-size:12.5px; color:var(--soft); margin-top:10px; }
  .flash .ex{ font-size:14px; opacity:.92; margin-top:12px; font-style:italic; }
  .progress{ height:7px; background:var(--line); border-radius:99px; overflow:hidden; margin:8px 0 16px; }
  .progress > i{ display:block; height:100%; background:linear-gradient(90deg,var(--p1),var(--accent)); border-radius:99px; transition:width .3s; }

  /* đấm kiếm mở màn khi trận đấu bắt đầu (2 lưỡi kiếm lao vào nhau, nổ tia sáng) */
  .duel-clash{ min-height:56vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; }
  .clash-vs{ position:relative; width:200px; height:100px; }
  .clash-sw{ position:absolute; top:50%; font-size:52px; transform:translateY(-50%); filter:drop-shadow(0 4px 10px rgba(160,110,120,.28)); }
  .clash-sw.l{ left:-14px; animation:clashL .8s cubic-bezier(.3,.1,.25,1) forwards; }
  .clash-sw.r{ right:-14px; animation:clashR .8s cubic-bezier(.3,.1,.25,1) forwards; }
  @keyframes clashL{ 0%{ left:-14px; transform:translateY(-50%) rotate(-30deg);} 75%{ left:calc(50% - 44px); transform:translateY(-50%) rotate(18deg);} 100%{ left:calc(50% - 40px); transform:translateY(-50%) rotate(6deg);} }
  @keyframes clashR{ 0%{ right:-14px; transform:translateY(-50%) scaleX(-1) rotate(-30deg);} 75%{ right:calc(50% - 44px); transform:translateY(-50%) scaleX(-1) rotate(18deg);} 100%{ right:calc(50% - 40px); transform:translateY(-50%) scaleX(-1) rotate(6deg);} }
  .clash-spark{ position:absolute; top:50%; left:50%; font-size:38px; opacity:0; transform:translate(-50%,-50%) scale(.3); animation:clashSpark .55s ease .62s forwards; }
  @keyframes clashSpark{ 0%{ transform:translate(-50%,-50%) scale(.3); opacity:0;} 45%{ transform:translate(-50%,-50%) scale(1.6); opacity:1;} 100%{ transform:translate(-50%,-50%) scale(1.1); opacity:0;} }
  .clash-txt{ font-family:'Fraunces'; font-size:24px; color:var(--p1); opacity:0; animation:fade .4s ease .55s forwards; }
  @media(prefers-reduced-motion:reduce){ .clash-sw,.clash-spark,.clash-txt{ animation:none !important; opacity:1; } .clash-sw.l{ left:calc(50% - 40px); } .clash-sw.r{ right:calc(50% - 40px); } }

  /* long-press (react câu hỏi mỗi ngày) */
  .longpressable{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; cursor:pointer; transition:transform .12s; }
  .longpressable.lp-active{ transform:scale(.98); }

  /* react + trả lời kiểu Messenger */
  .answer-card{ position:relative; }
  .react-bar{ position:absolute; top:-22px; right:10px; display:flex; gap:2px; padding:5px 8px; z-index:6;
    background:var(--card); border:1px solid var(--line); border-radius:999px; box-shadow:0 10px 28px rgba(120,80,90,.24);
    transform-origin:bottom right; animation:reactPop .26s cubic-bezier(.34,1.56,.64,1); }
  @keyframes reactPop{ from{ transform:scale(.4) translateY(10px); opacity:0; } to{ transform:none; opacity:1; } }
  .react-bar button{ border:none; background:none; font-size:25px; line-height:1; padding:2px 4px; cursor:pointer;
    border-radius:50%; transition:transform .14s; }
  .react-bar button:hover,.react-bar button:active{ transform:scale(1.4) translateY(-4px); }
  .react-bar button.on{ background:var(--chip); }
  .react-badge{ display:inline-flex; align-items:center; gap:3px; margin-left:6px; padding:2px 8px 2px 5px;
    background:var(--card); border:1px solid var(--line); border-radius:999px; font-size:13px; font-weight:800;
    color:var(--soft); box-shadow:var(--shadow-sm); }
  .cmt-actions{ display:flex; gap:20px; margin-top:11px; padding-top:9px; border-top:1px solid var(--line); }
  .cmt-actions button{ background:none; border:none; font-family:inherit; font-weight:800; font-size:13.5px; color:var(--soft);
    cursor:pointer; padding:0; display:inline-flex; align-items:center; gap:5px; }
  .cmt-actions button:active{ opacity:.6; }
  .cmt-actions button.hot{ color:var(--p1); }
  .reply-quote{ display:flex; gap:8px; margin-top:11px; }
  .reply-quote .ava{ width:28px; height:28px; }
  .reply-quote .bub{ background:var(--chip); border-radius:4px 16px 16px 16px; padding:8px 12px; font-size:14px; line-height:1.4; }
  .reply-quote .bub b{ display:block; font-size:11.5px; color:var(--soft); margin-bottom:1px; }
  .jans{ display:flex; gap:9px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); }
  .jans:first-of-type{ border-top:none; padding-top:0; }
  .reply-box{ display:flex; align-items:center; gap:8px; margin-top:12px; animation:fade .22s; }
  .ava{ width:30px; height:30px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff;
    font-weight:800; font-size:13px; background:linear-gradient(135deg,var(--p1),var(--p2)); overflow:hidden; }
  .ava img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ava.ring{ box-shadow:0 0 0 3px var(--card); }
  .reply-pill{ flex:1; display:flex; align-items:center; gap:4px; background:var(--chip); border:1px solid var(--line);
    border-radius:22px; padding:3px 4px 3px 14px; }
  .reply-pill input{ flex:1; border:none; background:none; box-shadow:none !important; padding:9px 0; font-size:14px; }
  .reply-send{ width:34px; height:34px; border-radius:50%; border:none; flex:none; display:grid; place-items:center;
    cursor:pointer; color:var(--p1); background:none; transition:transform .12s; }
  .reply-send:active{ transform:scale(.88); }
  .reply-send .ic{ width:21px; height:21px; }

  /* notes */
  .note{ border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow-sm); border:1px solid rgba(0,0,0,.04); position:relative; }
  .note .meta{ display:flex; align-items:center; gap:7px; font-size:11.5px; font-weight:800; opacity:.7; margin-bottom:6px; }
  .note .body{ font-size:15px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .note .del{ position:absolute; top:10px; right:10px; cursor:pointer; opacity:.5; }

  .nav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; z-index:40;
    display:flex; justify-content:space-around; background:color-mix(in srgb,var(--bg1) 86%, transparent);
    backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:9px 4px calc(9px + env(safe-area-inset-bottom)); }
  .nav button{ background:none; border:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:10px; font-weight:800; color:var(--soft); padding:4px 9px; border-radius:12px; position:relative; }
  .nav button .ic{ transition:transform .15s; }
  .nav button.on{ color:var(--p1); }
  .nav button.on .ic{ transform:translateY(-2px); }
  .nav button.on.pop .ic{ animation:navpop .38s cubic-bezier(.34,1.56,.64,1); }
  @keyframes navpop{ 0%{ transform:scale(.72) translateY(-1px);} 60%{ transform:scale(1.22) translateY(-4px);} 100%{ transform:scale(1) translateY(-2px);} }
  .nav .dot{ position:absolute; top:0; right:6px; min-width:15px; height:15px; padding:0 4px; border-radius:99px;
    background:var(--p1); color:#fff; font-size:9px; display:grid; place-items:center; font-weight:800; }

  .overlay{ position:fixed; inset:0; background:rgba(60,40,48,.4); z-index:60; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s; }
  @media(min-width:520px){ .overlay{ align-items:center; } }
  .sheet{ background:var(--bg1); width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:20px;
    box-shadow:0 -10px 40px rgba(0,0,0,.18); animation:up .28s ease; max-height:90vh; overflow:auto; }
  @media(min-width:520px){ .sheet{ border-radius:24px; } }
  @keyframes up{ from{ transform:translateY(26px); opacity:0;} to{ transform:none; opacity:1;} }

  .empty{ text-align:center; padding:36px 18px; color:var(--soft); }
  .empty .ic{ width:46px; height:46px; color:var(--line); margin-bottom:10px; }
  .empty .ic *{ stroke:var(--p2); }

  .toast{ position:fixed; bottom:104px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:11px 17px; border-radius:13px; font-weight:700; font-size:14px; z-index:80; box-shadow:0 8px 24px rgba(0,0,0,.22); animation:up .25s; max-width:90%; }

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function scrambleWord(w){ const ls=w.split(''); let s=w,t=0; while(s===w && t<25){ s=shuffle(ls).join(''); t++; } return s; }
function buildQuestions(words, cap){
  const norm = words.map(w=>({ en:(w.en||w.front||'').trim(), vi:(w.vi||w.back||'').trim() })).filter(w=>w.en&&w.vi);
  const pool = shuffle(norm).slice(0, cap||norm.length);
  return pool.map(w=>{
    const single = /^[a-zA-Z]+$/.test(w.en);
    if(single && Math.random()<0.5) return { kind:'scramble', en:w.en, vi:w.vi, scrambled:scrambleWord(w.en) };
    const src = norm.length>=4 ? norm.map(x=>x.vi) : ALL_VI;
    const dis = shuffle(Array.from(new Set(src.filter(v=>v && v!==w.vi)))).slice(0,3);
    return { kind:'mc', en:w.en, vi:w.vi, options:shuffle([w.vi, ...dis]) };
  });
}

  const cols=['#d97a92','#e7a3b4','#c79a72','#7fa68c','#9384c0'],N=110,ps=[];

  let f=0;(function loop(){ f++; ctx.clearRect(0,0,cv.width,cv.height);

  const cols=['rgba(112,140,176,.55)','rgba(140,164,198,.42)','rgba(96,124,160,.5)'],N=130,ps=[];
  for(let i=0;i<N;i++) ps.push({x:Math.random()*(cv.width+80)-20,y:-Math.random()*cv.height,l:11+Math.random()*15,v:8+Math.random()*7,w:1+Math.random()*1.3,c:cols[i%cols.length]});
  let f=0;(function loop(){ f++; ctx.clearRect(0,0,cv.width,cv.height); ctx.lineCap='round';
    ps.forEach(p=>{ p.y+=p.v; p.x-=p.v*.14; if(p.y>cv.height+24 && f<190){ p.y=-24; p.x=Math.random()*(cv.width+80)-20; }
      ctx.strokeStyle=p.c; ctx.lineWidth=p.w; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.l*.14,p.y+p.l); ctx.stroke(); });

/* ===================== LY TIM (ngày bên nhau) — tim đổ như nước, lắc theo cảm biến ===================== */
function drawHeartShape(ctx,x,y,r,col,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(r/9,r/9); ctx.beginPath();
  ctx.moveTo(0,-3);
  ctx.bezierCurveTo(0,-5,-3.2,-6.2,-5.2,-4.2);
  ctx.bezierCurveTo(-8,-1.4,-5.6,3,0,7);
  ctx.bezierCurveTo(5.6,3,8,-1.4,5.2,-4.2);
  ctx.bezierCurveTo(3.2,-6.2,0,-5,0,-3);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ctx.restore();
}
const Heart_COLS=['#e7a3b4','#d97a92','#f2b3c4','#ef9ab0','#f6c9d5','#e58aa4'];
const HeartTank={
  cv:null, ctx:null, dpr:1, w:0, h:0, parts:[], gx:0, gy:0.42, t:0, running:false, raf:null, motionOn:false, listening:false, G:0.42, lastO:0,
  /* Đọc thẳng vector trọng lực: hướng "xuống" thật của thế giới -> tim luôn dồn đúng đáy,
     nghiêng/xoay kiểu gì cũng đúng (khắc phục lỗi phải lật ngược mới thấy tim). */
  onMotion(e){ const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
    HeartTank.lastO=(window.performance?performance.now():Date.now());
    const G=HeartTank.G, k=G/9.8;
    let tx=-a.x*k, ty=a.y*k;                       // màn hình: x phải+, y xuống+ ; a.y hướng lên -> xuống = +a.y
    if(Math.hypot(a.x,a.y)<2){ ty=G*0.5; tx*=0.5; } // máy nằm ngang -> vẫn nhẹ nhàng dồn xuống, khỏi lửng lơ
    tx=Math.max(-G,Math.min(G,tx)); ty=Math.max(-G,Math.min(G,ty));
    HeartTank.gx=HeartTank.gx*0.82+tx*0.18; HeartTank.gy=HeartTank.gy*0.82+ty*0.18; }, // làm mượt
  attach(){ if(this.listening) return; window.addEventListener('devicemotion',this.onMotion,true); this.listening=true; },
  ensure(cv){ if(!cv) return; this.cv=cv; this.ctx=cv.getContext('2d');
    this.resize();
    if(!this.parts.length) this.seed(Math.round(Math.max(36, Math.min(54, this.w*this.h/1600))));
    // Android/desktop: gắn cảm biến luôn (không cần xin quyền)
    const D=window.DeviceMotionEvent;
    if(D && typeof D.requestPermission!=='function'){ this.attach(); this.motionOn=true; }
    if(!this.running){ this.running=true; this.loop(); } },
  resize(){ const cv=this.cv; const w=cv.clientWidth||cv.parentElement.clientWidth||300, h=cv.clientHeight||150;
    this.dpr=Math.min(2, window.devicePixelRatio||1); this.w=w; this.h=h;
    cv.width=Math.round(w*this.dpr); cv.height=Math.round(h*this.dpr);
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    for(const p of this.parts){ p.x=Math.min(w-p.r,Math.max(p.r,p.x)); p.y=Math.min(h-p.r,Math.max(p.r,p.y)); } },
  seed(n){ this.parts=[]; const w=this.w,h=this.h;
    for(let i=0;i<n;i++){ const r=6.5+Math.random()*3.5;
      this.parts.push({ x:r+Math.random()*(w-2*r), y:r+Math.random()*(h-2*r), vx:0, vy:0, r,
        col:Heart_COLS[i%Heart_COLS.length], rot:(Math.random()-0.5)*0.5, vr:(Math.random()-0.5)*0.02 }); } },
  loop(){ if(!this.running) return;
    const ctx=this.ctx,w=this.w,h=this.h,P=this.parts;
    const now=(window.performance?performance.now():Date.now());
    const sensorActive=this.motionOn && (now-this.lastO<1500);   // đang nhận cảm biến thật?
    if(!sensorActive){ this.t+=0.016; this.gx=Math.sin(this.t*1.1)*this.G*0.32; this.gy=this.G; } // chưa có cảm biến: đung đưa nhẹ
    for(const p of P){ p.vx+=this.gx; p.vy+=this.gy; p.vx*=0.94; p.vy*=0.94; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr*0.6; p.vr*=0.96;
      if(p.x<p.r){p.x=p.r;p.vx*=-0.3;} if(p.x>w-p.r){p.x=w-p.r;p.vx*=-0.3;}
      if(p.y<p.r){p.y=p.r;p.vy*=-0.3;} if(p.y>h-p.r){p.y=h-p.r;p.vy*=-0.3;} }
    // va chạm mềm (dính như nước): tách chồng + khử vận tốc lại gần
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){ const a=P[i],b=P[j];
      let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy; const rr=a.r+b.r;
      if(d2<rr*rr && d2>0.01){ const d=Math.sqrt(d2),ov=(rr-d)/2,nx=dx/d,ny=dy/d;
        a.x-=nx*ov;a.y-=ny*ov;b.x+=nx*ov;b.y+=ny*ov;
        const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(rel<0){ const imp=-rel*0.5; a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny; } } }
    for(const p of P){ if(p.x<p.r)p.x=p.r; else if(p.x>w-p.r)p.x=w-p.r; if(p.y<p.r)p.y=p.r; else if(p.y>h-p.r)p.y=h-p.r; } // kẹp biên: không lọt ra ngoài box
    ctx.clearRect(0,0,w,h);
    for(const p of P) drawHeartShape(ctx,p.x,p.y,p.r,p.col,p.rot);
    this.raf=requestAnimationFrame(()=>this.loop()); },
  stop(){ this.running=false; if(this.raf) cancelAnimationFrame(this.raf); this.raf=null; },
};

  S.duelHistory=list.filter(x=>x.status==='done');
  const cur=list.find(x=>x.status==='waiting'||x.status==='active')
    || list.find(x=>x.status==='done' && !duelSeenIds().includes(x.id)) || null;
  S.duel=cur;
  if(S.duelPlay && (!cur || S.duelPlay.id!==cur.id)) S.duelPlay=null;
}

let pollT, duelPollT;
function startPolling(){ clearInterval(duelPollT); duelPollT=setInterval(duelTick, 2500);
  if(Store.mode!=='cloud') return; clearInterval(pollT);
  pollT=setInterval(async ()=>{ if(document.hidden) return; const ae=document.activeElement;
    if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) return; if(S.play || $('.overlay')) return;
    if(S.view==='arena') return; // màn đấu do duelTick lo
    try{ const before=JSON.stringify([S.decks,S.cards,S.quizzes,S.notes,S.dailyToday,S.space,S.duel]);
      const sp=await Store.getSpace(S.space.id); if(sp) S.space=sp; await loadAll();
      if(JSON.stringify([S.decks,S.cards,S.quizzes,S.notes,S.dailyToday,S.space,S.duel])!==before) render();
    }catch(e){} }, 5000); }

/* poll nhanh cho trận đấu (gần trực tiếp) */
async function duelTick(){
  if(document.hidden || !S.space) return;
  const watching = S.view==='arena' || (S.duel && (S.duel.status==='waiting'||S.duel.status==='active'));
  if(!watching) return;
  try{
    const list=await Store.listDuels(S.space.id);
    const prev=S.duel, prevStatus=prev&&prev.status, prevOppDone=prev&&prev['done_'+other(S.me)], prevId=prev&&prev.id;
    applyDuels(list);
    const cur=S.duel;
    // cả hai đã xong nhưng chưa ai chốt -> chốt trận
    if(cur && cur.status==='active' && cur.done_a && cur.done_b){
      await Store.updateDuel(cur.id,S.space.id,{status:'done',finished_at:new Date().toISOString()});
      cur.status='done'; S.duelHistory=[cur,...S.duelHistory];
    }
    const changed = (!!prev!==!!cur) || (cur&&prevId!==cur.id) || (cur&&prevStatus!==cur.status) || (cur&&prevOppDone!==cur['done_'+other(S.me)]);
    if(changed){
      if(prevStatus && !cur && S.view==='arena'){ toast('Trận đấu đã kết thúc/huỷ'); }
      if(S.view==='arena' || !document.activeElement || !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) render();
      return;
    }
    // đang chơi: chỉ cập nhật tiến độ đối thủ, không vẽ lại (giữ ô nhập)
    if(cur && cur.status==='active'){
      const total=(cur.questions||[]).length||1, op=cur['progress_'+other(S.me)]||0;
      const t=$('#opp-txt'), f=$('#opp-fill');
      if(t) t.textContent=(partner()||'Người ấy')+': '+op+'/'+total;
      if(f) f.style.width=(op/total*100)+'%';
    }
  }catch(e){}
}

/* Gọi API AI (Cloudflare Pages Function) — có timeout, tự ném lỗi để nơi gọi fallback */
async function apiPost(path, body, ms){ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(), ms||8000);
  try{ const r=await fetch(path,{ method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body||{}), signal:ctl.signal });
    clearTimeout(t); if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json(); if(j&&j.error) throw new Error(j.error); return j;
  }catch(e){ clearTimeout(t); throw e; } }

async function ensureDaily(sid,day){ let d=await Store.getDaily(sid,day);
  if(!d){ const idx=parseInt(day.replace(/-/g,''),10)%DAILY_QUESTIONS.length;
    let question=DAILY_QUESTIONS[idx];  // mặc định: danh sách cố định (dùng khi AI lỗi / chế độ máy)
    if(useCloud){ try{ const r=await apiPost('/api/daily-question',{ recent:(S.dailyHistory||[]).slice(0,6).map(x=>x.question).filter(Boolean) },7000);
        if(r&&r.question) question=r.question; }catch(e){ /* im lặng, dùng câu mặc định */ } }
    d={ id:uid(), space_id:sid, day, question, answer_a:null, answer_b:null };
    try{ await Store.saveDaily(d); }catch(e){ d=await Store.getDaily(sid,day)||d; } } return d; }
/* Nạp nhật ký câu hỏi các ngày (chỉ khi mở màn câu hỏi, không nằm trong poll 5s) */
async function loadDailyHistory(){ if(!S.space) return;
  try{ S.dailyHistory=await Store.listDaily(S.space.id); if(S.view==='daily') render(); }
  catch(e){ S.dailyHistory=[]; } }

async function bumpStreak(){ const sp=S.space, today=todayStr(); if(sp.last_active===today) return false;
  let streak=(sp.last_active===addDaysStr(today,-1))?(sp.streak||0)+1:1; const longest=Math.max(sp.longest||0,streak);
  await Store.updateSpace(sp.id,{streak,longest,last_active:today}); S.space=Object.assign({},sp,{streak,longest,last_active:today}); return true; }

/* Animation chuyển màn: cùng màn vẽ lại = không nháy; đổi tab = trượt theo hướng; còn lại = fade */
let _lastScreenKey=null;
const NAV_ORDER=['home','library','arena','inbox','notes'];
function screenAnim(){
  const key = S.play ? 'play' : (S.view+':'+(S.sub||''));
  const prev=_lastScreenKey; _lastScreenKey=key;
  if(prev===null) return '';                 // lần vẽ đầu: fade nhẹ
  if(prev===key) return 'still';             // cùng màn (poll/feedback): không nháy lại
  const a=NAV_ORDER.indexOf(prev.split(':')[0]), b=NAV_ORDER.indexOf(key.split(':')[0]);
  if(a>-1 && b>-1 && a!==b) return b>a?'sl':'sr'; // đổi tab: trượt theo hướng
  return '';                                 // màn phụ (cài đặt, học, câu hỏi ngày…): fade
}
function render(){ const app=$('#app');
  const anim=screenAnim();
  if(S.view==='auth'){ app.innerHTML=viewAuth(); }
  else if(S.view==='pair'){ app.innerHTML=viewPair(); }
  else if(S.play){ app.innerHTML=header()+viewStudy(); }
  else {
    let b='';
    switch(S.view){
      case 'home': b=viewHome(); break;
      case 'library': b=S.sub?viewTopic():viewLibrary(); break;
      case 'arena': b=viewArena(); break;
      case 'inbox': b=viewInbox(); break;
      case 'notes': b=viewNotes(); break;
      case 'daily': b=viewDaily(); break;
      case 'settings': b=viewSettings(); break;
      default: b=viewHome();
    }
    app.innerHTML=header()+`<div class="screen">${b}</div>`+nav(anim!=='still');
  }
  if(anim) app.querySelectorAll('.screen').forEach(el=>el.classList.add(anim));
  if(S.view==='library' && !S.sub) applyLibFilter();
  if(S.view==='home' && !S.play) mountHeartTank(); else HeartTank.stop();
  hideLoading(); mountLotties();
}

    try{ Lot.loadAnimation({ container:el, renderer:'svg', loop:true, autoplay:true, path:'lottie/love.json' }); }catch(e){} } }

  const wait=Math.max(0, 650-(Date.now()-bootStart));
  setTimeout(()=>{ const el=$('#loading'); if(el){ el.classList.add('hide'); setTimeout(()=>el.remove(),500); } }, wait); }

/* ---------- ĐẤU TRƯỜNG (thách đấu trực tiếp) ---------- */
function duelSources(){
  const opts=[];
  S.decks.forEach(d=>{ const n=S.cards.filter(c=>c.deck_id===d.id).length; if(n>0) opts.push({v:'d:'+d.id, label:'💗 '+d.name+' ('+n+' từ)'}); });
  LIBRARY.forEach(t=>opts.push({v:'t:'+t.no, label:(isColloc(t)?'🧩 '+t.name+' ('+t.words.length+' cụm)':'Unit '+t.no+' · '+t.name+' ('+t.words.length+' từ)')}));
  return opts;
}
function wordsOfSource(src){
  if(!src) return null;
  const i=src.indexOf(':'), k=src.slice(0,i), id=src.slice(i+1);
  if(k==='t'){ const t=topicByNo(id); return t?{words:t.words,title:t.name}:null; }
  const d=S.decks.find(x=>x.id===id); if(!d) return null;
  const ws=S.cards.filter(c=>c.deck_id===d.id).map(c=>({en:c.front,vi:c.back}));
  return ws.length?{words:ws,title:d.name}:null;
}
function viewArena(){

  if(du && du.status==='waiting'){
    if(du.challenger===S.me) return `

      </div>

    return `
      <h2 class="title">Rủ đấu ⚔️</h2>

        <div class="row">${ic('swords','lg')}<div class="grow">
          <b>${esc(partner()||'Người ấy')} rủ bạn đấu nè!</b>
          <div class="muted">${esc(du.title||'')} · ${(du.questions||[]).length} câu — hai đứa làm CÙNG bộ câu hỏi</div>
          ${du.stake?`<div style="font-style:italic;margin-top:4px">Nếu ${esc(partner()||'người ấy')} thắng: “${esc(du.stake)}”</div>`:''}
        </div></div>
        <label class="fld" style="margin-top:12px"><span class="lab">Cược lại nè — nếu BẠN thắng, người ấy phải…? (không bắt buộc)</span>
          <input id="du_stake2" placeholder="vd: dẫn đi ăn kem 🍦"/></label>
        <div class="row" style="gap:10px;margin-top:12px">
          <button class="btn block" data-act="duel-join" data-id="${du.id}">Nhận lời ⚔️</button>
          <button class="btn soft sm" data-act="duel-decline" data-id="${du.id}">Từ chối</button></div>

function duelCreateView(){

    <div class="card">
      <label class="fld"><span class="lab">Chọn bộ từ</span>

        <div class="grow"><b>${esc(x.title||'')}</b>
          <div class="muted">${(x.created_at||'').slice(5,10).replace('-','/')} · ${esc(nameOf('a'))} ${x.score_a||0} — ${x.score_b||0} ${esc(nameOf('b'))}</div>

/* Popup chi tiết kèo cược của 1 trận (mở bằng nhấn giữ trong lịch sử) */
function openDuelStakeModal(id){ const x=(S.duelHistory||[]).find(d=>d.id===id); if(!x) return;
  const chal=x.challenger||'a', acc=other(chal);
  const win = x.score_a===x.score_b?null:(x.score_a>x.score_b?'a':'b');
  const line=(who,stake)=> `<div class="row" style="gap:10px;padding:8px 0;border-top:1px solid var(--line)">
      ${avatarEl(who,32)}<div class="grow"><div class="muted" style="font-weight:800;font-size:12px">Nếu ${esc(nameOf(who))} thắng</div>
      <div>${stake?'“'+esc(stake)+'”':'<span class="muted">không đặt cược</span>'}</div></div></div>`;
  let result;
  if(win===null){ result=`<b>Hòa nhau 🤝</b> — huỷ cược, đấu lại nha`; }
  else{ const winStake = win===chal ? x.stake : (x.stake_acceptor||x.stake);
    result = winStake
      ? `<b>${esc(nameOf(win))} thắng 👑</b><div style="margin-top:4px">${esc(nameOf(other(win)))} phải: <b>“${esc(winStake)}”</b> ${other(win)===S.me?'🫣':'🫵'}</div>`
      : `<b>${esc(nameOf(win))} thắng 👑</b><div class="muted" style="margin-top:4px">Không có cược cho bên thắng — thoát nạn 😙</div>`; }
  modal(`<h2 class="title" style="margin-top:0">Kèo cược ⚔️</h2>
    <p class="muted" style="margin:-8px 0 6px">${esc(x.title||'')} · ${(x.created_at||'').slice(5,10).replace('-','/')} · ${esc(nameOf('a'))} ${x.score_a||0} — ${x.score_b||0} ${esc(nameOf('b'))}</p>

    <div class="card center" style="border:1.5px dashed var(--p2)">${result}</div>
    <button class="btn block" style="margin-top:14px" data-act="close-modal">Đóng</button>`);
}
/* Màn "đấm kiếm" mở đầu trận — hiện đúng 1 lần cho mỗi trận (cả hai phía), xong tự chuyển sang câu hỏi */
function duelClashView(){
  return `<div class="duel-clash">
    <div class="clash-vs"><div class="clash-sw l">⚔️</div><div class="clash-sw r">⚔️</div><div class="clash-spark">✨</div></div>
    <div class="clash-txt">Bắt đầu đấu!</div>
  </div>`;
}
function duelPlayView(du){
  if(!S.tmp.duelClashDone) S.tmp.duelClashDone=new Set();
  if(!S.tmp.duelClashDone.has(du.id)){
    S.tmp.duelClashDone.add(du.id);
    if(navigator.vibrate){ try{ navigator.vibrate([15,40,15]); }catch(e){} }
    setTimeout(()=>{ if(S.view==='arena' && S.duel && S.duel.id===du.id) render(); }, 1500);
    return duelClashView();
  }
  if(!S.duelPlay || S.duelPlay.id!==du.id) initDuelPlay(du);
  const p=S.duelPlay, qs=du.questions||[], total=qs.length||1;
  const op=du['progress_'+other(S.me)]||0;
  if(p.doneLocal){
    return `<h2 class="title">Xong phần bạn! 🎉</h2>
      <div class="card couple center"><b style="font-size:22px">${p.score}/${total} đúng</b>
        <div class="muted">Đợi ${esc(partner()||'người ấy')} làm xong là biết ai thắng…</div></div>
      <div class="card"><div class="row"><span class="muted grow">Tiến độ của ${esc(partner()||'người ấy')}</span>
        <span class="muted" id="opp-txt">${esc(partner()||'Người ấy')}: ${op}/${total}</span></div>
        <div class="progress"><i id="opp-fill" style="width:${op/total*100}%"></i></div></div>
      <button class="btn danger block sm" data-act="duel-cancel-active">Huỷ trận (nếu chờ lâu quá)</button>`;
  }
  const q=qs[p.idx], fb=p.phase==='feedback';
  return `<div class="row" style="margin-bottom:2px"><button class="iconbtn" data-act="go" data-v="home">${ic('x','sm')}</button>
      <div class="grow center" style="font-weight:800">⚔️ Câu ${p.idx+1}/${total}</div><div style="width:38px"></div></div>
    <div class="row" style="margin:6px 2px 2px"><span class="muted grow">Bạn: ${p.score} đúng</span>
      <span class="muted" id="opp-txt">${esc(partner()||'Người ấy')}: ${op}/${total}</span></div>
    <div class="progress"><i id="opp-fill" style="width:${op/total*100}%;background:linear-gradient(90deg,var(--accent),var(--p2))"></i></div>
    <div class="progress"><i style="width:${p.idx/total*100}%"></i></div>
    ${ q.kind==='mc' ? duelMcBody(q,p,fb) : duelScrBody(q,p,fb) }`;
}
function duelMcBody(q,p,fb){
  return `<div class="card center" style="padding:24px 16px">
      <div class="muted" style="font-weight:700">Nghĩa của ${q.en.includes(' ')?'cụm':'từ'} này là gì?</div>
      <div style="font-family:'Fraunces';font-size:${fitPx(q.en)}px;margin-top:6px">${esc(q.en)}</div></div>
    ${q.options.map((opt,i)=>{ let cls='btn ghost block', style='justify-content:flex-start;text-align:left;margin-bottom:10px';
        if(fb){ if(opt===q.vi){ cls='btn block'; style+=';background:linear-gradient(135deg,var(--ok),#8fc4ac);border:none;color:#fff'; }
                else if(i===p.chosen){ cls='btn block'; style+=';background:#f1c7ce;border:none;color:var(--no)'; }
                else style+=';opacity:.45'; }
        return `<button class="${cls}" style="${style}" ${fb?'disabled':''} data-act="d-answer-mc" data-v="${i}">${esc(opt)}</button>`;
      }).join('')}
    ${ fb?duelFeedback(p,null):'' }`;
}
function duelScrBody(q,p,fb){
  const letters=q.scrambled.toUpperCase().split('').join(' ');
  return `<div class="card center" style="padding:22px 16px">
      <div class="muted" style="font-weight:700">Sắp xếp chữ cái thành từ tiếng Anh</div>

    ${ fb ? duelFeedback(p,q) : `<button class="btn block" style="margin-top:12px" data-act="d-check-scramble">Kiểm tra</button>` }`;
}
function duelFeedback(p,q){ const ok=p.lastCorrect;
  return `<div class="card center" style="background:${ok?'var(--chip)':'#fdeef0'};margin-top:12px">
      <b style="color:${ok?'var(--ok)':'var(--no)'}">${ok?'Chính xác!':'Chưa đúng'}</b>

    <button class="btn block" data-act="d-next">${p.idx+1<((S.duel&&S.duel.questions)||[]).length?'Câu tiếp':'Hoàn thành ⚔️'}</button>`;
}
function duelResultView(du){
  const total=(du.questions||[]).length;
  const my=S.me==='a'?(du.score_a||0):(du.score_b||0), their=S.me==='a'?(du.score_b||0):(du.score_a||0);
  const tie=my===their, iWin=my>their;
  if(S.tmp.duelCeleb!==du.id){ S.tmp.duelCeleb=du.id; if(iWin||tie) setTimeout(celebrate,300); else setTimeout(rainfall,300); }
  const anim = tie ? `<div style="font-size:56px">🤝</div>` : (iWin
      ? `<div class="lottie-box" data-lottie="crown"></div>`
      : `<div class="lottie-box rain" data-lottie="rain"></div>`);
  const cs=(du.stake||'').trim(), as=(du.stake_acceptor||'').trim();
  let stakeCard='';
  if(cs||as){
    if(tie){ stakeCard=`<div class="card center" style="border:1.5px dashed var(--p2);margin-top:13px">
        <div class="label" style="margin:0 0 4px">Giao kèo 😜</div>
        <div class="muted">Hòa nhau nên huỷ cược — đấu lại phân thắng bại nha 🤝</div></div>`; }
    else{
      const winP=du.score_a>du.score_b?'a':'b';
      const winStake=winP===du.challenger?cs:(as||cs);
      if(!winStake){ stakeCard=`<div class="card center" style="border:1.5px dashed var(--p2);margin-top:13px">
          <div class="label" style="margin:0 0 4px">Giao kèo 😜</div>
          <div class="muted">Người thắng không đặt cược — người thua thoát nạn lần này 😙</div></div>`; }
      else{ stakeCard=`<div class="card center" style="border:1.5px ${iWin?'dashed var(--p2)':'solid var(--p1)'};margin-top:13px">
          <div class="label" style="margin:0 0 4px">${iWin?'Phần thưởng của bạn 🏆':'Nhiệm vụ của bạn 🫣'}</div>
          <b style="font-size:17px">“${esc(winStake)}”</b>
          <div class="muted" style="margin-top:6px">${iWin
            ?esc(partner()||'Người ấy')+' thua nên phải thực hiện cho bạn đó nha 🫵'
            :'Bạn thua rồi… chịu khó làm cho '+esc(partner()||'người ấy')+' vui nè, giữ lời nha 🤙'}</div></div>`; }
    }
  }
  return `<div class="center" style="padding-top:12px">
      ${anim}

/* ----- logic đấu ----- */
function initDuelPlay(du){ const qs=du.questions||[]; const prog=du['progress_'+S.me]||0;
  S.duelPlay={ id:du.id, idx:Math.min(prog,qs.length), score:du['score_'+S.me]||0, phase:'ask',
    chosen:null, answerGiven:'', lastCorrect:null, doneLocal: !!du['done_'+S.me] || prog>=qs.length }; }
async function createDuel(){
  if(S.duel && (S.duel.status==='waiting'||S.duel.status==='active')){ toast('Đang có trận chưa xong mà'); return; }
  const src=$('#du_src')?.value, nv=$('#du_n')?.value||'10', stake=($('#du_stake')?.value||'').trim();
  const s=wordsOfSource(src); if(!s){ toast('Chọn bộ từ đã nha'); return; }
  const cap = nv==='all'? undefined : Math.min(parseInt(nv,10)||10, s.words.length);
  const duel={ id:uid(), space_id:S.space.id, challenger:S.me, status:'waiting', stake, title:s.title,
    questions:buildQuestions(s.words,cap), score_a:0, score_b:0, progress_a:0, progress_b:0,
    done_a:false, done_b:false, created_at:new Date().toISOString(), joined_at:null, finished_at:null };
  await Store.saveDuel(duel); S.duel=duel; S.duelPlay=null; S.tmp.duelSrc=null; render(); toast('Đã gửi lời rủ đấu ⚔️'); }
async function joinDuel(id){ const du=S.duel; if(!du||du.id!==id) return;
  const stake2=($('#du_stake2')?.value||'').trim();
  const patch={status:'active',joined_at:new Date().toISOString()}; if(stake2) patch.stake_acceptor=stake2;
  try{ await Store.updateDuel(id,S.space.id,patch); }
  catch(e){ if(patch.stake_acceptor){ delete patch.stake_acceptor; await Store.updateDuel(id,S.space.id,patch); toast('Chưa lưu được cược lại (DB thiếu cột) — trận vẫn bắt đầu'); } else throw e; }
  Object.assign(du,patch); initDuelPlay(du); render(); toast('Vào trận! Cố lên 💪'); }
function persistDuelProgress(){ const p=S.duelPlay, du=S.duel; if(!p||!du) return;
  const patch={}; patch['score_'+S.me]=p.score; patch['progress_'+S.me]=p.idx+1;
  Object.assign(du,patch); Store.updateDuel(du.id,S.space.id,patch).catch(()=>{}); }
function dAnswerMc(i){ const p=S.duelPlay, du=S.duel; if(!p||p.phase!=='ask') return;
  const q=du.questions[p.idx]; p.chosen=i; p.lastCorrect=(q.options[i]===q.vi); if(p.lastCorrect)p.score++;
  p.phase='feedback'; persistDuelProgress(); render(); }
function dCheckScramble(){ const p=S.duelPlay, du=S.duel; if(!p||p.phase!=='ask') return;
  const q=du.questions[p.idx]; const val=($('#dsc_input')?.value||'').trim(); if(!val){ toast('Gõ từ đã nha'); return; }
  p.answerGiven=val; p.lastCorrect=(val.toLowerCase()===q.en.toLowerCase()); if(p.lastCorrect)p.score++;
  p.phase='feedback'; persistDuelProgress(); render(); }
async function dNext(){ const p=S.duelPlay, du=S.duel; if(!p||!du) return;
  if(p.idx+1<(du.questions||[]).length){ p.idx++; p.phase='ask'; p.chosen=null; p.answerGiven=''; render(); return; }
  p.doneLocal=true; const patch={}; patch['done_'+S.me]=true; Object.assign(du,patch);
  await Store.updateDuel(du.id,S.space.id,patch);
  await bumpStreak();
  if(du['done_'+other(S.me)]){ await Store.updateDuel(du.id,S.space.id,{status:'done',finished_at:new Date().toISOString()}); du.status='done'; S.duelHistory=[du,...S.duelHistory.filter(x=>x.id!==du.id)]; }
  render(); }

/* ---------- NOTES ---------- */
function noteDue(n){ return n.remind_at && !n.done && daysDiff(n.remind_at)>=0; }
function dueList(){ return S.notes.filter(noteDue).sort((a,b)=> a.remind_at<b.remind_at?-1:1); }
function dueCount(){ return S.notes.filter(noteDue).length; }
function reminderLabel(r){ const d=daysDiff(r); return d===0?'Hôm nay':(d>0?('Quá '+d+' ngày'):('Còn '+(-d)+' ngày')); }
function noteCard(n){ const d=n.remind_at!=null?daysDiff(n.remind_at):null; const overdue=d!=null&&!n.done&&d>0, today=d===0&&!n.done;
  return `<div class="note" style="background:${n.color||'var(--card)'};${n.done?'opacity:.55':''}">
    <span class="del" data-act="note-del" data-id="${n.id}">${ic('x','sm')}</span>
    <div class="meta">${ic('heart','sm')} ${esc(n.author_name||nameOf(n.author))} · ${(n.created_at||'').slice(5,10).replace('-','/')}
      ${ n.remind_at?`<span class="badge" style="margin-left:6px;${overdue?'background:#fbe1e4;color:var(--no)':today?'background:#f7e6c8;color:#b07d1e':''}">${reminderLabel(n.remind_at)}</span>`:'' }</div>
    <div class="body" style="${n.done?'text-decoration:line-through':''}">${esc(n.text)}</div>
    <button class="btn ${n.done?'soft':'ghost'} sm" style="margin-top:10px" data-act="toggle-done" data-id="${n.id}">${n.done?'↺ Bỏ đánh dấu':ic('check','sm')+' Đã xong'}</button>
  </div>`; }
function viewNotes(){
  const notes=S.notes;
  const dated=notes.filter(n=>n.remind_at && !n.done);
  const overdue=dated.filter(n=>daysDiff(n.remind_at)>0).sort((a,b)=>a.remind_at<b.remind_at?-1:1);
  const today=dated.filter(n=>daysDiff(n.remind_at)===0);
  const upcoming=dated.filter(n=>daysDiff(n.remind_at)<0).sort((a,b)=>a.remind_at<b.remind_at?-1:1);
  const plain=notes.filter(n=>!n.remind_at && !n.done);
  const done=notes.filter(n=>n.done);
  const sec=(t,arr)=> arr.length?`<div class="label">${t}</div>`+arr.map(noteCard).join(''):'';
  const notifOn=('Notification' in window) && Notification.permission==='granted';
  return `<div class="row" style="margin-bottom:4px"><h2 class="title grow" style="margin:0">Nhắc &amp; ghi chú</h2>
      <button class="btn sm" data-act="note-new">${ic('plus','sm')} Viết</button></div>
    <p class="sub-h">Đặt ngày để nhắc — cả hai đứa đều thấy lời nhắc.</p>
    ${ ('Notification' in window)?`<button class="btn ${notifOn?'soft':'ghost'} block sm" style="margin-bottom:14px" data-act="enable-notif">${ic('bell','sm')} ${notifOn?'Đã bật nhắc trên máy này ✓':'Bật nhắc trên máy này'}</button>`:'' }
    ${ notes.length? sec('⚠️ Quá hạn',overdue)+sec('Hôm nay',today)+sec('Sắp tới',upcoming)+sec('Ghi chú (không hẹn ngày)',plain)+sec('Đã xong',done)
       : `<div class="empty">${ic('note','lg')}<div>Chưa có gì.<br>Viết lời nhắc hoặc ghi chú đầu tiên nhé!</div></div>` }`; }

/* ---------- AVATAR (ảnh đại diện, lưu data URL trong space.avatar_a/b) ---------- */

/* nhật ký — 1 câu trả lời của người `who` trong ngày cũ */

/* nhật ký — 1 ngày cũ (bỏ ngày trống, không hiện) */
function dayJournalCard(dd){ if(!(dd.answer_a||dd.answer_b)) return '';
  const [y,m,day]=dd.day.split('-');
  return `<div class="card" style="padding:14px">
    <div class="muted" style="font-weight:800;font-size:12px;color:var(--accent);display:flex;align-items:center;gap:5px">${ic('cal','sm')} ${day}/${m}/${y}</div>
    <div style="font-family:'Fraunces';font-size:15.5px;line-height:1.35;margin:5px 0 12px">${esc(dd.question)}</div>
    ${journalAnswer(dd,'a')}${journalAnswer(dd,'b')}</div>`; }
function dailyJournal(){
  if(S.dailyHistory===null) return `<div class="label">Nhật ký</div><p class="muted center" style="padding:10px">Đang tải…</p>`;
  const hist=(S.dailyHistory||[]).filter(x=>x.day!==todayStr() && (x.answer_a||x.answer_b));
  if(!hist.length) return `<div class="label">📖 Nhật ký</div><p class="muted center" style="padding:10px">Chưa có ngày nào trước đây. Cứ trả lời mỗi ngày, kỷ niệm sẽ dồn lại ở đây 💕</p>`;
  return `<div class="label">📖 Những ngày trước (${hist.length})</div>${hist.map(dayJournalCard).join('')}`;
}
function viewDaily(){ const d=S.dailyToday; if(!d) return `<div class="empty">Đang tải…</div>`;
  const mine=S.me==='a'?d.answer_a:d.answer_b, theirs=S.me==='a'?d.answer_b:d.answer_a, themP=other(S.me);
  const body = mine?`
      ${dAnswerCard(S.me, mine, true)}
      ${ theirs?dAnswerCard(themP, theirs, false)
        :`<div class="empty">${ic('heart','lg')}<div>Chờ ${esc(partner())} trả lời rồi mới hiện ra nha.</div></div>` }`
    :`
      <label class="fld"><span class="lab">Câu trả lời của bạn</span><textarea id="d_ans" placeholder="Viết gì đó thật lòng…">${esc(S.tmp.dAns||'')}</textarea></label>
      <button class="btn block" data-act="save-daily">Gửi câu trả lời</button>
      <p class="muted center">Trả lời giúp giữ chuỗi và bạn sẽ thấy câu của ${esc(partner())}.</p>`;
  return `<div class="row" style="margin-bottom:4px"><button class="iconbtn" data-act="go" data-v="home">${ic('back','sm')}</button>
      <h2 class="title grow" style="margin:0">Câu hỏi hôm nay</h2></div>
    <p class="sub-h">${todayStr().split('-').reverse().join('/')}</p>
    <div class="card couple"><div class="ic" style="color:var(--accent);margin-bottom:6px">${ic('spark','lg')}</div>
      <div style="font-family:'Fraunces';font-size:21px;line-height:1.4">${esc(d.question)}</div></div>
    ${body}
    ${dailyJournal()}`; }

/* ===================== MODALS ===================== */
function modal(html){ const ov=document.createElement('div'); ov.className='overlay'; ov.dataset.act='close-modal';
  ov.innerHTML=`<div class="sheet" data-act="stop">${html}</div>`; document.body.appendChild(ov); return ov; }
function closeModal(){ $('.overlay')?.remove(); }

function openDeckModal(){ S.tmp.tint=DECK_TINT[S.decks.length%DECK_TINT.length];
  modal(`<h2 class="title" style="margin-top:0">Bộ từ của mình 💗</h2>
    <label class="fld"><span class="lab">Tên bộ</span><input id="m_name" placeholder="vd: Từ vựng IELTS của tụi mình"/></label>
    <label class="fld"><span class="lab">Ngôn ngữ / chủ đề (không bắt buộc)</span><input id="m_lang" placeholder="English · 日本語 · kỷ niệm…"/></label>
    <div class="row" style="gap:10px;margin-top:8px"><button class="btn soft block" data-act="close-modal">Huỷ</button>
      <button class="btn block" data-act="save-deck-modal">Tạo bộ</button></div>`);
  setTimeout(()=>$('#m_name')?.focus(),50); }

    <label class="fld"><span class="lab">Mặt sau (nghĩa / đáp án)</span><input id="m_back" value="${esc(card?.back||'')}"/></label>

/* ===================== LONG PRESS (giữ để react câu hỏi mỗi ngày) ===================== */
let lpTimer=null, lpEl=null;
function lpCancel(){ if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } if(lpEl){ lpEl.classList.remove('lp-active'); lpEl=null; } }
document.addEventListener('pointerdown',(e)=>{ const el=e.target.closest('[data-longpress]'); if(!el) return;
  lpCancel(); lpEl=el; el.classList.add('lp-active');
  lpTimer=setTimeout(()=>{ lpTimer=null; el.classList.remove('lp-active'); lpEl=null;
    if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(err){} }
    const kind=el.dataset.longpress;
    if(kind==='daily-react'){ S.tmp.dReactOpen=el.dataset.who; S.tmp.dReplyOpen=null; render(); }
    else if(kind==='duel-stake'){ openDuelStakeModal(el.dataset.id); }
  }, 480); });
document.addEventListener('pointerup', lpCancel);
document.addEventListener('pointerleave', lpCancel, true);
document.addEventListener('pointercancel', lpCancel);
document.addEventListener('scroll', lpCancel, true);

/* ===================== EVENTS ===================== */
document.addEventListener('click', async (e)=>{ const t=e.target.closest('[data-act]'); if(!t) return;
  try{ await handle(t.dataset.act, t.dataset.v, t.dataset.id, t, e); }
  catch(err){ console.error(err); toast(err && err.message ? ('Lỗi: '+err.message) : 'Có lỗi rồi, thử lại nha'); } });

/* Bấm ra ngoài -> đóng thanh cảm xúc đang mở (chạy sau handler chính nên emoji vẫn nhận) */
document.addEventListener('click',(e)=>{ if(!S.tmp.dReactOpen) return;
  if(e.target.closest('.react-bar')||e.target.closest('[data-act="d-react-toggle"]')||e.target.closest('[data-longpress]')) return;
  S.tmp.dReactOpen=null; render(); });

document.addEventListener('input',(e)=>{ const f=e.target.dataset.filter; if(!f) return;
  if(f==='lib'){ S.tmp.libQuery=e.target.value; applyLibFilter(); return; }
  const q=(e.target.value||'').trim().toLowerCase();
  document.querySelectorAll(`[data-flt="${f}"]`).forEach(el=>{ el.style.display=el.dataset.name.includes(q)?'':'none'; }); });

/* Lọc chủ đề tab Học — bỏ dấu để gõ không cần dấu vẫn tìm thấy (vd "hop dong") */
function applyLibFilter(){
  const q=noDiacritics((S.tmp.libQuery||'').trim()).toLowerCase();
  let anyGlobal=false;
  document.querySelectorAll('.lib-sec').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('[data-flt="lib"]').forEach(row=>{
      const show=!q||row.dataset.name.includes(q); row.style.display=show?'':'none'; if(show) any=true; });
    sec.style.display=any?'':'none'; if(any) anyGlobal=true; });
  const empty=$('#lib-empty'); if(empty) empty.style.display=(q&&!anyGlobal)?'':'none';
}

document.addEventListener('keydown',(e)=>{ if(e.key!=='Enter') return;
  if(e.target.id==='sc_input'){ e.preventDefault(); handle('check-scramble'); }
  else if(e.target.id==='dsc_input'){ e.preventDefault(); handle('d-check-scramble'); }
  else if(e.target.id==='d_reply_input'){ e.preventDefault(); handle('d-reply-send',S.tmp.dReplyOpen); }
  else if(e.target.id==='qa_front'){ e.preventDefault(); $('#qa_back')?.focus(); }
  else if(e.target.id==='qa_back'){ e.preventDefault(); handle('quick-add',null,e.target.dataset.deck); }
  else if(e.target.id==='a_pin'){ e.preventDefault(); handle(S.authTab==='register'?'do-register':'do-login'); } });

async function handle(act,v,id,t,e){
  switch(act){
    case 'go': S.view=v; S.sub=null; S.tmp.dReactOpen=null; S.tmp.dReplyOpen=null; if(v!=='compose')S.compose=null; render(); scrollTo(0,0);
      if(v==='daily') loadDailyHistory(); break;
    case 'atab': S.authTab=v; render(); break;
    case 'do-register': await doRegister(); break;
    case 'do-login': await doLogin(); break;
    case 'logout': localStorage.removeItem('loveapp_user'); location.reload(); break;

    case 'pair-create': await pairCreate(); break;
    case 'pair-join': await pairJoin($('#p_code')?.value); break;
    case 'accept-invite': await acceptInvite(id); break;
    case 'decline-invite': await Store.updateInvite(id,{status:'declined'}); S.invites=S.invites.filter(x=>x.id!==id); render(); break;
    case 'send-invite': await sendInvite(); break;

    case 'close-modal': closeModal(); break;
    case 'stop': break;

    case 'lib-filter': S.tmp.libFilter=v; render(); break;
    case 'open-topic': S.sub=id; S.view='library'; render(); scrollTo(0,0); break;
    case 'study-topic': { const tt=topicByNo(id); if(tt) startStudy(tt.words,{mode:t.dataset.mode||'quiz',src:'lib',title:tt.name,back:'library'}); } break;
    case 'send-topic': await sendTopic(id); break;

    /* bộ từ của mình */
    case 'open-deck': S.sub=id; S.view='library'; render(); scrollTo(0,0); break;
    case 'new-deck': openDeckModal(); break;
    case 'save-deck-modal': await saveDeckModal(); break;
    case 'del-deck': if(confirm('Xoá bộ từ này và toàn bộ từ bên trong?')){ await Store.deleteDeck(S.space.id,id); await loadAll(); S.sub=null; render(); toast('Đã xoá bộ'); } break;
    case 'quick-add': await quickAdd(id); break;
    case 'bulk-open': openBulkModal(id); break;
    case 'bulk-save': await bulkSave(id); break;
    case 'edit-card': { const c=S.cards.find(x=>x.id===id); if(c) openCardModal(c.deck_id,c); } break;
    case 'save-card': await saveCard(t.dataset.deck,t.dataset.id); break;
    case 'del-card': await Store.deleteCard(S.space.id,id); await loadAll(); render(); break;
    case 'study-deck': { const dd=S.decks.find(x=>x.id===id); if(dd){ const ws=S.cards.filter(c=>c.deck_id===id).map(c=>({en:c.front,vi:c.back}));
        startStudy(ws,{mode:t.dataset.mode||'quiz',src:'lib',title:dd.name,back:'library'}); } } break;
    case 'send-deck': await sendDeck(id); break;

    /* đấu trường */
    case 'duel-from': S.tmp.duelSrc=v; S.view='arena'; S.sub=null; render(); scrollTo(0,0); break;
    case 'duel-create': await createDuel(); break;
    case 'duel-join': await joinDuel(id); break;
    case 'duel-decline': if(confirm('Từ chối lời rủ đấu này?')){ await Store.updateDuel(id,S.space.id,{status:'cancelled'}); S.duel=null; render(); } break;
    case 'duel-cancel': if(confirm('Huỷ trận này?')){ await Store.updateDuel(S.duel.id,S.space.id,{status:'cancelled'}); S.duel=null; S.duelPlay=null; render(); } break;
    case 'duel-cancel-active': if(confirm('Huỷ trận đang diễn ra? (cả hai sẽ mất kết quả)')){ await Store.updateDuel(S.duel.id,S.space.id,{status:'cancelled'}); S.duel=null; S.duelPlay=null; render(); } break;
    case 'd-answer-mc': dAnswerMc(parseInt(v,10)); break;
    case 'd-check-scramble': dCheckScramble(); break;
    case 'd-next': await dNext(); break;
    case 'duel-seen': markDuelSeen(id); S.duel=null; S.duelPlay=null; render(); break;
    case 'study-lesson': { const q=S.quizzes.find(x=>x.id===id); if(q){
        if(q.status==='pending' && q.to_person===S.me){ q.status='picked'; q.picked_at=new Date().toISOString(); await Store.saveQuiz(q); }
        startStudy(q.items,{mode:t.dataset.mode||'quiz',src:'lesson',quiz:q,title:q.title,back:'inbox'}); } } break;

    case 'inbox-tab': S.inboxTab=v; render(); break;
    case 'flip': if(S.play){ S.play.flip=!S.play.flip; const fl=$('.flash'); if(fl) fl.classList.toggle('flip',S.play.flip); else render(); } break;
    case 'next-card': await nextCard(); break;
    case 'ai-example': await aiExampleForCurrent(); break;
    case 'answer-mc': await answerMc(parseInt(v,10)); break;
    case 'check-scramble': await checkScramble(); break;
    case 'next-q': await nextQ(); break;
    case 'to-quiz': { const p=S.play; startStudy(p.words,{mode:'quiz',src:p.src,quiz:p.quiz,title:p.title,back:p.back}); } break;
    case 'restudy': { const p=S.play; startStudy(p.words,{mode:p.mode,src:p.src,quiz:p.quiz,title:p.title,back:p.back}); } break;
    case 'quit-play': { const back=(S.play&&S.play.back)||'home'; S.play=null; S.view=back; render(); } break;
    case 'finish-play': S.play=null; S.view='home'; await loadAll(); render(); break;

    case 'note-new': openNoteModal(); break;
    case 'pick-tint': S.tmp.noteTint=v; document.querySelectorAll('#m_tint .swatch').forEach(s=>s.classList.remove('on')); t.classList.add('on'); break;
    case 'note-save': await noteSave(); break;
    case 'toggle-done': { const n=S.notes.find(x=>x.id===id); if(n){ n.done=!n.done; await Store.saveNote(n); await loadAll(); render(); } } break;
    case 'enable-notif': await enableNotif(); break;
    case 'install-app': await installApp(); break;
    case 'hide-install': localStorage.setItem('loveapp_hide_install','1'); render(); break;
    case 'note-del': if(confirm('Xoá ghi chú này?')){ await Store.deleteNote(S.space.id,id); await loadAll(); render(); } break;

    case 'save-daily': await saveDaily(); break;
    case 'edit-daily': { const d=S.dailyToday; S.tmp.dAns=(S.me==='a'?d.answer_a:d.answer_b)||''; if(S.me==='a')d.answer_a=null; else d.answer_b=null; render(); } break;
    case 'daily-react': { const i=v.indexOf('|'); await dailyReact(v.slice(0,i), v.slice(i+1)); } break;
    case 'd-react-toggle': S.tmp.dReactOpen = S.tmp.dReactOpen===v?null:v; S.tmp.dReplyOpen=null; render(); break;
    case 'd-reply-toggle': S.tmp.dReplyOpen = S.tmp.dReplyOpen===v?null:v; S.tmp.dReactOpen=null; render(); setTimeout(()=>$('#d_reply_input')?.focus(),40); break;
    case 'd-reply-send': await dailyReplySave(v); break;
    case 'avatar-pick': chooseAvatar(); break;
    case 'avatar-remove': await removeAvatar(); break;

    case 'copy-code': navigator.clipboard?.writeText(S.space.id).then(()=>toast('Đã chép mã'),()=>toast(S.space.id)); break;
    case 'save-start': { const sd=$('#s_start').value; await Store.updateSpace(S.space.id,{start_date:sd}); S.space.start_date=sd; render(); toast('Đã lưu ngày'); } break;
    case 'save-names': { const a=$('#s_a').value.trim(),b=$('#s_b').value.trim(); await Store.updateSpace(S.space.id,{person_a:a,person_b:b}); S.space.person_a=a; S.space.person_b=b; render(); toast('Đã lưu'); } break;
    case 'set-theme': await Store.updateSpace(S.space.id,{theme:v}); S.space.theme=v; applyTheme(); render(); break;
    case 'leave': if(confirm('Rời khỏi phòng này?')){ await Store.updateUser(S.user.username,{space_id:null,person:null}); S.user.space_id=null; S.space=null; S.invites=await Store.listInvites(S.user.username); S.view='pair'; render(); } break;
  }
}

/* ----- impl ----- */
async function doRegister(){
  const display=($('#a_disp')?.value||'').trim(), username=($('#a_user')?.value||'').trim().toLowerCase(), pin=($('#a_pin')?.value||'');
  if(!display||!username||pin.length<4){ toast('Điền đủ tên, tên đăng nhập và PIN (≥4) nha'); return; }
  if(await Store.getUser(username)){ toast('Tên đăng nhập này đã có người dùng'); return; }
  const u={ username, display, passcode:hashPass(pin), space_id:null, person:null, created_at:new Date().toISOString() };
  await Store.createUser(u); S.user=u; localStorage.setItem('loveapp_user',username);
  S.invites=await Store.listInvites(username); S.view='pair'; render(); toast('Tạo tài khoản thành công');
}
async function doLogin(){
  const username=($('#a_user')?.value||'').trim().toLowerCase(), pin=($('#a_pin')?.value||'');
  if(!username||!pin){ toast('Nhập tên đăng nhập và PIN'); return; }
  const u=await Store.getUser(username);
  if(!u||u.passcode!==hashPass(pin)){ toast('Sai tên đăng nhập hoặc PIN'); return; }
  S.user=u; localStorage.setItem('loveapp_user',username);
  if(u.space_id){ const sp=await Store.getSpace(u.space_id); if(sp){ S.space=sp; S.me=u.person; applyTheme(); await loadAll(); S.view='home'; render(); startPolling(); return; } }
  S.invites=await Store.listInvites(username); S.view='pair'; render();
}
async function pairCreate(){
  const name=($('#p_name')?.value||'').trim()||'Tụi mình', start=$('#p_start')?.value||null;
  const space={ id:newCode(), name, person_a:S.user.display, person_b:'', person_a_username:S.user.username, person_b_username:'',
    theme:'blush', start_date:start, streak:0, longest:0, last_active:null, created_at:new Date().toISOString() };
  await Store.createSpace(space); await Store.updateUser(S.user.username,{space_id:space.id,person:'a'});
  S.user.space_id=space.id; S.user.person='a'; S.space=space; S.me='a'; applyTheme(); await loadAll();
  S.view='home'; render(); startPolling(); toast('Đã tạo phòng! Mời người ấy nha');
}
async function pairJoin(codeRaw){
  const code=(codeRaw||'').trim().toLowerCase(); if(!code){ toast('Nhập mã đã nha'); return; }
  const sp=await Store.getSpace(code); if(!sp){ toast('Không tìm thấy mã này'); return; }
  if(sp.person_b_username && sp.person_b_username!==S.user.username && sp.person_a_username!==S.user.username){ toast('Phòng đã đủ hai người'); return; }
  let me='b';
  if(sp.person_a_username===S.user.username) me='a';
  else if(sp.person_b_username===S.user.username) me='b';
  else { await Store.updateSpace(sp.id,{person_b:S.user.display, person_b_username:S.user.username}); sp.person_b=S.user.display; sp.person_b_username=S.user.username; }
  await Store.updateUser(S.user.username,{space_id:sp.id,person:me});
  S.user.space_id=sp.id; S.user.person=me; S.space=sp; S.me=me; applyTheme(); await loadAll();
  S.view='home'; render(); startPolling(); toast('Vào phòng thành công');
}
async function acceptInvite(invId){ const inv=S.invites.find(x=>x.id===invId); if(!inv) return;
  await Store.updateInvite(invId,{status:'accepted'}); await pairJoin(inv.space_id); }
async function sendInvite(){ const to=($('#s_invite')?.value||'').trim().toLowerCase();
  if(!to){ toast('Nhập tên đăng nhập của người ấy'); return; }
  if(to===S.user.username){ toast('Đó là chính bạn mà 🙂'); return; }
  await Store.createInvite({ id:uid(), space_id:S.space.id, from_display:S.user.display, from_username:S.user.username, to_username:to, status:'pending', created_at:new Date().toISOString() });
  $('#s_invite').value=''; toast('Đã gửi lời mời tới @'+to);
}
async function saveDeckModal(){ const name=($('#m_name')?.value||'').trim(); if(!name){ toast('Đặt tên bộ đã nha'); return; }
  const deck={ id:uid(), space_id:S.space.id, name, lang:($('#m_lang')?.value||'').trim(), color:DECK_TINT[S.decks.length%DECK_TINT.length], created_at:new Date().toISOString() };
  await Store.saveDeck(deck); closeModal(); await loadAll(); S.view='library'; S.sub=deck.id; render(); toast('Đã tạo bộ từ 💗'); }
async function quickAdd(deckId){ const f=($('#qa_front')?.value||'').trim(), b=($('#qa_back')?.value||'').trim(), ex=($('#qa_ex')?.value||'').trim();
  if(!f||!b){ toast('Điền cả từ và nghĩa nha'); return; }
  await Store.saveCard({ id:uid(), space_id:S.space.id, deck_id:deckId, front:f, back:b, example:ex, created_by:S.me, created_at:new Date().toISOString() });
  await loadAll(); render(); setTimeout(()=>$('#qa_front')?.focus(),30); }
async function bulkSave(deckId){ const raw=($('#m_bulk')?.value||''); const lines=raw.split('\n');
  const arr=[]; let i=0;
  for(const line of lines){ const s=line.trim(); if(!s) continue;
    const parts=s.split(/\s*(?:\t|=|,|;|:|—|–|\| )\s*/); if(parts.length<2) continue;
    const front=parts[0].trim(), back=parts.slice(1).join(' ').trim(); if(!front||!back) continue;
    arr.push({ id:uid(), space_id:S.space.id, deck_id:deckId, front, back, example:'', created_by:S.me, created_at:new Date(Date.now()+ (i++)).toISOString() }); }
  if(!arr.length){ toast('Chưa nhận ra thẻ nào — kiểm tra dấu ngăn cách nha'); return; }
  await Store.saveCards(arr); closeModal(); await loadAll(); render(); toast(`Đã thêm ${arr.length} thẻ`); }
async function saveCard(deckId,cardId){ const f=($('#m_front')?.value||'').trim(), b=($('#m_back')?.value||'').trim();
  if(!f||!b){ toast('Điền cả hai mặt nha'); return; } const ex=($('#m_ex')?.value||'').trim();
  const existing=cardId?S.cards.find(c=>c.id===cardId):null;
  await Store.saveCard({ id:cardId||uid(), space_id:S.space.id, deck_id:deckId, front:f, back:b, example:ex, created_by:S.me, created_at:existing?.created_at||new Date().toISOString() });
  closeModal(); await loadAll(); render(); toast(cardId?'Đã lưu':'Đã thêm thẻ'); }
async function sendTopic(topicNo){ const t=topicByNo(topicNo); if(!t) return;
  const items=t.words.map(w=>({en:w.en, vi:w.vi}));
  await Store.saveQuiz({ id:uid(), space_id:S.space.id, from_person:S.me, to_person:other(S.me), title:t.name, message:'',
    status:'pending', items, score:0, total:items.length, created_at:new Date().toISOString(), picked_at:null, answered_at:null });
  await loadAll(); S.view='inbox'; S.inboxTab='out'; render(); toast('Đã gửi cho '+(partner()||'người ấy')); }
async function sendDeck(deckId){ const d=S.decks.find(x=>x.id===deckId); if(!d) return;
  const items=S.cards.filter(c=>c.deck_id===deckId).map(c=>({en:c.front, vi:c.back}));
  if(!items.length){ toast('Bộ này chưa có từ nào'); return; }
  await Store.saveQuiz({ id:uid(), space_id:S.space.id, from_person:S.me, to_person:other(S.me), title:d.name, message:'',
    status:'pending', items, score:0, total:items.length, created_at:new Date().toISOString(), picked_at:null, answered_at:null });
  await loadAll(); S.view='inbox'; S.inboxTab='out'; render(); toast('Đã gửi cho '+(partner()||'người ấy')); }
function studyTopic(topicNo){ const t=topicByNo(topicNo); if(!t) return; startStudy(t.words,{src:'lib',title:t.name,back:'library'}); }
async function pickup(qid){ const q=S.quizzes.find(x=>x.id===qid); if(!q) return;
  if(q.status==='pending' && q.to_person===S.me){ q.status='picked'; q.picked_at=new Date().toISOString(); await Store.saveQuiz(q); }
  startStudy(q.items,{src:'lesson',quiz:q,title:q.title,back:'inbox'}); }
/* Lưu bài dò kèm progress — chịu được DB cũ chưa chạy SQL thêm cột progress */
async function saveQuizSafe(q){ try{ await Store.saveQuiz(q); }
  catch(e){ const {progress,...rest}=q;
    try{ await Store.saveQuiz(rest); toast('Đã lưu tạm — nhờ chạy SQL cột progress để lưu tiến độ lâu dài nha'); }catch(e2){} } }
/* Lưu tiến độ đang làm dở của bài dò (được gửi), để thoát ra vào lại không mất */
async function saveLessonProgress(idx,score){ const p=S.play; if(!p||!p.quiz||p.src!=='lesson') return;
  p.quiz.progress = p.mode==='quiz' ? {mode:'quiz',idx,score,questions:p.questions} : {mode:'flash',idx,cards:p.cards};
  await saveQuizSafe(p.quiz); }
function startStudy(words,opts){ opts=opts||{}; const mode=opts.mode||'quiz';
  const norm=(words||[]).map(w=>({ en:(w.en||w.front||'').trim(), vi:(w.vi||w.back||'').trim() })).filter(w=>w.en&&w.vi);
  if(!norm.length){ toast('Chủ đề này chưa có từ để học'); return; }
  const prog = opts.quiz && opts.quiz.progress && opts.quiz.progress.mode===mode ? opts.quiz.progress : null;
  const cards = mode==='flash'? (prog && prog.cards && prog.cards.length===norm.length ? prog.cards : shuffle(norm)) : [];
  const questions = mode==='quiz'? (prog && prog.questions && prog.questions.length ? prog.questions : buildQuestions(norm)) : [];
  const idx = prog ? Math.max(0, prog.idx||0) : 0;
  const alreadyDone = mode==='quiz' && prog && idx>=questions.length;
  S.play={ mode, src:opts.src||'lib', quiz:opts.quiz||null, title:opts.title||'Học', back:opts.back||'library',
    words:norm, idx: alreadyDone?Math.max(0,questions.length-1):(mode==='flash'?Math.min(idx,cards.length-1):idx),
    score:(prog&&prog.score)||0, done:alreadyDone, streakUp:false, flip:false,
    cards, questions,
    phase:'ask', chosen:null, answerGiven:'', lastCorrect:null };
  render(); scrollTo(0,0);
  if(alreadyDone) finishStudy(); }
async function answerMc(i){ const p=S.play; if(!p||p.phase!=='ask') return; const q=p.questions[p.idx];
  p.chosen=i; p.lastCorrect=(q.options[i]===q.vi); if(p.lastCorrect)p.score++; p.phase='feedback'; render();
  await saveLessonProgress(p.idx+1,p.score); }
async function checkScramble(){ const p=S.play; if(!p||p.phase!=='ask') return; const q=p.questions[p.idx];
  const val=($('#sc_input')?.value||'').trim(); if(!val){ toast('Gõ từ đã nha'); return; }
  p.answerGiven=val; p.lastCorrect=(val.toLowerCase()===q.en.toLowerCase()); if(p.lastCorrect)p.score++; p.phase='feedback'; render();
  await saveLessonProgress(p.idx+1,p.score); }
async function nextQ(){ const p=S.play; if(!p) return;
  if(p.idx+1<p.questions.length){ p.idx++; p.phase='ask'; p.chosen=null; p.answerGiven=''; render(); }
  else await finishStudy(); }
async function nextCard(){ const p=S.play; if(!p||p.turning) return;
  if(p.idx+1>=p.cards.length){ await finishStudy(); return; }
  const fl=$('.flash');
  if(fl && !matchMedia('(prefers-reduced-motion:reduce)').matches){
    p.turning=true; fl.classList.remove('flip'); fl.classList.add('turn');   // lật trang cũ đi
    await new Promise(r=>setTimeout(r,410)); p.turning=false; }
  p.idx++; p.flip=false; p.turnIn=true; render(); p.turnIn=false;             // trang mới rơi vào
  await saveLessonProgress(p.idx,null);
}
/* Xin AI ví dụ + cách dùng cho thẻ đang xem (cache theo từ để khỏi gọi lại) */
async function aiExampleForCurrent(){ const p=S.play; if(!p||!p.cards) return; const c=p.cards[p.idx]; if(!c) return;
  p.exCache=p.exCache||{}; const cur=p.exCache[c.en]; if(cur==='loading'||(cur&&!cur.error)) return;
  p.exCache[c.en]='loading'; render();
  try{ const j=await apiPost('/api/word-example',{en:c.en,vi:c.vi},9000);
    p.exCache[c.en]={ example:j.example||'', example_vi:j.example_vi||'', usage:j.usage||'', meaning_note:j.meaning_note||'' };
  }catch(e){ p.exCache[c.en]={error:true}; toast('Chưa lấy được ví dụ (cần deploy bản AI)'); }
  render(); }
async function finishStudy(){ const p=S.play; p.done=true;
  p.streakUp=await bumpStreak();
  if(p.quiz && p.src==='lesson'){
    const q=p.quiz; let changed=false;
    if(p.mode==='quiz' && q.to_person===S.me && q.status!=='answered'){
      q.status='answered'; q.score=p.score; q.total=p.questions.length; q.answered_at=new Date().toISOString(); changed=true; }
    if(q.progress){ q.progress=null; changed=true; }
    if(changed) await saveQuizSafe(q); }
  render(); celebrate(); }
async function noteSave(){ const text=($('#m_note')?.value||'').trim(); if(!text){ toast('Viết gì đó đã nha'); return; }
  const remind_at=($('#m_remind')?.value||'')||null;
  await Store.saveNote({ id:uid(), space_id:S.space.id, author:S.me, author_name:meName(), text, color:S.tmp.noteTint||NOTE_TINT[0], remind_at, done:false, created_at:new Date().toISOString() });
  closeModal(); await loadAll(); render(); toast(remind_at?'Đã đặt lời nhắc 🔔':'Đã lưu ghi chú'); }
async function enableNotif(){ if(!('Notification' in window)){ toast('Máy này không hỗ trợ thông báo'); return; }
  try{ const p=await Notification.requestPermission();
    if(p==='granted'){ toast('Đã bật nhắc 🔔'); try{ new Notification('cùng nhau 💕',{body:'Mình sẽ nhắc các việc tới hạn khi bạn mở app.'}); }catch(e){} }
    else toast('Bạn chưa cho phép thông báo'); render();
  }catch(e){ toast('Không bật được thông báo'); } }
function maybeNotify(){ if(!('Notification' in window) || Notification.permission!=='granted') return;
  const due=dueList(); if(!due.length) return;
  const key='loveapp_notified_'+todayStr(); if(localStorage.getItem(key)) return; localStorage.setItem(key,'1');
  const body=due.slice(0,3).map(n=>'• '+n.text).join('\n')+(due.length>3?`\n… và ${due.length-3} việc nữa`:'');
  try{ new Notification('🔔 '+due.length+' lời nhắc hôm nay', { body }); }catch(e){} }
async function saveDaily(){ const ans=($('#d_ans')?.value||'').trim(); if(!ans){ toast('Viết gì đó đã nha'); return; }
  const d=S.dailyToday; if(S.me==='a')d.answer_a=ans; else d.answer_b=ans;
  await Store.saveDaily({ id:d.id, space_id:d.space_id, day:d.day, question:d.question, answer_a:d.answer_a, answer_b:d.answer_b });
  S.tmp.dAns=''; await bumpStreak(); S.dailyToday=await Store.getDaily(S.space.id,todayStr())||d; render(); celebrate(); toast('Đã gửi câu trả lời'); }
/* Lưu reaction/reply — chịu được DB cũ chưa chạy SQL thêm cột (fallback bỏ field mới, báo cho biết) */
async function saveDailySafe(patch){ const d=S.dailyToday; if(!d) return;
  Object.assign(d,patch);
  const full={ id:d.id, space_id:d.space_id, day:d.day, question:d.question, answer_a:d.answer_a, answer_b:d.answer_b,
    reaction_a:d.reaction_a||null, reaction_b:d.reaction_b||null, reply_a:d.reply_a||null, reply_b:d.reply_b||null };
  try{ await Store.saveDaily(full); }
  catch(e){ try{ await Store.saveDaily({ id:d.id, space_id:d.space_id, day:d.day, question:d.question, answer_a:d.answer_a, answer_b:d.answer_b });
      toast('Đã lưu tạm — nhờ chạy SQL cột reaction/reply để lưu lâu dài nha'); }catch(e2){} } }
async function dailyReact(who,emoji){ const d=S.dailyToday; if(!d) return; const key='reaction_'+who;
  const val=(d[key]===emoji)?null:emoji; S.tmp.dReactOpen=null; await saveDailySafe({[key]:val}); render(); }
async function dailyReplySave(who){ const d=S.dailyToday; if(!d) return;
  const val=($('#d_reply_input')?.value||'').trim(); S.tmp.dReplyOpen=null;
  await saveDailySafe({['reply_'+who]:val||null}); render(); toast(val?'Đã gửi 💬':'Đã xoá lời nhắn'); }

/* ---------- AVATAR: chọn ảnh từ máy -> nén 128x128 JPEG -> lưu vào phòng ---------- */
function chooseAvatar(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) compressAndSaveAvatar(f); };
  inp.click(); }
function compressAndSaveAvatar(file){
  if(file.size>12*1024*1024){ toast('Ảnh hơi lớn, chọn ảnh nhỏ hơn nha'); return; }
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=async ()=>{ try{
      const SZ=128, cv=document.createElement('canvas'); cv.width=SZ; cv.height=SZ; const ctx=cv.getContext('2d');
      const scale=Math.max(SZ/img.width, SZ/img.height), w=img.width*scale, h=img.height*scale;
      ctx.drawImage(img,(SZ-w)/2,(SZ-h)/2,w,h);
      const url=cv.toDataURL('image/jpeg',0.72);
      await Store.updateSpace(S.space.id,{['avatar_'+S.me]:url});
      S.space['avatar_'+S.me]=url; render(); toast('Đã đổi ảnh đại diện 💕');
    }catch(e){ console.error(e); toast('Chưa lưu được ảnh — nhớ chạy SQL cột avatar trong Supabase nha'); } };
    img.onerror=()=>toast('Không đọc được ảnh này');
    img.src=rd.result; };
  rd.onerror=()=>toast('Không đọc được ảnh này');
  rd.readAsDataURL(file);
}
async function removeAvatar(){ try{ await Store.updateSpace(S.space.id,{['avatar_'+S.me]:null});
  S.space['avatar_'+S.me]=null; render(); toast('Đã bỏ ảnh đại diện'); }catch(e){ toast('Chưa bỏ được ảnh'); } }

boot();
