# Cloudflare Worker riêng (KHÔNG phải Pages Functions) — chạy nền định kỳ để kiểm tra
# lời nhắc tới giờ và đẩy Web Push tới các máy đã bật thông báo. Deploy tách biệt với app chính:
#   cd push-worker && wrangler deploy
name = "cungnhau-push-cron"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = ["* * * * *"]  # mỗi 1 phút — giảm trễ thông báo (Cloudflare cron là best-effort, có thể lệch 1-2 phút)

