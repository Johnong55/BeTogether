# Cloudflare Worker riêng (KHÔNG phải Pages Functions) — chạy nền định kỳ để kiểm tra
# lời nhắc tới giờ và đẩy Web Push tới các máy đã bật thông báo. Deploy tách biệt với app chính:
#   cd push-worker && wrangler deploy
name = "cungnhau-push-cron"
main = "src/index.js"
compatibility_date = "2024-11-01"

[triggers]
crons = []  # ĐÃ TẮT — chuyển sang push service chạy trên VPS (xem vps-push/). Cron Cloudflare cũ ký bằng khoá VAPID cũ nên phải tắt để không "nuốt" lời nhắc (set notified_at mà không gửi được).

