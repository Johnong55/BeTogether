<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cùng nhau · Quản trị</title>
<meta name="theme-color" content="#d97a92" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --p1:#d97a92; --p2:#e7a3b4; --accent:#c79a72; --ok:#6cab8e; --no:#e08a93; --warn:#d99a4e;
    --bg1:#fbf6f4; --bg2:#f6ebe9; --card:#fffdfc; --ink:#473a40; --soft:#9c8a90;
    --line:#efe1de; --chip:#f6ece9; --side:#fffaf8;
    --shadow:0 14px 34px rgba(160,110,120,.14); --shadow-sm:0 6px 16px rgba(160,110,120,.08);
    --edge:#4a3d43;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{ font-family:'Nunito',sans-serif; color:var(--ink); background:var(--bg1); min-height:100vh; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em; margin:0; }
  a{ color:var(--p1); }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:#e6d3d0; border-radius:8px; border:2px solid var(--bg1); }

  .btn{ font-family:'Nunito'; font-weight:800; border:1.5px solid var(--line); background:var(--card);
    color:var(--ink); border-radius:11px; padding:9px 14px; cursor:pointer; font-size:14px;
    transition:background .12s, transform .06s, box-shadow .12s; display:inline-flex; align-items:center; gap:6px; }
  .btn:hover{ box-shadow:var(--shadow-sm); }
  .btn:active{ transform:translateY(1px); }
  .btn.pri{ background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; border-color:transparent; }
  .btn.danger{ background:#fff; color:#c0485a; border-color:#f0c9d0; }
  .btn.danger:hover{ background:#fdeef0; }
  .btn.sm{ padding:6px 10px; font-size:13px; border-radius:9px; }
  .btn.ghost{ background:transparent; border-color:transparent; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }

  input, select, textarea{ font-family:'Nunito'; font-weight:600; font-size:14.5px; color:var(--ink);
    border:1.5px solid var(--line); background:var(--card); border-radius:10px; padding:10px 12px; width:100%; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--p2); box-shadow:0 0 0 3px rgba(231,163,180,.18); }
  textarea{ resize:vertical; min-height:80px; line-height:1.5; }
  label.f{ display:block; font-weight:800; font-size:12.5px; margin:12px 0 5px; color:var(--soft); }

  .card{ background:var(--card); border:1.5px solid var(--line); border-radius:16px; box-shadow:var(--shadow-sm); padding:18px; }
  .muted{ color:var(--soft); }
  .mini{ font-size:13px; }
  .pill{ display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-weight:800; font-size:12px; background:var(--chip); color:var(--ink); }
  .pill.ok{ background:#e4f3ec; color:#2f7f5f; } .pill.no{ background:#fbeaec; color:#b23b4b; }
  .pill.warn{ background:#fbf0dd; color:#9a6a1e; } .pill.info{ background:#e7eefb; color:#3a5a9a; }
  .empty{ text-align:center; color:var(--soft); font-weight:700; padding:34px 10px; }

  /* ===== Layout: sidebar + main ===== */
  .shell{ display:grid; grid-template-columns:248px 1fr; min-height:100vh; }
  .side{ background:var(--side); border-right:1.5px solid var(--line); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh; z-index:40; }
  .side .brand{ display:flex; align-items:center; gap:11px; padding:20px 20px 16px; }
  .side .brand .dot{ width:40px; height:40px; border-radius:13px; background:linear-gradient(135deg,var(--p1),var(--p2)); display:grid; place-items:center; color:#fff; font-size:20px; box-shadow:var(--shadow-sm); }
  .side .brand h1{ font-size:19px; line-height:1; } .side .brand small{ display:block; color:var(--soft); font-weight:800; font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-top:3px; }
  .nav{ padding:6px 12px; display:flex; flex-direction:column; gap:3px; overflow-y:auto; flex:1; }
  .nav .item{ display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:12px; cursor:pointer; font-weight:800; font-size:14.5px; color:var(--ink); border:none; background:none; width:100%; text-align:left; }
  .nav .item .ic{ font-size:18px; width:22px; text-align:center; }
  .nav .item:hover{ background:var(--chip); }
  .nav .item.on{ background:linear-gradient(135deg,var(--p1),var(--p2)); color:#fff; box-shadow:var(--shadow-sm); }
  .nav .navlabel{ font-size:11px; font-weight:800; color:var(--soft); text-transform:uppercase; letter-spacing:.06em; padding:14px 14px 5px; }
  .side .foot{ border-top:1.5px solid var(--line); padding:13px 16px; display:flex; align-items:center; gap:9px; }
  .side .foot .who{ font-weight:800; font-size:13px; line-height:1.2; } .side .foot .who small{ color:var(--soft); display:block; font-size:11px; }

  .main{ min-width:0; display:flex; flex-direction:column; }
  .topbar{ position:sticky; top:0; z-index:20; background:rgba(251,246,244,.86); backdrop-filter:blur(8px);
    border-bottom:1.5px solid var(--line); padding:14px 24px; display:flex; align-items:center; gap:12px; }
  .topbar .burger{ display:none; }
  .topbar h2{ font-size:21px; } .topbar .sub{ color:var(--soft); font-weight:700; font-size:12.5px; margin-top:1px; }
  .topbar .spacer{ flex:1; }
  .content{ padding:24px; max-width:1180px; width:100%; }

  /* ===== Stats ===== */
  .sech{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--ink); margin:4px 2px 12px; display:flex; align-items:center; gap:8px; }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:13px; margin-bottom:22px; }
  .stat{ background:var(--card); border:1.5px solid var(--line); border-radius:15px; padding:15px 16px; box-shadow:var(--shadow-sm); position:relative; overflow:hidden; }
  .stat .ic{ position:absolute; right:12px; top:11px; font-size:20px; opacity:.5; }
  .stat .n{ font-family:'Fraunces',serif; font-size:29px; font-weight:600; line-height:1; }
  .stat .l{ color:var(--soft); font-weight:800; font-size:12px; margin-top:7px; }
  .stat.accent{ background:linear-gradient(135deg,#fff, #fdf1f3); border-color:#f3d9df; } .stat.accent .n{ color:var(--p1); }

  /* ===== Table ===== */
  .toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar .search{ flex:1; min-width:200px; max-width:420px; }
  .tbl-wrap{ overflow-x:auto; border:1.5px solid var(--line); border-radius:15px; box-shadow:var(--shadow-sm); background:var(--card); }
  table{ border-collapse:collapse; width:100%; font-size:14px; min-width:560px; }
  th,td{ text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th{ font-weight:800; color:var(--soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; background:#fdf8f6; position:sticky; top:0; }
  tr:last-child td{ border-bottom:none; }
  tr.rowlink{ cursor:pointer; } tr.rowlink:hover{ background:var(--chip); }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }

  /* ===== Modal ===== */
  .overlay{ position:fixed; inset:0; background:rgba(60,40,45,.44); backdrop-filter:blur(3px); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:26px 14px; overflow:auto; }
  .modal{ background:var(--bg1); border:1.5px solid var(--line); border-radius:20px; box-shadow:0 30px 70px rgba(90,50,60,.3); width:100%; max-width:660px; padding:22px; }
  .modal h2{ font-size:21px; } .modal .sub{ color:var(--soft); font-weight:700; font-size:13px; margin:2px 0 14px; }
  .modal .x{ float:right; cursor:pointer; font-size:24px; color:var(--soft); line-height:1; border:none; background:none; }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:5px 16px; font-size:14px; margin:8px 0; }
  .kv .k{ color:var(--soft); font-weight:800; }
  .sec-title{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; margin:18px 0 9px; display:flex; align-items:center; gap:8px; }
  .sec-title .badge{ background:var(--chip); border-radius:999px; padding:1px 9px; font-size:12px; font-family:'Nunito'; font-weight:800; color:var(--soft); }
  .wordrow{ display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .wordrow:last-child{ border-bottom:none; }
  .wordrow .w-front{ font-weight:800; min-width:120px; } .wordrow .w-back{ flex:1; color:#5b4c52; }

  /* ===== Login ===== */
  .login{ min-height:100vh; display:grid; place-items:center; padding:20px; }
  .login .card{ width:100%; max-width:390px; padding:26px; }
  .login .lbrand{ display:flex; align-items:center; gap:11px; margin-bottom:14px; }
  .login .lbrand .dot{ width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg,var(--p1),var(--p2)); display:grid; place-items:center; color:#fff; font-size:21px; }
  .login h2{ font-size:22px; } .login .sub{ color:var(--soft); font-weight:700; font-size:13px; margin-bottom:6px; }

  .toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--edge); color:#fff;
    font-weight:800; padding:11px 18px; border-radius:12px; z-index:99; box-shadow:var(--shadow); opacity:0;
    transition:opacity .2s, transform .2s; pointer-events:none; font-size:14px; max-width:90vw; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }
  .note{ font-size:12px; color:var(--soft); font-weight:700; margin-top:8px; }
  .warnbox{ background:#fbf0dd; border:1.5px solid #ecd39a; color:#8a5e14; border-radius:12px; padding:12px 14px; font-weight:700; font-size:13px; margin:10px 0; }
  .infobox{ background:#eef3fc; border:1.5px solid #cdddf5; color:#3a5a9a; border-radius:12px; padding:12px 14px; font-weight:700; font-size:13px; }

  .ing-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .drop{ border:2px dashed var(--line); border-radius:14px; padding:26px 16px; text-align:center; color:var(--soft); font-weight:800; background:#fdf8f6; }

  .scrim{ display:none; }
  @media(max-width:860px){
    .shell{ grid-template-columns:1fr; }
    .side{ position:fixed; left:0; top:0; width:260px; transform:translateX(-102%); transition:transform .22s cubic-bezier(.22,1,.36,1); box-shadow:0 0 60px rgba(60,40,45,.25); }
    body.nav-open .side{ transform:translateX(0); }
    body.nav-open .scrim{ display:block; position:fixed; inset:0; background:rgba(60,40,45,.4); z-index:39; }
    .topbar .burger{ display:inline-flex; }
    .content{ padding:18px 16px; }
    .topbar{ padding:12px 16px; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  /* ====== Cấu hình Supabase (khớp index.html) ====== */
  const SUPABASE_URL = "https://vklsqexomaconbzoufmu.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_YDj6liDtYbMFq38GhwCwIQ_KlS-lNwI";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const hashPass = (s)=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'h'+h.toString(36); };
  const genId = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  const $ = (s,r=document)=>r.querySelector(s);
  const esc = (s)=> (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtDate = (s)=>{ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString('vi-VN'); };
  const fmtDateTime = (s)=>{ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
  const todayISO = ()=> new Date().toISOString().slice(0,10);
  const daysAgo = (n)=>{ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); };
  let toastT=null;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

  /* ====== Trạng thái ====== */
  const A = { admin:null, role:null, tab:'overview', data:null, q:'', admins:[], lib:null, navOpen:false };
  const SESSION_KEY = 'cungnhau_admin_session';

  /* ====== Vai trò & phân quyền ====== */
  const ROLES = ['owner','manager','viewer'];
  const ROLE_LABEL = { owner:'Chủ hệ thống', manager:'Quản lý', viewer:'Chỉ xem' };
  const ROLE_DESC  = { owner:'Toàn quyền + quản lý quản trị viên', manager:'Sửa/xóa người dùng, phòng, thư viện', viewer:'Chỉ được xem, không sửa/xóa' };
  const roleOf = (a)=> (a && a.role) || 'owner';
  function canEdit(){ return A.role==='owner' || A.role==='manager'; }
  function canManageAdmins(){ return A.role==='owner'; }
  function requireEdit(){ if(!canEdit()){ toast('Tài khoản này chỉ có quyền xem'); return false; } return true; }
  function requireOwner(){ if(!canManageAdmins()){ toast('Chỉ Chủ hệ thống mới làm được'); return false; } return true; }

  const NAV = [
    {id:'overview', ic:'📊', label:'Tổng quan'},
    {id:'users',    ic:'👥', label:'Người dùng'},
    {id:'spaces',   ic:'💞', label:'Phòng'},
    {sep:'Tri thức'},
    {id:'library',  ic:'📚', label:'Thư viện chung'},
    {id:'ingest',   ic:'🧲', label:'Nguồn tri thức'},
    {sep:'Hệ thống'},
    {id:'admins',   ic:'🛡️', label:'Quản trị viên', owner:true},
  ];
  const pageTitle = (id)=> (NAV.find(n=>n.id===id)||{}).label || 'Quản trị';
  const pageSub = { overview:'Bức tranh toàn hệ thống', users:'Tất cả tài khoản người dùng', spaces:'Các phòng cặp đôi & nội dung',
    library:'Chủ đề & bộ từ dùng chung cho mọi cặp đôi', ingest:'Nhập tri thức từ nguồn ngoài (crawl / OCR PDF)', admins:'Tài khoản quản trị & phân quyền' };

  /* ====== Xác thực ====== */
  async function listAdmins(){ const {data,error}=await sb.from('admins').select('username,role,created_at'); if(error) throw error; return data||[]; }
  async function getAdmin(u){ const {data,error}=await sb.from('admins').select('*').eq('username',u).maybeSingle(); if(error) throw error; return data; }
  async function createAdmin(o){ const {error}=await sb.from('admins').insert(o); if(error) throw error; }
  async function updateAdmin(u,patch){ const {error}=await sb.from('admins').update(patch).eq('username',u); if(error) throw error; }
  async function deleteAdmin(u){ const {error}=await sb.from('admins').delete().eq('username',u); if(error) throw error; }
  function saveSession(u){ try{ sessionStorage.setItem(SESSION_KEY, u); }catch(e){} }
  function loadSession(){ try{ return sessionStorage.getItem(SESSION_KEY); }catch(e){ return null; } }
  function clearSession(){ try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} }

  /* ====== Tải dữ liệu ====== */
  async function loadAll(){
    const light='id,name,person_a,person_b,person_a_username,person_b_username,theme,start_date,streak,longest,last_active,created_at';
    const [users,spaces,decks,cards,quizzes,notes,duels,daily,invites,pushes] = await Promise.all([
      sb.from('users').select('*').order('created_at',{ascending:false}),
      sb.from('spaces').select(light).order('created_at',{ascending:false}),
      sb.from('decks').select('id,space_id,name,created_at'),
      sb.from('cards').select('id,space_id,deck_id'),
      sb.from('quizzes').select('id,space_id,from_person,to_person,title,status,score,total,created_at'),
      sb.from('notes').select('id,space_id,author_name,text,remind_at,done,created_at'),
      sb.from('duels').select('id,space_id,challenger,status,stake,title,score_a,score_b,created_at'),
      sb.from('daily').select('id,space_id,day,question,answer_a,answer_b'),
      sb.from('invites').select('*'),
      sb.from('push_subscriptions').select('id,space_id,person'),
    ]);
    for(const r of [users,spaces,decks,cards,quizzes,notes,duels,daily,invites,pushes]) if(r.error) throw r.error;
    return { users:users.data||[], spaces:spaces.data||[], decks:decks.data||[], cards:cards.data||[],
      quizzes:quizzes.data||[], notes:notes.data||[], duels:duels.data||[], daily:daily.data||[],
      invites:invites.data||[], pushes:pushes.data||[] };
  }
  async function refresh(){ A.data = await loadAll(); }
  async function loadLibrary(){
    try{
      const [t,w]=await Promise.all([
        sb.from('library_topics').select('*').order('created_at',{ascending:false}),
        sb.from('library_words').select('id,topic_id,front,back,example,pos'),
      ]);
      if(t.error) throw t.error; if(w.error) throw w.error;
      A.lib={ ok:true, topics:t.data||[], words:w.data||[] };
    }catch(e){ A.lib={ ok:false, topics:[], words:[], err:e.message }; }
  }
  async function loadAdminsList(){ try{ A.admins=await listAdmins(); }catch(e){ A.admins=[]; } }

  const bySpace = (arr,sid)=> arr.filter(x=>x.space_id===sid);
  const wordsOf = (tid)=> (A.lib?A.lib.words:[]).filter(w=>w.topic_id===tid);
  function spaceMembers(sp){ return { a:sp.person_a||sp.person_a_username||'?', b:sp.person_b||sp.person_b_username||'?' }; }
  function isActive(sp,days=7){ return sp.last_active && sp.last_active >= daysAgo(days); }

  /* ====== RENDER ====== */
  function render(){
    const app=$('#app');
    if(!A.admin){ app.innerHTML = viewLogin(); document.body.classList.remove('nav-open'); return; }
    const navHTML = NAV.filter(n=>!n.owner||canManageAdmins()).map(n=>{
      if(n.sep) return `<div class="navlabel">${esc(n.sep)}</div>`;
      return `<button class="item ${A.tab===n.id?'on':''}" data-act="nav" data-id="${n.id}"><span class="ic">${n.ic}</span>${esc(n.label)}</button>`;
    }).join('');
    app.innerHTML = `
      <div class="shell">
        <aside class="side">
          <div class="brand"><div class="dot">♥</div><div><h1>cùng nhau</h1><small>Quản trị hệ thống</small></div></div>
          <nav class="nav">${navHTML}</nav>
          <div class="foot">
            <div class="dot" style="width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;color:#fff;font-weight:800">${esc((A.admin||'?').charAt(0).toUpperCase())}</div>
            <div class="who">${esc(A.admin)}<small>${ROLE_LABEL[A.role]||A.role||''}</small></div>
          </div>
        </aside>
        <div class="main">
          <div class="topbar">
            <button class="btn ghost sm burger" data-act="toggle-nav" aria-label="menu">☰</button>
            <div><h2>${esc(pageTitle(A.tab))}</h2><div class="sub">${esc(pageSub[A.tab]||'')}</div></div>
            <div class="spacer"></div>
            <button class="btn sm ghost" data-act="reload" title="Tải lại">↻</button>
            <button class="btn sm" data-act="logout">Đăng xuất</button>
          </div>
          <div class="content" id="page">${tabBody()}</div>
        </div>
        <div class="scrim" data-act="toggle-nav"></div>
      </div>`;
    document.body.classList.toggle('nav-open', A.navOpen);
  }
  function tabBody(){
    if(A.tab==='library') return viewLibrary();
    if(A.tab==='ingest')  return viewIngest();
    if(A.tab==='admins')  return canManageAdmins()? viewAdmins() : viewOverview();
    if(!A.data) return `<div class="empty">Đang tải dữ liệu…</div>`;
    if(A.tab==='overview') return viewOverview();
    if(A.tab==='users') return viewUsers();
    if(A.tab==='spaces') return viewSpaces();
    return '';
  }

  /* ---- Login / Setup ---- */
  let noAdminYet=false;
  function viewLogin(){
    const brand=`<div class="lbrand"><div class="dot">♥</div><div><h2 style="font-size:20px">cùng nhau</h2><div class="sub" style="margin:0">Quản trị hệ thống</div></div></div>`;
    if(noAdminYet){
      return `<div class="login"><div class="card">${brand}
        <h2>Thiết lập lần đầu 🔐</h2>
        <div class="sub">Chưa có tài khoản quản trị. Tạo tài khoản Chủ hệ thống đầu tiên.</div>

      <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
        ${canEdit()?`<button class="btn danger" data-act="del-space" data-id="${esc(sp.id)}">🗑️ Xóa phòng (kèm nội dung)</button>`:''}
        <div class="spacer"></div><button class="btn ghost" data-act="close-modal">Đóng</button></div>`;
    $('#modal').innerHTML=`<div class="overlay" data-act="overlay"><div class="modal" data-act="stop">${body}</div></div>`;
  }

  /* ====== Modal: chủ đề thư viện ====== */
  function openNewTopicModal(){
    if(!requireEdit()) return;
    $('#modal').innerHTML=`<div class="overlay" data-act="overlay"><div class="modal" data-act="stop">
      <button class="x" data-act="close-modal">×</button>
      <h2>Thêm chủ đề thư viện</h2><div class="sub">Đưa vào thư viện dùng chung toàn hệ thống</div>
      <label class="f">Tên chủ đề</label><input id="t_title" placeholder="vd: Từ vựng chủ đề Du lịch" />
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:150px"><label class="f">Loại</label><select id="t_kind">${Object.keys(KIND_LABEL).map(k=>`<option value="${k}">${KIND_LABEL[k]}</option>`).join('')}</select></div>
        <div style="flex:1;min-width:150px"><label class="f">Trạng thái</label><select id="t_status"><option value="published">Đang phát (mọi người thấy)</option><option value="draft">Nháp (chỉ admin)</option></select></div>
      </div>
      <label class="f">Nguồn (tuỳ chọn)</label><input id="t_source" placeholder="thủ công / link / tên PDF…" value="thủ công" />
      <label class="f">Dán từ hàng loạt (tuỳ chọn) — mỗi dòng: <b>từ = nghĩa</b> (có thể thêm = ví dụ)</label>
      <textarea id="t_bulk" placeholder="apple = quả táo\nnegotiate = đàm phán = We negotiated a deal."></textarea>
      <div style="display:flex;gap:10px;margin-top:16px"><div class="spacer"></div>
        <button class="btn ghost" data-act="close-modal">Huỷ</button>
        <button class="btn pri" data-act="create-topic">Tạo chủ đề</button></div>
    </div></div>`;
  }
  function parseBulk(text){
    return (text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const parts=l.split('=').map(s=>s.trim());
      return { front:parts[0]||'', back:parts[1]||'', example:parts[2]||'' };
    }).filter(x=>x.front);
  }
  function openTopicModal(tid){
    const t=A.lib.topics.find(x=>x.id===tid); if(!t) return;
    const words=wordsOf(tid).slice().sort((a,b)=>(a.pos||0)-(b.pos||0));
    const wlist=words.map(w=>`<div class="wordrow">
        <span class="w-front">${esc(w.front)}</span><span class="w-back">${esc(w.back||'')}${w.example?` <span class="muted mini">· ${esc(w.example)}</span>`:''}</span>
        ${canEdit()?`<button class="btn sm danger" data-act="del-word" data-id="${esc(w.id)}" data-topic="${esc(tid)}">×</button>`:''}</div>`).join('');
    const body=`<button class="x" data-act="close-modal">×</button>
      <h2>${esc(t.title||'(chưa đặt tên)')}</h2>
      <div class="sub">${KIND_LABEL[t.kind]||t.kind} · ${words.length} từ · ${t.status==='published'?'đang phát':'nháp'}${t.source?' · nguồn: '+esc(t.source):''}</div>
      ${canEdit()?`<div class="card" style="background:var(--bg2);margin:8px 0 14px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:2;min-width:140px"><label class="f">Tên</label><input id="et_title" value="${esc(t.title||'')}" /></div>
          <div style="flex:1;min-width:120px"><label class="f">Loại</label><select id="et_kind">${Object.keys(KIND_LABEL).map(k=>`<option value="${k}" ${t.kind===k?'selected':''}>${KIND_LABEL[k]}</option>`).join('')}</select></div>
          <div style="flex:1;min-width:130px"><label class="f">Trạng thái</label><select id="et_status"><option value="published" ${t.status==='published'?'selected':''}>Đang phát</option><option value="draft" ${t.status!=='published'?'selected':''}>Nháp</option></select></div>
          <button class="btn pri sm" data-act="save-topic" data-id="${esc(tid)}">Lưu</button>
        </div></div>`:''}
      <div class="sec-title">🔤 Danh sách từ <span class="badge">${words.length}</span></div>
      <div style="max-height:min(46vh,420px);overflow:auto;border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;background:var(--card)">
        ${wlist||'<div class="muted mini" style="padding:14px 2px">Chưa có từ nào.</div>'}
      </div>
      ${canEdit()?`<div class="card" style="margin-top:14px">
        <div class="sec-title" style="margin-top:0">➕ Thêm từ</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:110px"><label class="f">Từ / cụm</label><input id="w_front" placeholder="apple" /></div>
          <div style="flex:1;min-width:110px"><label class="f">Nghĩa</label><input id="w_back" placeholder="quả táo" /></div>
          <div style="flex:1.4;min-width:130px"><label class="f">Ví dụ (tuỳ chọn)</label><input id="w_ex" placeholder="I ate an apple." /></div>
          <button class="btn pri sm" data-act="add-word" data-id="${esc(tid)}">Thêm</button>
        </div>
        <label class="f">Hoặc dán hàng loạt (mỗi dòng: từ = nghĩa = ví dụ)</label>
        <textarea id="w_bulk" placeholder="grape = quả nho\ncontract = hợp đồng"></textarea>
        <button class="btn sm" style="margin-top:8px" data-act="bulk-word" data-id="${esc(tid)}">Thêm hàng loạt</button>
      </div>`:''}
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
        ${canEdit()?`<button class="btn danger" data-act="del-topic" data-id="${esc(tid)}">🗑️ Xóa chủ đề</button>`:''}
        <div class="spacer"></div><button class="btn ghost" data-act="close-modal">Đóng</button></div>`;
    $('#modal').innerHTML=`<div class="overlay" data-act="overlay"><div class="modal" data-act="stop">${body}</div></div>`;
  }
  function closeModal(){ $('#modal').innerHTML=''; }

  /* ====== HÀNH ĐỘNG: auth ====== */
  async function doLogin(){
    const u=$('#au').value.trim(), p=$('#ap').value;
    if(!u||!p){ toast('Nhập đủ tên và mật khẩu'); return; }
    let adm; try{ adm=await getAdmin(u); }catch(e){ toast('Lỗi kết nối: '+e.message); return; }
    if(!adm||adm.passcode!==hashPass(p)){ const n=$('#loginnote'); if(n)n.textContent='Sai tên đăng nhập hoặc mật khẩu.'; return; }
    A.admin=u; A.role=roleOf(adm); saveSession(u); await enterApp();
  }
  async function doSetup(){
    const u=$('#au').value.trim(), p=$('#ap').value, p2=$('#ap2').value;
    if(!u||!p){ toast('Nhập đủ tên và mật khẩu'); return; }
    if(p!==p2){ toast('Hai mật khẩu chưa khớp'); return; }
    if(p.length<4){ toast('Mật khẩu tối thiểu 4 ký tự'); return; }
    try{ await createAdmin({ username:u, passcode:hashPass(p), role:'owner', created_at:new Date().toISOString() }); }
    catch(e){ toast('Không tạo được: '+e.message); return; }
    noAdminYet=false; A.admin=u; A.role='owner'; saveSession(u); toast('Đã tạo tài khoản quản trị 🎉'); await enterApp();
  }
  async function enterApp(){
    A.navOpen=false; render();
    try{ await refresh(); }catch(e){ toast('Lỗi tải dữ liệu: '+e.message); }
    await loadLibrary();
    if(canManageAdmins()) await loadAdminsList();
    render();
  }

  /* ====== HÀNH ĐỘNG: người dùng ====== */
  async function resetPin(username){ if(!requireEdit()) return;
    const pin=prompt('Đặt PIN/mật khẩu MỚI cho "'+username+'":'); if(pin==null) return; if(!pin.trim()){ toast('PIN trống'); return; }
    try{ const {error}=await sb.from('users').update({passcode:hashPass(pin.trim())}).eq('username',username); if(error) throw error; toast('Đã đặt lại PIN cho '+username); }
    catch(e){ toast('Lỗi: '+e.message); } }
  async function unpairUser(username){ if(!requireEdit()) return;
    const u=A.data.users.find(x=>x.username===username); if(!u) return;
    if(!confirm('Gỡ ghép đôi cho "'+username+'"? Rời khỏi phòng '+(u.space_id||'')+'. (Không xóa dữ liệu phòng.)')) return;
    try{ const {error}=await sb.from('users').update({space_id:null,person:null}).eq('username',username); if(error) throw error;
      if(u.space_id){ const sp=A.data.spaces.find(s=>s.id===u.space_id); if(sp){ const patch={};
        if(sp.person_a_username===username) patch.person_a_username=null; if(sp.person_b_username===username) patch.person_b_username=null;
        if(Object.keys(patch).length) await sb.from('spaces').update(patch).eq('id',u.space_id); } }
      toast('Đã gỡ ghép '+username); await refresh(); render();
    }catch(e){ toast('Lỗi: '+e.message); } }
  async function delUser(username){ if(!requireEdit()) return;
    if(!confirm('XÓA hẳn tài khoản "'+username+'"? Không hoàn tác. Dữ liệu phòng KHÔNG bị xóa.')) return;
    try{ const {error}=await sb.from('users').delete().eq('username',username); if(error) throw error;
      const u=A.data.users.find(x=>x.username===username);
      if(u&&u.space_id){ const sp=A.data.spaces.find(s=>s.id===u.space_id); if(sp){ const patch={};
        if(sp.person_a_username===username) patch.person_a_username=null; if(sp.person_b_username===username) patch.person_b_username=null;
        if(Object.keys(patch).length) await sb.from('spaces').update(patch).eq('id',u.space_id); } }
      toast('Đã xóa tài khoản '+username); await refresh(); render();
    }catch(e){ toast('Lỗi: '+e.message); } }

  /* ====== HÀNH ĐỘNG: phòng ====== */
  async function saveSpace(sid){ if(!requireEdit()) return;
    const patch={ name:$('#e_name').value.trim()||null, start_date:$('#e_start').value||null, streak:parseInt($('#e_streak').value,10)||0, theme:$('#e_theme').value };
    try{ const {error}=await sb.from('spaces').update(patch).eq('id',sid); if(error) throw error;
      toast('Đã lưu phòng'); await refresh(); openSpaceModal(sid); render(); }
    catch(e){ toast('Lỗi: '+e.message); } }
  async function delSpace(sid){ if(!requireEdit()) return;
    const sp=A.data.spaces.find(s=>s.id===sid);
    if(!confirm('XÓA phòng "'+(sp?.name||sid)+'" (mã '+sid+')?\nSẽ xóa toàn bộ nội dung phòng. Hai thành viên bị gỡ khỏi phòng. Không hoàn tác.')) return;
    try{ const members=A.data.users.filter(u=>u.space_id===sid);
      for(const u of members) await sb.from('users').update({space_id:null,person:null}).eq('username',u.username);
      await sb.from('invites').delete().eq('space_id',sid);
      const {error}=await sb.from('spaces').delete().eq('id',sid); if(error) throw error;
      toast('Đã xóa phòng '+sid); closeModal(); await refresh(); render();
    }catch(e){ toast('Lỗi: '+e.message); } }

  /* ====== HÀNH ĐỘNG: thư viện ====== */
  async function createTopic(){ if(!requireEdit()) return;
    const title=$('#t_title').value.trim(); if(!title){ toast('Nhập tên chủ đề'); return; }
    const kind=$('#t_kind').value, status=$('#t_status').value, source=$('#t_source').value.trim()||null;
    const id=genId();
    try{ let e1=(await sb.from('library_topics').insert({ id, title, kind, status, source, created_by:A.admin, created_at:new Date().toISOString() })).error; if(e1) throw e1;
      const bulk=parseBulk($('#t_bulk').value);
      if(bulk.length){ const rows=bulk.map((w,i)=>({ id:genId(), topic_id:id, front:w.front, back:w.back, example:w.example||null, pos:i })); const e2=(await sb.from('library_words').insert(rows)).error; if(e2) throw e2; }
      toast('Đã tạo chủ đề “'+title+'”'+(bulk.length?` (+${bulk.length} từ)`:'')); closeModal(); await loadLibrary(); A.tab='library'; render();
    }catch(e){ toast('Lỗi: '+e.message); } }
  async function saveTopic(tid){ if(!requireEdit()) return;
    const patch={ title:$('#et_title').value.trim()||null, kind:$('#et_kind').value, status:$('#et_status').value };
    try{ const {error}=await sb.from('library_topics').update(patch).eq('id',tid); if(error) throw error;
      toast('Đã lưu chủ đề'); await loadLibrary(); openTopicModal(tid); render(); }
    catch(e){ toast('Lỗi: '+e.message); } }
  async function delTopic(tid){ if(!requireEdit()) return;
    const t=A.lib.topics.find(x=>x.id===tid);
    if(!confirm('Xóa chủ đề "'+(t?.title||tid)+'" và toàn bộ từ trong đó? Không hoàn tác.')) return;
    try{ const {error}=await sb.from('library_topics').delete().eq('id',tid); if(error) throw error;
      toast('Đã xóa chủ đề'); closeModal(); await loadLibrary(); render(); }
    catch(e){ toast('Lỗi: '+e.message); } }
  async function addWord(tid){ if(!requireEdit()) return;
    const front=$('#w_front').value.trim(); if(!front){ toast('Nhập từ'); return; }
    const back=$('#w_back').value.trim(), example=$('#w_ex').value.trim()||null;
    const pos=wordsOf(tid).length;
    try{ const {error}=await sb.from('library_words').insert({ id:genId(), topic_id:tid, front, back, example, pos, created_at:new Date().toISOString() }); if(error) throw error;
      await loadLibrary(); openTopicModal(tid); render(); }
    catch(e){ toast('Lỗi: '+e.message); } }
  async function bulkWord(tid){ if(!requireEdit()) return;
    const bulk=parseBulk($('#w_bulk').value); if(!bulk.length){ toast('Chưa có dòng hợp lệ'); return; }
    const base=wordsOf(tid).length;
    const rows=bulk.map((w,i)=>({ id:genId(), topic_id:tid, front:w.front, back:w.back, example:w.example||null, pos:base+i, created_at:new Date().toISOString() }));
    try{ const {error}=await sb.from('library_words').insert(rows); if(error) throw error;
      toast('Đã thêm '+rows.length+' từ'); await loadLibrary(); openTopicModal(tid); render(); }
    catch(e){ toast('Lỗi: '+e.message); } }
  async function delWord(wid,tid){ if(!requireEdit()) return;
    try{ const {error}=await sb.from('library_words').delete().eq('id',wid); if(error) throw error;
      await loadLibrary(); openTopicModal(tid); render(); }
    catch(e){ toast('Lỗi: '+e.message); } }

  /* ====== HÀNH ĐỘNG: quản trị viên ====== */
  async function addAdmin(){ if(!requireOwner()) return;
    const u=$('#na_user').value.trim(), p=$('#na_pass').value, role=$('#na_role').value;
    if(!u||!p){ toast('Nhập đủ tên và mật khẩu'); return; }
    if(p.length<4){ toast('Mật khẩu tối thiểu 4 ký tự'); return; }
    if(A.admins.some(a=>a.username===u)){ toast('Tên quản trị này đã tồn tại'); return; }
    try{ await createAdmin({ username:u, passcode:hashPass(p), role, created_at:new Date().toISOString() }); }
    catch(e){ toast('Không thêm được: '+e.message); return; }
    toast('Đã thêm quản trị viên '+u); await loadAdminsList(); render(); }
  async function delAdmin(username){ if(!requireOwner()) return;
    if(username===A.admin){ toast('Không thể tự xóa chính mình'); return; }
    const owners=A.admins.filter(a=>roleOf(a)==='owner'); const target=A.admins.find(a=>a.username===username);
    if(target&&roleOf(target)==='owner'&&owners.length<=1){ toast('Phải còn ít nhất 1 Chủ hệ thống'); return; }
    if(!confirm('Xóa quản trị viên "'+username+'"?')) return;
    try{ await deleteAdmin(username); }catch(e){ toast('Lỗi: '+e.message); return; }
    toast('Đã xóa '+username); await loadAdminsList(); render(); }
  async function changeAdminRole(username,role){ if(!requireOwner()) return; if(!ROLES.includes(role)) return;
    const target=A.admins.find(a=>a.username===username); if(!target) return;
    const owners=A.admins.filter(a=>roleOf(a)==='owner');
    if(roleOf(target)==='owner'&&role!=='owner'&&owners.length<=1){ toast('Phải còn ít nhất 1 Chủ hệ thống'); await loadAdminsList(); render(); return; }
    try{ await updateAdmin(username,{role}); }catch(e){ toast('Lỗi: '+e.message); return; }
    if(username===A.admin) A.role=role;
    toast('Đã đổi vai trò '+username+' → '+ROLE_LABEL[role]); await loadAdminsList(); render(); }

  /* ====== Event delegation ====== */
  document.addEventListener('click', async (e)=>{
    const el=e.target.closest('[data-act]'); if(!el) return;
    const act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
    switch(act){
      case 'stop': break;
      case 'overlay': case 'close-modal': closeModal(); break;
      case 'toggle-nav': A.navOpen=!A.navOpen; document.body.classList.toggle('nav-open',A.navOpen); break;
      case 'nav': A.tab=id; A.q=''; A.navOpen=false; render(); if(id==='library'&&(!A.lib)) { await loadLibrary(); render(); } break;
      case 'do-login': doLogin(); break;
      case 'do-setup': doSetup(); break;
      case 'logout': clearSession(); A.admin=null; A.data=null; A.lib=null; render(); break;
      case 'reload': toast('Đang tải lại…'); try{ await refresh(); await loadLibrary(); if(canManageAdmins()) await loadAdminsList(); }catch(err){ toast('Lỗi: '+err.message); } render(); break;
      case 'open-space': openSpaceModal(id); break;
      case 'reset-pin': resetPin(id); break;
      case 'unpair-user': unpairUser(id); break;
      case 'del-user': delUser(id); break;
      case 'save-space': saveSpace(id); break;
      case 'del-space': delSpace(id); break;
      case 'new-topic': openNewTopicModal(); break;
      case 'create-topic': createTopic(); break;
      case 'open-topic': openTopicModal(id); break;
      case 'save-topic': saveTopic(id); break;
      case 'del-topic': delTopic(id); break;
      case 'add-word': addWord(id); break;
      case 'bulk-word': bulkWord(id); break;
      case 'del-word': delWord(id, el.getAttribute('data-topic')); break;
      case 'add-admin': addAdmin(); break;
      case 'del-admin': delAdmin(id); break;
    }
  });
  document.addEventListener('change',(e)=>{ if(e.target.classList.contains('rolesel')) changeAdminRole(e.target.getAttribute('data-user'), e.target.value); });
  document.addEventListener('input',(e)=>{ if(e.target.matches('[data-act="search"]')){ A.q=e.target.value;
    const pg=$('#page'); if(pg) pg.innerHTML=tabBody();
    const inp=$('[data-act="search"]'); if(inp){ inp.focus(); const v=inp.value; inp.value=''; inp.value=v; } } });
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Enter'){ const a=document.activeElement; if(a&&(a.id==='au'||a.id==='ap'||a.id==='ap2')){ noAdminYet?doSetup():doLogin(); } }
    if(e.key==='Escape') closeModal();
  });

  /* ====== Khởi động ====== */
  (async function boot(){
    render();
    let admins=[];
    try{ admins=await listAdmins(); }
    catch(e){
      $('#app').innerHTML=`<div class="login"><div class="card">
        <h2>Cần thiết lập cơ sở dữ liệu</h2>
        <div class="warnbox">Chưa có bảng <b>admins</b> trong Supabase. Mở Supabase → SQL Editor → chạy <b>schema.sql</b> rồi tải lại.</div>
        <div class="note">Lỗi: ${esc(e.message)}</div>
        <button class="btn pri" style="width:100%;margin-top:12px;justify-content:center" onclick="location.reload()">Tải lại</button>
      </div></div>`;
      return;
    }
    noAdminYet=admins.length===0; A.admins=admins;
    const sess=loadSession(); const me=sess&&admins.find(a=>a.username===sess);
    if(me){ A.admin=me.username; A.role=roleOf(me); await enterApp(); return; }
    render();
  })();
  </script>
</body>
</html>
