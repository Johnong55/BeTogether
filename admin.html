<style>
  /* ===== Design tokens (Linear/Vercel — trung tính, tối giản) ===== */
  :root{
    --primary:#5b5bd6; --primary-hover:#4f4fce; --primary-fg:#ffffff; --primary-soft:#eeeefb;
    --bg:#fafafa; --panel:#ffffff; --panel-2:#fbfbfc; --side:#fbfbfa;
    --border:#e9e9ec; --border-strong:#dcdce0;
    --text:#18181b; --text-2:#5f5f6b; --text-3:#9a9aa5;
    --hover:#f4f4f6; --active:#eeeef2;
    --ok:#0f9d58; --ok-soft:#e6f4ea; --warn:#b7791f; --warn-soft:#fbf3e2; --err:#dc2626; --err-soft:#fbeaea; --info:#2563eb; --info-soft:#e7effd;
    --sk1:#eeeef1; --sk2:#f6f6f8;
    --shadow-sm:0 1px 2px rgba(24,24,27,.05), 0 1px 1px rgba(24,24,27,.03);
    --shadow-md:0 4px 14px rgba(24,24,27,.09);
    --shadow-lg:0 20px 50px rgba(24,24,27,.20);
    --r-btn:7px; --r-card:10px; --r-input:7px; --r-modal:14px;
    --side-w:236px; --side-w-collapsed:64px;
  }
  html[data-theme="dark"]{
    --primary:#7c7cf2; --primary-hover:#8a8af5; --primary-fg:#ffffff; --primary-soft:#20213a;
    --bg:#0d0d0f; --panel:#161618; --panel-2:#1a1a1d; --side:#111113;
    --border:#262629; --border-strong:#323236;
    --text:#ededf0; --text-2:#a1a1ac; --text-3:#6c6c76;
    --hover:#1d1d20; --active:#242428;
    --ok:#3ecf8e; --ok-soft:#122a20; --warn:#e5b567; --warn-soft:#2c2415; --err:#f87171; --err-soft:#2c1717; --info:#6aa0ff; --info-soft:#141d2e;
    --sk1:#1d1d20; --sk2:#232327;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 6px 18px rgba(0,0,0,.5); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ font-family:'Inter',system-ui,sans-serif; color:var(--text); background:var(--bg); min-height:100vh; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ margin:0; font-weight:700; letter-spacing:-.015em; }
  .panel, .side, .topbar, .stat, .tbl-wrap, .card, .modal, .btn, input, select, textarea{ transition:background-color .2s ease, border-color .2s ease, color .2s ease; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; border:3px solid var(--bg); }
  .muted{ color:var(--text-2); } .mini{ font-size:12.5px; } .spacer{ flex:1; }
  svg.i{ width:18px; height:18px; flex:none; }

  /* ===== Buttons ===== */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; font-family:inherit; font-weight:600; font-size:13.5px;
    border:1px solid var(--border-strong); background:var(--panel); color:var(--text); border-radius:var(--r-btn); padding:8px 13px; cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease, transform .12s ease, box-shadow .15s ease; }
  .btn:hover{ background:var(--hover); }
  .btn:active{ transform:scale(.975); }
  .btn:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  .btn.pri{ background:var(--primary); border-color:var(--primary); color:var(--primary-fg); }
  .btn.pri:hover{ background:var(--primary-hover); }
  .btn.danger{ color:var(--err); border-color:var(--border-strong); }
  .btn.danger:hover{ background:var(--err-soft); border-color:var(--err); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.ghost:hover{ background:var(--hover); }
  .btn.sm{ padding:6px 10px; font-size:12.5px; }
  .btn.icon{ padding:8px; }
  .btn.block{ width:100%; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; } .btn:disabled:active{ transform:none; }

  input,select,textarea{ width:100%; font-family:inherit; font-size:13.5px; color:var(--text); background:var(--panel);
    border:1px solid var(--border-strong); border-radius:var(--r-input); padding:9px 11px; outline:none; }
  input::placeholder,textarea::placeholder{ color:var(--text-3); }
  input:focus,select:focus,textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  textarea{ resize:vertical; min-height:76px; }
  label.f{ display:block; font-weight:600; font-size:12px; margin:12px 0 5px; color:var(--text-2); }

  .card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--shadow-sm); padding:16px; }
  .empty{ text-align:center; padding:44px 16px; color:var(--text-2); }
  .empty .ico{ width:44px; height:44px; margin:0 auto 12px; border-radius:12px; display:grid; place-items:center; background:var(--hover); color:var(--text-3); }
  .empty .ico svg{ width:22px; height:22px; }
  .empty h3{ font-size:15px; margin-bottom:4px; } .empty p{ margin:0 0 14px; font-size:13px; }

  .tag{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:6px; font-weight:600; font-size:11.5px; background:var(--hover); color:var(--text-2); border:1px solid var(--border); }
  .tag.ok{ background:var(--ok-soft); color:var(--ok); border-color:transparent; }
  .tag.no{ background:var(--err-soft); color:var(--err); border-color:transparent; }
  .tag.warn{ background:var(--warn-soft); color:var(--warn); border-color:transparent; }
  .tag.info{ background:var(--info-soft); color:var(--info); border-color:transparent; }

  /* ===== Layout ===== */
  .app{ display:grid; grid-template-columns:var(--side-w) 1fr; min-height:100vh; transition:grid-template-columns .24s cubic-bezier(.4,0,.2,1); }
  .app.collapsed{ grid-template-columns:var(--side-w-collapsed) 1fr; }
  .side{ background:var(--side); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40; overflow:hidden; }
  .side .brand{ display:flex; align-items:center; gap:10px; padding:16px 18px 14px; min-width:0; }
  .side .brand .logo{ width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center; color:#fff; background:var(--primary); box-shadow:var(--shadow-sm); }
  .side .brand .logo svg{ width:17px; height:17px; }
  .side .brand .bt{ min-width:0; } .side .brand h1{ font-size:15px; white-space:nowrap; } .side .brand small{ color:var(--text-3); font-size:11px; font-weight:600; white-space:nowrap; }
  .nav{ padding:6px 10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto; overflow-x:hidden; flex:1; }
  .nav .navlabel{ font-size:10.5px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; padding:14px 10px 5px; white-space:nowrap; }
  .nav .item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:7px; cursor:pointer; font-weight:500; font-size:13.5px; color:var(--text-2);
    border:none; background:none; width:100%; text-align:left; white-space:nowrap; transition:background-color .14s ease, color .14s ease; }
  .nav .item svg{ flex:none; }
  .nav .item .lbl{ transition:opacity .18s ease; }
  .nav .item:hover{ background:var(--hover); color:var(--text); }
  .nav .item.on{ background:var(--active); color:var(--text); font-weight:600; }
  .nav .item.on svg{ color:var(--primary); }
  .app.collapsed .nav .navlabel{ opacity:0; }
  .app.collapsed .nav .item .lbl{ opacity:0; }
  .app.collapsed .side .brand .bt{ opacity:0; }
  .side .foot{ border-top:1px solid var(--border); padding:11px 12px; display:flex; align-items:center; gap:9px; min-width:0; }
  .side .foot .av{ width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center; color:#fff; font-weight:700; font-size:12px; background:var(--primary); }
  .side .foot .who{ min-width:0; line-height:1.25; } .side .foot .who b{ font-size:13px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .side .foot .who small{ color:var(--text-3); font-size:11px; }
  .app.collapsed .side .foot .who{ opacity:0; }

  .main{ min-width:0; display:flex; flex-direction:column; }
  .topbar{ position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 78%, transparent); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); padding:11px 20px; display:flex; align-items:center; gap:12px; }
  .topbar .crumb{ font-weight:700; font-size:15px; letter-spacing:-.01em; }
  .topbar .crumb small{ display:block; font-weight:500; font-size:11.5px; color:var(--text-3); letter-spacing:0; }
  .topbar .tsearch{ position:relative; margin-left:6px; width:min(320px,34vw); }
  .topbar .tsearch svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-3); pointer-events:none; }
  .topbar .tsearch input{ padding-left:30px; height:34px; }
  .content{ padding:22px; max-width:1200px; width:100%; }

  .sech{ font-weight:700; font-size:13px; color:var(--text-2); margin:4px 2px 11px; text-transform:uppercase; letter-spacing:.04em; }
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:13px; margin-bottom:24px; }
  .stat{ background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); padding:15px 16px; box-shadow:var(--shadow-sm); }
  .stat .top{ display:flex; align-items:center; justify-content:space-between; color:var(--text-3); }
  .stat .top .ic{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:var(--hover); color:var(--text-2); }
  .stat .top .ic svg{ width:16px; height:16px; }
  .stat .n{ font-size:27px; font-weight:700; letter-spacing:-.02em; margin-top:10px; line-height:1; }
  .stat .l{ color:var(--text-2); font-weight:500; font-size:12.5px; margin-top:5px; }
  .stat .trend{ font-size:11.5px; font-weight:600; margin-top:6px; display:inline-flex; align-items:center; gap:3px; }
  .stat .trend.up{ color:var(--ok); } .stat .trend.flat{ color:var(--text-3); }

  .toolbar{ display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .count-badge{ color:var(--text-3); font-weight:600; font-size:12.5px; }
  .tbl-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-card); background:var(--panel); box-shadow:var(--shadow-sm); }
  table{ border-collapse:collapse; width:100%; font-size:13.5px; min-width:560px; }
  th,td{ text-align:left; padding:11px 15px; border-bottom:1px solid var(--border); vertical-align:middle; }
  thead th{ font-weight:600; color:var(--text-3); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; background:var(--panel-2); position:sticky; top:0; white-space:nowrap; }
  th.sortable{ cursor:pointer; user-select:none; } th.sortable:hover{ color:var(--text); }
  th .sarrow{ display:inline-flex; vertical-align:middle; margin-left:4px; opacity:.55; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr.rowlink{ cursor:pointer; } tbody tr:hover{ background:var(--hover); }
  .row-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .cbx{ width:16px; height:16px; accent-color:var(--primary); cursor:pointer; vertical-align:middle; }
  .rowin{ animation:rowin .32s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rowin{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .pager{ display:flex; align-items:center; gap:10px; justify-content:flex-end; padding:12px 4px 2px; color:var(--text-2); font-size:12.5px; font-weight:600; }

  .bulkbar{ position:sticky; bottom:14px; margin:14px 0 0; display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border-strong);
    box-shadow:var(--shadow-md); border-radius:10px; padding:10px 14px; animation:rowin .2s ease-out; }

  /* Skeleton */
  .sk{ background:linear-gradient(90deg,var(--sk1) 25%,var(--sk2) 37%,var(--sk1) 63%); background-size:400% 100%; animation:sk 1.3s ease infinite; border-radius:6px; }
  @keyframes sk{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
  .sk-row{ height:14px; }

  /* Chart */
  .chartcard{ background:var(--panel); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--shadow-sm); padding:16px 18px; margin-bottom:24px; }
  .chartcard .ch-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
  .chartcard .ch-title{ font-weight:600; font-size:13.5px; } .chartcard .ch-sub{ color:var(--text-3); font-size:12px; }
  .bars{ display:flex; align-items:flex-end; gap:6px; height:120px; padding-top:8px; }
  .bars .bar{ flex:1; background:var(--primary); border-radius:4px 4px 2px 2px; min-height:3px; transform:scaleY(0); transform-origin:bottom; opacity:.9; }
  .bars .bar.in{ transition:transform .5s cubic-bezier(.2,.7,.3,1); transform:scaleY(1); }
  .bars .bar:hover{ opacity:1; }
  .bars-x{ display:flex; gap:6px; margin-top:7px; } .bars-x span{ flex:1; text-align:center; font-size:10px; color:var(--text-3); }

  /* Modal */
  .overlay{ position:fixed; inset:0; background:rgba(15,15,20,.5); backdrop-filter:blur(2px); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:5vh 14px; overflow:auto; animation:ovin .18s ease-out; }
  @keyframes ovin{ from{opacity:0;} to{opacity:1;} }
  .modal{ background:var(--panel); border:1px solid var(--border); border-radius:var(--r-modal); box-shadow:var(--shadow-lg); width:100%; max-width:660px; padding:22px; animation:modin .26s cubic-bezier(.2,.7,.3,1); }
  @keyframes modin{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;} }
  .modal h2{ font-size:19px; } .modal .subh{ color:var(--text-3); font-size:12.5px; margin:3px 0 15px; }
  .modal .x{ float:right; cursor:pointer; border:none; background:none; color:var(--text-3); padding:4px; border-radius:6px; display:grid; place-items:center; }
  .modal .x:hover{ background:var(--hover); color:var(--text); }
  .kv{ display:grid; grid-template-columns:auto 1fr; gap:7px 16px; font-size:13.5px; margin:8px 0; }
  .kv .k{ color:var(--text-3); font-weight:600; }
  .sec-title{ font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-2); margin:18px 0 9px; display:flex; align-items:center; gap:8px; }
  .sec-title .badge{ background:var(--hover); color:var(--text-2); border-radius:20px; padding:1px 8px; font-size:11px; font-weight:600; text-transform:none; letter-spacing:0; }
  .wordrow{ display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
  .wordrow:last-child{ border-bottom:none; } .wordrow .w-front{ font-weight:600; min-width:120px; } .wordrow .w-back{ flex:1; color:var(--text-2); }

  /* Login */
  .login{ min-height:100vh; display:grid; place-items:center; padding:20px; }
  .login .card{ width:100%; max-width:380px; padding:28px; box-shadow:var(--shadow-md); }
  .login .lb{ display:flex; align-items:center; gap:11px; margin-bottom:18px; }
  .login .lb .logo{ width:38px; height:38px; border-radius:10px; display:grid; place-items:center; color:#fff; background:var(--primary); }
  .login .lb .logo svg{ width:20px; height:20px; }
  .login h2{ font-size:19px; } .login .subh{ color:var(--text-3); font-size:12.5px; margin-bottom:6px; }

  .toast{ position:fixed; right:20px; bottom:22px; background:var(--text); color:var(--bg); font-weight:600; padding:11px 16px; border-radius:9px; z-index:99;
    box-shadow:var(--shadow-lg); font-size:13px; max-width:min(90vw,340px); transform:translateX(120%); transition:transform .3s cubic-bezier(.2,.8,.2,1); }
  .toast.show{ transform:translateX(0); }
  .note{ font-size:12px; color:var(--text-3); margin-top:8px; }
  .warnbox{ background:var(--warn-soft); border:1px solid color-mix(in srgb,var(--warn) 30%, transparent); color:var(--warn); border-radius:9px; padding:11px 13px; font-size:12.5px; }
  .infobox{ background:var(--info-soft); border:1px solid color-mix(in srgb,var(--info) 25%, transparent); color:var(--info); border-radius:9px; padding:11px 13px; font-size:12.5px; }
  .ing-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; }
  .drop{ border:1.5px dashed var(--border-strong); border-radius:9px; padding:24px 16px; text-align:center; color:var(--text-3); font-weight:600; background:var(--panel-2); font-size:13px; }

  .scrim{ display:none; }
  @media(max-width:860px){
    .app{ grid-template-columns:1fr; } .app.collapsed{ grid-template-columns:1fr; }
    .side{ position:fixed; left:0; top:0; width:var(--side-w); transform:translateX(-104%); transition:transform .24s cubic-bezier(.4,0,.2,1); box-shadow:var(--shadow-lg); }
    .app.collapsed .side .brand .bt, .app.collapsed .nav .item .lbl, .app.collapsed .nav .navlabel, .app.collapsed .side .foot .who{ opacity:1; }
    body.nav-open .side{ transform:translateX(0); }
    body.nav-open .scrim{ display:block; position:fixed; inset:0; background:rgba(15,15,20,.45); z-index:39; }
    .topbar .tsearch{ width:auto; flex:1; }
    .content{ padding:16px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }
</style>
</head>

  const icon=(n,cls='i')=> `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IP[n]||''}</svg>`;

  /* ====== Theme ====== */

    const b=$('#themebtn'); if(b){ b.innerHTML=icon(t==='dark'?'sun':'moon'); b.setAttribute('aria-label', t==='dark'?'Chế độ sáng':'Chế độ tối'); } }

  /* ====== Trạng thái ====== */
  const A = { admin:null, role:null, tab:'overview', data:null, q:'', admins:[], lib:null, navOpen:false,
    collapsed:false, fresh:true, sort:{}, page:{}, selUsers:new Set() };
  const SESSION_KEY='cungnhau_admin_session', SIDE_KEY='cungnhau_admin_side';
  try{ A.collapsed = localStorage.getItem(SIDE_KEY)==='1'; }catch(e){}
  const PAGE_SIZE=10;

  /* ====== Vai trò ====== */
  const ROLES=['owner','manager','viewer'];
  const ROLE_LABEL={ owner:'Chủ hệ thống', manager:'Quản lý', viewer:'Chỉ xem' };
  const ROLE_DESC={ owner:'Toàn quyền + quản lý quản trị viên', manager:'Sửa/xóa người dùng, phòng, thư viện', viewer:'Chỉ được xem, không sửa/xóa' };
  const roleOf=(a)=>(a&&a.role)||'owner';

  /* ====== Xác thực ====== */
  async function listAdmins(){ const {data,error}=await sb.from('admins').select('username,role,created_at'); if(error) throw error; return data||[]; }
  async function getAdmin(u){ const {data,error}=await sb.from('admins').select('*').eq('username',u).maybeSingle(); if(error) throw error; return data; }
  async function createAdmin(o){ const {error}=await sb.from('admins').insert(o); if(error) throw error; }
  async function updateAdmin(u,patch){ const {error}=await sb.from('admins').update(patch).eq('username',u); if(error) throw error; }
  async function deleteAdmin(u){ const {error}=await sb.from('admins').delete().eq('username',u); if(error) throw error; }
  function saveSession(u){ try{ sessionStorage.setItem(SESSION_KEY,u); }catch(e){} }
  function loadSession(){ try{ return sessionStorage.getItem(SESSION_KEY); }catch(e){ return null; } }
  function clearSession(){ try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){} }

  /* ====== Dữ liệu ====== */
  async function loadAll(){
    const light='id,name,person_a,person_b,person_a_username,person_b_username,theme,start_date,streak,longest,last_active,created_at';
    const [users,spaces,decks,cards,quizzes,notes,duels,daily,invites,pushes]=await Promise.all([
      sb.from('users').select('*').order('created_at',{ascending:false}),
      sb.from('spaces').select(light).order('created_at',{ascending:false}),
      sb.from('decks').select('id,space_id,name,created_at'),
      sb.from('cards').select('id,space_id,deck_id'),
      sb.from('quizzes').select('id,space_id,title,status,score,total,created_at'),
      sb.from('notes').select('id,space_id,text,remind_at,done,created_at'),
      sb.from('duels').select('id,space_id,status,title,score_a,score_b,created_at'),
      sb.from('daily').select('id,space_id,day,question,answer_a,answer_b'),
      sb.from('invites').select('*'),
      sb.from('push_subscriptions').select('id,space_id,person'),
    ]);
    for(const r of [users,spaces,decks,cards,quizzes,notes,duels,daily,invites,pushes]) if(r.error) throw r.error;
    return { users:users.data||[], spaces:spaces.data||[], decks:decks.data||[], cards:cards.data||[], quizzes:quizzes.data||[],
      notes:notes.data||[], duels:duels.data||[], daily:daily.data||[], invites:invites.data||[], pushes:pushes.data||[] };
  }
  async function refresh(){ A.data=await loadAll(); }
  async function loadLibrary(){
    try{ const [t,w]=await Promise.all([ sb.from('library_topics').select('*').order('created_at',{ascending:false}), sb.from('library_words').select('id,topic_id,front,back,example,pos') ]);
      if(t.error) throw t.error; if(w.error) throw w.error; A.lib={ ok:true, topics:t.data||[], words:w.data||[] };
    }catch(e){ A.lib={ ok:false, topics:[], words:[], err:e.message }; } }
  async function loadAdminsList(){ try{ A.admins=await listAdmins(); }catch(e){ A.admins=[]; } }

  const bySpace=(arr,sid)=>arr.filter(x=>x.space_id===sid);
  const wordsOf=(tid)=>(A.lib?A.lib.words:[]).filter(w=>w.topic_id===tid);
  function spaceMembers(sp){ return { a:sp.person_a||sp.person_a_username||'?', b:sp.person_b||sp.person_b_username||'?' }; }
  function isActive(sp,days=7){ return sp.last_active && sp.last_active>=daysAgo(days); }

  /* ====== sort / paginate helpers ====== */
  function setSort(view,col){ const s=A.sort[view]; if(s&&s.col===col){ s.dir=s.dir==='asc'?'desc':'asc'; } else A.sort[view]={col,dir:'asc'}; A.page[view]=1; render(); }
  function applySort(list,view,acc){ const s=A.sort[view]; if(!s||!acc[s.col]) return list; const f=acc[s.col], dir=s.dir==='asc'?1:-1;
    return list.slice().sort((a,b)=>{ let x=f(a),y=f(b); if(x==null)x=''; if(y==null)y=''; if(typeof x==='number'&&typeof y==='number') return (x-y)*dir; return String(x).localeCompare(String(y),'vi')*dir; }); }
  function sortableTh(view,col,label){ const s=A.sort[view]; const on=s&&s.col===col; const ar=on?(s.dir==='asc'?icon('up','sarrow'):icon('down','sarrow')):'';
    return `<th class="sortable" data-act="sort" data-view="${view}" data-col="${col}">${esc(label)}${ar?`<span class="sarrow">${ar}</span>`:''}</th>`; }
  function paginate(list,view){ const total=Math.max(1,Math.ceil(list.length/PAGE_SIZE)); const p=Math.min(A.page[view]||1,total); A.page[view]=p;
    return { slice:list.slice((p-1)*PAGE_SIZE,(p-1)*PAGE_SIZE+PAGE_SIZE), page:p, total, count:list.length }; }
  function pager(view,pg){ if(pg.total<=1) return ''; return `<div class="pager">
      <span>${(pg.page-1)*PAGE_SIZE+1}–${Math.min(pg.page*PAGE_SIZE,pg.count)} / ${pg.count}</span>
      <button class="btn sm icon" data-act="page" data-view="${view}" data-d="-1" ${pg.page<=1?'disabled':''} aria-label="Trang trước">${icon('left')}</button>
      <span>${pg.page}/${pg.total}</span>
      <button class="btn sm icon" data-act="page" data-view="${view}" data-d="1" ${pg.page>=pg.total?'disabled':''} aria-label="Trang sau">${icon('right')}</button></div>`; }

  /* ====== animation sau render ====== */
  function countUp(el){ const to=+el.dataset.count||0; if(RM){ el.textContent=to.toLocaleString('vi-VN'); return; }
    const dur=650, t0=performance.now(); (function step(t){ const p=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-p,3);
      el.textContent=Math.round(to*e).toLocaleString('vi-VN'); if(p<1) requestAnimationFrame(step); })(t0); }
  function postRender(){
    if(!A.fresh) return;
    if(A.tab==='overview'){ $$('[data-count]').forEach(countUp); requestAnimationFrame(()=>$$('.bars .bar').forEach(b=>b.classList.add('in'))); }
    A.fresh=false;
  }

  /* ====== RENDER ====== */
  function render(){
    const app=$('#app');
    if(!A.admin){ app.innerHTML=viewLogin(); document.body.classList.remove('nav-open'); return; }
    const navHTML=NAV.filter(n=>!n.owner||canManageAdmins()).map(n=>{
      if(n.sep) return `<div class="navlabel">${esc(n.sep)}</div>`;
      return `<button class="item ${A.tab===n.id?'on':''}" data-act="nav" data-id="${n.id}" title="${esc(n.label)}">${icon(n.ic)}<span class="lbl">${esc(n.label)}</span></button>`;
    }).join('');
    const t=curTheme();
    const showSearch=['users','spaces','library'].includes(A.tab)&&(A.tab!=='library'||(A.lib&&A.lib.ok));
    app.innerHTML=`
      <div class="app ${A.collapsed?'collapsed':''}">
        <aside class="side">
          <div class="brand"><div class="logo">${icon('heart')}</div><div class="bt"><h1>cùng nhau</h1><small>Quản trị</small></div></div>
          <nav class="nav">${navHTML}</nav>
          <div class="foot"><div class="av">${esc((A.admin||'?').charAt(0).toUpperCase())}</div><div class="who"><b>${esc(A.admin)}</b><small>${ROLE_LABEL[A.role]||''}</small></div></div>
        </aside>
        <div class="main">
          <div class="topbar">
            <button class="btn ghost icon" data-act="toggle-side" aria-label="Thu gọn menu">${icon('panel')}</button>
            <div class="crumb">${esc(pageTitle(A.tab))}<small>${esc(pageSub[A.tab]||'')}</small></div>
            ${showSearch?`<div class="tsearch">${icon('search')}<input data-act="search" placeholder="${esc(searchPH[A.tab]||'Tìm…')}" value="${esc(A.q)}" aria-label="Tìm kiếm" /></div>`:'<div class="spacer"></div>'}
            <div class="spacer"></div>
            <button class="btn ghost icon" id="themebtn" data-act="theme" aria-label="${t==='dark'?'Chế độ sáng':'Chế độ tối'}">${icon(t==='dark'?'sun':'moon')}</button>
            <button class="btn ghost icon" data-act="reload" aria-label="Tải lại">${icon('refresh')}</button>
            <button class="btn sm" data-act="logout">${icon('logout')}<span>Đăng xuất</span></button>
          </div>
          <div class="content" id="page">${tabBody()}</div>
        </div>
        <div class="scrim" data-act="close-nav"></div>
      </div>`;
    document.body.classList.toggle('nav-open',A.navOpen);
    postRender();
  }
  function tabBody(){
    if(A.tab==='library') return viewLibrary();
    if(A.tab==='ingest') return viewIngest();
    if(A.tab==='admins') return canManageAdmins()?viewAdmins():viewOverview();
    if(!A.data) return skeletonOverview();
    if(A.tab==='overview') return viewOverview();
    if(A.tab==='users') return viewUsers();
    if(A.tab==='spaces') return viewSpaces();
    return '';
  }

  /* ---- Skeleton ---- */
  function skeletonOverview(){
    const cards=Array.from({length:4}).map(()=>`<div class="stat"><div class="sk" style="width:30px;height:30px;border-radius:8px;margin-left:auto"></div><div class="sk sk-row" style="width:50%;height:24px;margin-top:12px"></div><div class="sk sk-row" style="width:70%;margin-top:9px"></div></div>`).join('');
    const rows=Array.from({length:5}).map(()=>`<tr><td><div class="sk sk-row" style="width:60%"></div></td><td><div class="sk sk-row" style="width:40%"></div></td><td><div class="sk sk-row" style="width:30px"></div></td></tr>`).join('');
    return `<div class="sech">Đang tải…</div><div class="stats">${cards}</div><div class="tbl-wrap"><table><tbody>${rows}</tbody></table></div>`;
  }
  function emptyState(title,desc,btn){ return `<div class="empty"><div class="ico">${icon('inbox')}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p>${btn||''}</div>`; }

  /* ---- Login ---- */
  let noAdminYet=false;
  function viewLogin(){
    const brand=`<div class="lb"><div class="logo">${icon('heart')}</div><div><h2 style="font-size:16px">cùng nhau</h2><div class="subh" style="margin:0">Quản trị hệ thống</div></div></div>`;

        <label class="f">Mật khẩu</label><input id="ap" type="password" placeholder="Đặt mật khẩu" autocomplete="new-password" />
        <label class="f">Nhập lại mật khẩu</label><input id="ap2" type="password" placeholder="Nhập lại" autocomplete="new-password" />

      <label class="f">Tên đăng nhập</label><input id="au" placeholder="Tên quản trị" autocomplete="username" />
      <label class="f">Mật khẩu</label><input id="ap" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
      <button class="btn pri block" style="margin-top:16px" data-act="do-login">Đăng nhập</button>
      <div class="note" id="loginnote"></div></div></div>`;
  }

  /* ---- Tổng quan ---- */
  function viewOverview(){
    const d=A.data;
    const paired=d.spaces.filter(s=>s.person_a_username&&s.person_b_username).length;
    const active7=d.spaces.filter(s=>isActive(s,7)).length;
    const unpaired=d.users.filter(u=>!u.space_id).length;
    const newU7=d.users.filter(u=>u.created_at&&u.created_at.slice(0,10)>=daysAgo(7)).length;
    const activeDuels=d.duels.filter(x=>x.status==='active'||x.status==='waiting').length;
    const dueNotes=d.notes.filter(n=>!n.done&&n.remind_at&&n.remind_at<=todayISO()).length;
    const libTopics=A.lib&&A.lib.ok?A.lib.topics.length:0;
    const st=(ic,n,l,trend)=>`<div class="stat"><div class="top"><div class="l">${l}</div><div class="ic">${icon(ic)}</div></div><div class="n" data-count="${n}">0</div>${trend||''}</div>`;
    const days=[]; for(let i=13;i>=0;i--) days.push(daysAgo(i));
    const counts=days.map(dd=>d.users.filter(u=>u.created_at&&u.created_at.slice(0,10)===dd).length);
    const mx=Math.max(1,...counts);
    const bars=counts.map((c,i)=>`<div class="bar" style="height:${Math.round(c/mx*100)}%" title="${days[i]}: ${c}"></div>`).join('');
    const xlabels=days.map((dd,i)=> (i%3===0)?`<span>${dd.slice(8)}/${dd.slice(5,7)}</span>`:'<span></span>').join('');
    const recent=d.spaces.slice().sort((a,b)=>(b.last_active||'')<(a.last_active||'')?-1:1).slice(0,7);
    const rows=recent.map((s,i)=>{ const m=spaceMembers(s); return `<tr class="rowlink ${A.fresh?'rowin':''}" ${A.fresh?`style="animation-delay:${i*35}ms"`:''} data-act="open-space" data-id="${esc(s.id)}">
      <td><b>${esc(s.name||'(chưa đặt tên)')}</b><div class="muted mini">${esc(s.id)}</div></td><td>${esc(m.a)} · ${esc(m.b)}</td><td>${s.streak||0}</td>
      <td>${s.last_active?fmtDate(s.last_active):'<span class="muted">—</span>'}</td><td>${isActive(s,7)?'<span class="tag ok">Hoạt động</span>':'<span class="tag">Im ắng</span>'}</td></tr>`; }).join('');
    return `
      <div class="sech">Người dùng & phòng</div>
      <div class="stats">
        ${st('users',d.users.length,'Người dùng', newU7?`<div class="trend up">+${newU7} tuần này</div>`:'<div class="trend flat">—</div>')}
        ${st('heart',d.spaces.length,'Phòng')}
        ${st('users',paired,'Đã ghép đôi')}
        ${st('overview',active7,'Hoạt động 7 ngày')}
      </div>
      <div class="chartcard">
        <div class="ch-head"><div class="ch-title">Người dùng mới</div><div class="ch-sub">14 ngày gần đây · ${counts.reduce((a,b)=>a+b,0)} mới</div></div>
        <div class="bars">${bars}</div><div class="bars-x">${xlabels}</div>
      </div>
      <div class="sech">Nội dung</div>
      <div class="stats">
        ${st('book',libTopics,'Chủ đề thư viện')}
        ${st('book',d.cards.length,'Thẻ từ')}
        ${st('overview',d.quizzes.length,'Bài dò')}
        ${st('shield',d.duels.length,'Trận đấu')}
      </div>
      <div class="sech">Đang diễn ra</div>
      <div class="stats">
        ${st('shield',activeDuels,'Đấu đang diễn ra')}
        ${st('inbox',dueNotes,'Nhắc tới hạn')}
        ${st('users',unpaired,'User chưa ghép')}
        ${st('inbox',d.invites.filter(i=>i.status==='pending').length,'Lời mời chờ')}
      </div>
      <div class="sech">Phòng hoạt động gần đây</div>
      <div class="tbl-wrap"><table><thead><tr><th>Phòng</th><th>Thành viên</th><th>Chuỗi</th><th>Hoạt động cuối</th><th>Trạng thái</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="empty">Chưa có phòng nào</td></tr>'}</tbody></table></div>`;
  }

  /* ---- Người dùng ---- */
  function viewUsers(){
    const q=A.q.trim().toLowerCase();
    let list=A.data.users;
    if(q) list=list.filter(u=>(u.username||'').toLowerCase().includes(q)||(u.display||'').toLowerCase().includes(q)||(u.space_id||'').toLowerCase().includes(q));

  /* ---- Phòng ---- */

    list=applySort(list,'spaces',{ name:s=>(s.name||'').toLowerCase(), streak:s=>s.streak||0, active:s=>s.last_active||'' });
    const pg=paginate(list,'spaces');
    const rows=pg.slice.map((s,i)=>{ const m=spaceMembers(s); const cards=bySpace(A.data.cards,s.id).length;
      return `<tr class="rowlink ${A.fresh?'rowin':''}" ${A.fresh?`style="animation-delay:${i*30}ms"`:''} data-act="open-space" data-id="${esc(s.id)}">
        <td><b>${esc(s.name||'(chưa đặt tên)')}</b><div class="muted mini">${esc(s.id)}</div></td>
        <td>${esc(m.a)} <span class="muted">·</span> ${esc(m.b)}</td>
        <td>${s.streak||0}<div class="muted mini">kỷ lục ${s.longest||0}</div></td>

    if(!A.lib.ok) return `<div class="warnbox">Chưa có bảng thư viện chung trong Supabase. Mở Supabase → SQL Editor → chạy đoạn tạo bảng <b>library_topics</b> &amp; <b>library_words</b> trong <b>schema.sql</b>, rồi bấm Tải lại.<div class="note">Lỗi: ${esc(A.lib.err||'')}</div></div>`;

    let list=A.lib.topics; if(q) list=list.filter(t=>(t.title||'').toLowerCase().includes(q));
    list=applySort(list,'library',{ title:t=>(t.title||'').toLowerCase(), words:t=>wordsOf(t.id).length, created:t=>t.created_at||'' });
    const pg=paginate(list,'library');
    const rows=pg.slice.map((t,i)=>{ const n=wordsOf(t.id).length;
      return `<tr class="rowlink ${A.fresh?'rowin':''}" ${A.fresh?`style="animation-delay:${i*30}ms"`:''} data-act="open-topic" data-id="${esc(t.id)}">
        <td><b>${esc(t.title||'(chưa đặt tên)')}</b>${t.source?`<div class="muted mini">nguồn: ${esc(t.source)}</div>`:''}</td>

        <td class="muted mini">${fmtDateTime(t.created_at)}</td></tr>`; }).join('');
    const body= pg.count? `<div class="tbl-wrap"><table><thead><tr>${sortableTh('library','title','Chủ đề')}<th>Loại</th>${sortableTh('library','words','Số từ')}<th>Trạng thái</th>${sortableTh('library','created','Tạo lúc')}</tr></thead>
      <tbody>${rows}</tbody></table></div>${pager('library',pg)}`
      : (q? emptyState('Không tìm thấy','Không có chủ đề khớp “'+A.q+'”.')

      <div class="toolbar"><span class="count-badge">${pg.count} chủ đề</span><div class="spacer"></div>${canEdit()?`<button class="btn pri sm" data-act="new-topic">${icon('plus')}<span>Thêm chủ đề</span></button>`:''}</div>${body}`;

      notes=bySpace(A.data.notes,sid), duels=bySpace(A.data.duels,sid),

    const t=A.lib.topics.find(x=>x.id===tid); if(!t) return;

    const wlist=words.map(w=>`<div class="wordrow"><span class="w-front">${esc(w.front)}</span><span class="w-back">${esc(w.back||'')}${w.example?` <span class="muted mini">· ${esc(w.example)}</span>`:''}</span>${canEdit()?`<button class="btn danger sm icon" data-act="del-word" data-id="${esc(w.id)}" data-topic="${esc(tid)}" aria-label="Xóa">${icon('x')}</button>`:''}</div>`).join('');
    const body=`<button class="x" data-act="close-modal" aria-label="Đóng">${icon('x')}</button>
      <h2>${esc(t.title||'(chưa đặt tên)')}</h2><div class="subh">${KIND_LABEL[t.kind]||t.kind} · ${words.length} từ · ${t.status==='published'?'đang phát':'nháp'}${t.source?' · nguồn: '+esc(t.source):''}</div>
      ${canEdit()?`<div class="card" style="background:var(--panel-2);margin:8px 0 14px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:2;min-width:140px"><label class="f">Tên</label><input id="et_title" value="${esc(t.title||'')}" /></div>
          <div style="flex:1;min-width:120px"><label class="f">Loại</label><select id="et_kind">${Object.keys(KIND_LABEL).map(k=>`<option value="${k}" ${t.kind===k?'selected':''}>${KIND_LABEL[k]}</option>`).join('')}</select></div>
          <div style="flex:1;min-width:130px"><label class="f">Trạng thái</label><select id="et_status"><option value="published" ${t.status==='published'?'selected':''}>Đang phát</option><option value="draft" ${t.status!=='published'?'selected':''}>Nháp</option></select></div>
          <button class="btn pri sm" data-act="save-topic" data-id="${esc(tid)}">Lưu</button></div></div>`:''}
      <div class="sec-title">Danh sách từ <span class="badge">${words.length}</span></div>
      <div style="max-height:min(44vh,400px);overflow:auto;border:1px solid var(--border);border-radius:8px;padding:2px 12px;background:var(--panel)">${wlist||'<div class="muted mini" style="padding:14px 2px">Chưa có từ nào.</div>'}</div>
      ${canEdit()?`<div class="card" style="margin-top:14px"><div class="sec-title" style="margin-top:0">Thêm từ</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:110px"><label class="f">Từ / cụm</label><input id="w_front" placeholder="apple" /></div>
          <div style="flex:1;min-width:110px"><label class="f">Nghĩa</label><input id="w_back" placeholder="quả táo" /></div>
          <div style="flex:1.4;min-width:130px"><label class="f">Ví dụ (tuỳ chọn)</label><input id="w_ex" placeholder="I ate an apple." /></div>
          <button class="btn pri sm" data-act="add-word" data-id="${esc(tid)}">Thêm</button></div>
        <label class="f">Hoặc dán hàng loạt (mỗi dòng: từ = nghĩa = ví dụ)</label>
        <textarea id="w_bulk" placeholder="grape = quả nho&#10;contract = hợp đồng"></textarea>
        <button class="btn sm" style="margin-top:8px" data-act="bulk-word" data-id="${esc(tid)}">Thêm hàng loạt</button></div>`:''}
      <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">${canEdit()?`<button class="btn danger" data-act="del-topic" data-id="${esc(tid)}">${icon('trash')}<span>Xóa chủ đề</span></button>`:''}<div class="spacer"></div><button class="btn" data-act="close-modal">Đóng</button></div>`;
    $('#modal').innerHTML=`<div class="overlay" data-act="overlay"><div class="modal" data-act="stop">${body}</div></div>`;
  }
  function closeModal(){ $('#modal').innerHTML=''; }

  /* ====== HÀNH ĐỘNG ====== */
  async function doLogin(){ const u=$('#au').value.trim(), p=$('#ap').value; if(!u||!p){ toast('Nhập đủ tên và mật khẩu'); return; }
    let adm; try{ adm=await getAdmin(u); }catch(e){ toast('Lỗi kết nối: '+e.message); return; }
    if(!adm||adm.passcode!==hashPass(p)){ const n=$('#loginnote'); if(n)n.textContent='Sai tên đăng nhập hoặc mật khẩu.'; return; }
    A.admin=u; A.role=roleOf(adm); saveSession(u); await enterApp(); }
  async function doSetup(){ const u=$('#au').value.trim(), p=$('#ap').value, p2=$('#ap2').value;
    if(!u||!p){ toast('Nhập đủ tên và mật khẩu'); return; } if(p!==p2){ toast('Hai mật khẩu chưa khớp'); return; } if(p.length<4){ toast('Mật khẩu tối thiểu 4 ký tự'); return; }
    try{ await createAdmin({ username:u, passcode:hashPass(p), role:'owner', created_at:new Date().toISOString() }); }catch(e){ toast('Không tạo được: '+e.message); return; }
    noAdminYet=false; A.admin=u; A.role='owner'; saveSession(u); toast('Đã tạo tài khoản quản trị'); await enterApp(); }
  async function enterApp(){ A.navOpen=false; A.fresh=true; render();
    try{ await refresh(); }catch(e){ toast('Lỗi tải dữ liệu: '+e.message); } await loadLibrary(); if(canManageAdmins()) await loadAdminsList(); A.fresh=true; render(); }

  async function resetPin(username){ if(!requireEdit()) return; const pin=prompt('Đặt PIN/mật khẩu MỚI cho "'+username+'":'); if(pin==null) return; if(!pin.trim()){ toast('PIN trống'); return; }
    try{ const {error}=await sb.from('users').update({passcode:hashPass(pin.trim())}).eq('username',username); if(error) throw error; toast('Đã đặt lại PIN cho '+username); }catch(e){ toast('Lỗi: '+e.message); } }
  async function unpairUser(username){ if(!requireEdit()) return; const u=A.data.users.find(x=>x.username===username); if(!u) return;
    if(!confirm('Gỡ ghép đôi cho "'+username+'"? Rời khỏi phòng '+(u.space_id||'')+'. (Không xóa dữ liệu phòng.)')) return;
    try{ const {error}=await sb.from('users').update({space_id:null,person:null}).eq('username',username); if(error) throw error;
      if(u.space_id){ const sp=A.data.spaces.find(s=>s.id===u.space_id); if(sp){ const patch={}; if(sp.person_a_username===username) patch.person_a_username=null; if(sp.person_b_username===username) patch.person_b_username=null; if(Object.keys(patch).length) await sb.from('spaces').update(patch).eq('id',u.space_id); } }
      toast('Đã gỡ ghép '+username); await refresh(); render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function delUser(username){ if(!requireEdit()) return; if(!confirm('XÓA hẳn tài khoản "'+username+'"? Không hoàn tác. Dữ liệu phòng KHÔNG bị xóa.')) return;
    try{ const {error}=await sb.from('users').delete().eq('username',username); if(error) throw error;
      const u=A.data.users.find(x=>x.username===username); if(u&&u.space_id){ const sp=A.data.spaces.find(s=>s.id===u.space_id); if(sp){ const patch={}; if(sp.person_a_username===username) patch.person_a_username=null; if(sp.person_b_username===username) patch.person_b_username=null; if(Object.keys(patch).length) await sb.from('spaces').update(patch).eq('id',u.space_id); } }
      A.selUsers.delete(username); toast('Đã xóa tài khoản '+username); await refresh(); render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function bulkDelUser(){ if(!requireEdit()) return; const arr=[...A.selUsers]; if(!arr.length) return;
    if(!confirm('Xóa '+arr.length+' tài khoản đã chọn? Không hoàn tác.')) return;
    try{ for(const un of arr){ await sb.from('users').delete().eq('username',un); } A.selUsers.clear(); toast('Đã xóa '+arr.length+' tài khoản'); await refresh(); render(); }catch(e){ toast('Lỗi: '+e.message); } }

  async function saveSpace(sid){ if(!requireEdit()) return; const patch={ name:$('#e_name').value.trim()||null, start_date:$('#e_start').value||null, streak:parseInt($('#e_streak').value,10)||0, theme:$('#e_theme').value };
    try{ const {error}=await sb.from('spaces').update(patch).eq('id',sid); if(error) throw error; toast('Đã lưu phòng'); await refresh(); openSpaceModal(sid); render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function delSpace(sid){ if(!requireEdit()) return; const sp=A.data.spaces.find(s=>s.id===sid);
    if(!confirm('XÓA phòng "'+(sp?.name||sid)+'" (mã '+sid+')? Xóa toàn bộ nội dung phòng. Không hoàn tác.')) return;
    try{ const members=A.data.users.filter(u=>u.space_id===sid); for(const u of members) await sb.from('users').update({space_id:null,person:null}).eq('username',u.username);
      await sb.from('invites').delete().eq('space_id',sid); const {error}=await sb.from('spaces').delete().eq('id',sid); if(error) throw error;
      toast('Đã xóa phòng '+sid); closeModal(); await refresh(); render(); }catch(e){ toast('Lỗi: '+e.message); } }

  async function createTopic(){ if(!requireEdit()) return; const title=$('#t_title').value.trim(); if(!title){ toast('Nhập tên chủ đề'); return; }
    const kind=$('#t_kind').value, status=$('#t_status').value, source=$('#t_source').value.trim()||null; const id=genId();
    try{ let e1=(await sb.from('library_topics').insert({ id, title, kind, status, source, created_by:A.admin, created_at:new Date().toISOString() })).error; if(e1) throw e1;
      const bulk=parseBulk($('#t_bulk').value); if(bulk.length){ const rows=bulk.map((w,i)=>({ id:genId(), topic_id:id, front:w.front, back:w.back, example:w.example||null, pos:i })); const e2=(await sb.from('library_words').insert(rows)).error; if(e2) throw e2; }
      toast('Đã tạo chủ đề “'+title+'”'+(bulk.length?` (+${bulk.length} từ)`:'')); closeModal(); await loadLibrary(); A.tab='library'; A.fresh=true; render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function saveTopic(tid){ if(!requireEdit()) return; const patch={ title:$('#et_title').value.trim()||null, kind:$('#et_kind').value, status:$('#et_status').value };
    try{ const {error}=await sb.from('library_topics').update(patch).eq('id',tid); if(error) throw error; toast('Đã lưu chủ đề'); await loadLibrary(); openTopicModal(tid); render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function delTopic(tid){ if(!requireEdit()) return; const t=A.lib.topics.find(x=>x.id===tid);
    if(!confirm('Xóa chủ đề "'+(t?.title||tid)+'" và toàn bộ từ? Không hoàn tác.')) return;
    try{ const {error}=await sb.from('library_topics').delete().eq('id',tid); if(error) throw error; toast('Đã xóa chủ đề'); closeModal(); await loadLibrary(); render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function addWord(tid){ if(!requireEdit()) return; const front=$('#w_front').value.trim(); if(!front){ toast('Nhập từ'); return; }
    const back=$('#w_back').value.trim(), example=$('#w_ex').value.trim()||null, pos=wordsOf(tid).length;
    try{ const {error}=await sb.from('library_words').insert({ id:genId(), topic_id:tid, front, back, example, pos, created_at:new Date().toISOString() }); if(error) throw error; await loadLibrary(); openTopicModal(tid); render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function bulkWord(tid){ if(!requireEdit()) return; const bulk=parseBulk($('#w_bulk').value); if(!bulk.length){ toast('Chưa có dòng hợp lệ'); return; }
    const base=wordsOf(tid).length; const rows=bulk.map((w,i)=>({ id:genId(), topic_id:tid, front:w.front, back:w.back, example:w.example||null, pos:base+i, created_at:new Date().toISOString() }));
    try{ const {error}=await sb.from('library_words').insert(rows); if(error) throw error; toast('Đã thêm '+rows.length+' từ'); await loadLibrary(); openTopicModal(tid); render(); }catch(e){ toast('Lỗi: '+e.message); } }
  async function delWord(wid,tid){ if(!requireEdit()) return; try{ const {error}=await sb.from('library_words').delete().eq('id',wid); if(error) throw error; await loadLibrary(); openTopicModal(tid); render(); }catch(e){ toast('Lỗi: '+e.message); } }

  /* Crawl 1 URL qua backend VPS (vps-crawl) → AI bóc tách → lưu vào library_* */
  async function crawlRun(){ if(!requireEdit()) return;
    if(!CRAWL_API_BASE){ toast('Chưa cấu hình CRAWL_API_BASE'); return; }
    const url=($('#cr_url').value||'').trim(); if(!/^https?:\/\//.test(url)){ toast('Nhập URL hợp lệ (http/https)'); return; }
    const mode=$('#cr_mode').value, status=$('#cr_status').value;
    const btn=$('[data-act="crawl-run"]'); if(btn){ btn.disabled=true; btn.textContent='Đang crawl & bóc tách…'; }
    try{
      const res=await fetch(CRAWL_API_BASE.replace(/\/$/,'')+'/crawl',{ method:'POST',
        headers:{ 'Content-Type':'application/json', 'X-API-Key':CRAWL_API_KEY },
        body:JSON.stringify({ url, mode, status }) });
      const data=await res.json().catch(()=>({}));
      if(!res.ok) throw new Error(data.detail||data.error||('HTTP '+res.status));
      toast('Đã tạo “'+(data.title||'chủ đề')+'” (+'+(data.word_count||0)+' từ)');
      await loadLibrary(); A.tab='library'; A.fresh=true; render();
    }catch(e){ toast('Lỗi crawl: '+e.message); if(btn){ btn.disabled=false; btn.textContent='Bóc tách & lưu vào thư viện'; } }
  }

  async function addAdmin(){ if(!requireOwner()) return; const u=$('#na_user').value.trim(), p=$('#na_pass').value, role=$('#na_role').value;
    if(!u||!p){ toast('Nhập đủ tên và mật khẩu'); return; } if(p.length<4){ toast('Mật khẩu tối thiểu 4 ký tự'); return; } if(A.admins.some(a=>a.username===u)){ toast('Tên này đã tồn tại'); return; }
    try{ await createAdmin({ username:u, passcode:hashPass(p), role, created_at:new Date().toISOString() }); }catch(e){ toast('Không thêm được: '+e.message); return; }
    toast('Đã thêm quản trị viên '+u); await loadAdminsList(); render(); }
  async function delAdmin(username){ if(!requireOwner()) return; if(username===A.admin){ toast('Không thể tự xóa chính mình'); return; }
    const owners=A.admins.filter(a=>roleOf(a)==='owner'); const target=A.admins.find(a=>a.username===username);
    if(target&&roleOf(target)==='owner'&&owners.length<=1){ toast('Phải còn ít nhất 1 Chủ hệ thống'); return; }
    if(!confirm('Xóa quản trị viên "'+username+'"?')) return;
    try{ await deleteAdmin(username); }catch(e){ toast('Lỗi: '+e.message); return; } toast('Đã xóa '+username); await loadAdminsList(); render(); }
  async function changeAdminRole(username,role){ if(!requireOwner()) return; if(!ROLES.includes(role)) return; const target=A.admins.find(a=>a.username===username); if(!target) return;
    const owners=A.admins.filter(a=>roleOf(a)==='owner'); if(roleOf(target)==='owner'&&role!=='owner'&&owners.length<=1){ toast('Phải còn ít nhất 1 Chủ hệ thống'); await loadAdminsList(); render(); return; }
    try{ await updateAdmin(username,{role}); }catch(e){ toast('Lỗi: '+e.message); return; } if(username===A.admin) A.role=role; toast('Đã đổi vai trò '+username+' → '+ROLE_LABEL[role]); await loadAdminsList(); render(); }

  /* ====== Events ====== */
  document.addEventListener('click', async (e)=>{
    const el=e.target.closest('[data-act]'); if(!el) return;
    const act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
    switch(act){
      case 'stop': break;
      case 'overlay': case 'close-modal': closeModal(); break;
      case 'close-nav': A.navOpen=false; document.body.classList.remove('nav-open'); break;
      case 'toggle-side': if(window.innerWidth<=860){ A.navOpen=!A.navOpen; document.body.classList.toggle('nav-open',A.navOpen); } else { A.collapsed=!A.collapsed; try{ localStorage.setItem(SIDE_KEY,A.collapsed?'1':'0'); }catch(er){} const ap=$('.app'); if(ap) ap.classList.toggle('collapsed',A.collapsed); } break;
      case 'theme': toggleTheme(); break;
      case 'nav': A.tab=id; A.q=''; A.navOpen=false; A.fresh=true; A.selUsers.clear(); render(); if(id==='library'&&!A.lib){ await loadLibrary(); A.fresh=true; render(); } break;
      case 'do-login': doLogin(); break;
      case 'do-setup': doSetup(); break;
      case 'logout': clearSession(); A.admin=null; A.data=null; A.lib=null; render(); break;
      case 'reload': toast('Đang tải lại…'); A.fresh=true; try{ await refresh(); await loadLibrary(); if(canManageAdmins()) await loadAdminsList(); }catch(err){ toast('Lỗi: '+err.message); } render(); break;
      case 'sort': setSort(el.getAttribute('data-view'), el.getAttribute('data-col')); break;
      case 'page': { const v=el.getAttribute('data-view'); A.page[v]=(A.page[v]||1)+(+el.getAttribute('data-d')); render(); break; }
      case 'sel-user': { if(A.selUsers.has(id)) A.selUsers.delete(id); else A.selUsers.add(id); const pg=$('#page'); if(pg) pg.innerHTML=tabBody(); break; }
      case 'sel-clear': A.selUsers.clear(); render(); break;
      case 'bulk-del-user': bulkDelUser(); break;
      case 'open-space': openSpaceModal(id); break;
      case 'reset-pin': resetPin(id); break;
      case 'unpair-user': unpairUser(id); break;
      case 'del-user': delUser(id); break;
      case 'save-space': saveSpace(id); break;
      case 'del-space': delSpace(id); break;
      case 'crawl-run': crawlRun(); break;
      case 'new-topic': openNewTopicModal(); break;
      case 'create-topic': createTopic(); break;
      case 'open-topic': openTopicModal(id); break;
      case 'save-topic': saveTopic(id); break;
      case 'del-topic': delTopic(id); break;
      case 'add-word': addWord(id); break;
      case 'bulk-word': bulkWord(id); break;
      case 'del-word': delWord(id, el.getAttribute('data-topic')); break;
      case 'add-admin': addAdmin(); break;
      case 'del-admin': delAdmin(id); break;
    }
  });
  document.addEventListener('change',(e)=>{ if(e.target.classList.contains('rolesel')) changeAdminRole(e.target.getAttribute('data-user'), e.target.value); });
  document.addEventListener('input',(e)=>{ if(e.target.matches('[data-act="search"]')){ A.q=e.target.value; ['users','spaces','library'].forEach(v=>A.page[v]=1);
    const pg=$('#page'); if(pg) pg.innerHTML=tabBody(); const inp=$('[data-act="search"]'); if(inp){ inp.focus(); const v=inp.value; inp.value=''; inp.value=v; } } });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ const a=document.activeElement; if(a&&(a.id==='au'||a.id==='ap'||a.id==='ap2')){ noAdminYet?doSetup():doLogin(); } } if(e.key==='Escape'){ closeModal(); if(A.navOpen){ A.navOpen=false; document.body.classList.remove('nav-open'); } } });

  /* ====== Khởi động ====== */
  (async function boot(){
    render();
    let admins=[];
    try{ admins=await listAdmins(); }
    catch(e){ $('#app').innerHTML=`<div class="login"><div class="card"><h2>Cần thiết lập cơ sở dữ liệu</h2>
      <div class="warnbox" style="margin:10px 0">Chưa có bảng <b>admins</b> trong Supabase. Mở Supabase → SQL Editor → chạy <b>schema.sql</b> rồi tải lại.</div>
      <div class="note">Lỗi: ${esc(e.message)}</div><button class="btn pri block" style="margin-top:12px" onclick="location.reload()">Tải lại</button></div></div>`; return; }
    noAdminYet=admins.length===0; A.admins=admins;
    const sess=loadSession(); const me=sess&&admins.find(a=>a.username===sess);
    if(me){ A.admin=me.username; A.role=roleOf(me); await enterApp(); return; }
    render();
  })();
  </script>
</body>
</html>
